function pointInRoundRect(x, y, half, corner) {
  if (Math.abs(x) > half || Math.abs(y) > half) return false;
  const inset = half - corner;
  if (Math.abs(x) <= inset || Math.abs(y) <= inset) return true;
  const dx = Math.abs(x) - inset;
  const dy = Math.abs(y) - inset;
  return dx * dx + dy * dy <= corner * corner + 1e-8;
}

function aabbFitsRoundRect(box, half, corner) {
  const pts = [
    [box.min.x, box.min.y],
    [box.min.x, box.max.y],
    [box.max.x, box.min.y],
    [box.max.x, box.max.y],
  ];
  for (const [x, y] of pts) {
    if (!pointInRoundRect(x, y, half, corner)) return false;
  }
  return true;
}

/** AABB corners must sit inside a circle (Telegram video-avatar crop). */
function aabbFitsCircle(box, radius) {
  const r2 = radius * radius;
  const pts = [
    [box.min.x, box.min.y],
    [box.min.x, box.max.y],
    [box.max.x, box.min.y],
    [box.max.x, box.max.y],
  ];
  for (const [x, y] of pts) {
    if (x * x + y * y > r2 + 1e-8) return false;
  }
  return true;
}

function clampLocalXY(v, maxR) {
  const r = Math.hypot(v.x, v.y);
  if (r > maxR && r > 1e-8) {
    v.x *= maxR / r;
    v.y *= maxR / r;
  }
  return v;
}

function clampLocalBox(v, maxR) {
  v.x = Math.max(-maxR, Math.min(maxR, v.x));
  v.y = Math.max(-maxR, Math.min(maxR, v.y));
  return v;
}

function remainingInBox(origin, dir, cap) {
  let t = 1e6;
  if (Math.abs(dir.x) > 1e-6) t = Math.min(t, (Math.sign(dir.x) * cap - origin.x) / dir.x);
  if (Math.abs(dir.y) > 1e-6) t = Math.min(t, (Math.sign(dir.y) * cap - origin.y) / dir.y);
  return Math.max(0.35, Number.isFinite(t) ? t : cap);
}

function viewHalfAtLocalZ(lz) {
  const s = Math.max(1e-6, root.scale.x);
  const camZ = camera.position.z;
  const worldZ = lz * s + (root.position.z || 0);
  return Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * Math.max(6, camZ - worldZ);
}

function flattenSurgeDir(dir, surge) {
  dir.z *= (1 - 0.88 * Math.max(0, Math.min(1, surge || 0)));
  if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
  dir.normalize();
  return dir;
}

function fitsFxView(v, pad) {
  _fxFit.copy(v);
  root.localToWorld(_fxFit);
  const camZ = camera.position.z;
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * Math.max(6, camZ - _fxFit.z) * (1 - pad);
  return Math.abs(_fxFit.x) <= half && Math.abs(_fxFit.y) <= half;
}

function maxFxAlongDir(dir, extra, pad) {
  let lo = 0;
  let hi = 48;
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) * 0.5;
    _tmpA.copy(dir).multiplyScalar(mid + extra);
    if (fitsFxView(_tmpA, pad)) lo = mid;
    else hi = mid;
  }
  return lo;
}

function clampFxPoint(p, cap, pad) {
  clampLocalBox(p, cap);
  if (fitsFxView(p, pad)) return p;
  const ox = p.x;
  const oy = p.y;
  let lo = 0;
  let hi = 1;
  for (let i = 0; i < 12; i++) {
    const m = (lo + hi) * 0.5;
    p.x = ox * m;
    p.y = oy * m;
    if (fitsFxView(p, pad)) lo = m;
    else hi = m;
  }
  p.x = ox * lo;
  p.y = oy * lo;
  return p;
}

function signFxCap(surge) {
  const viewHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const s = Math.max(1e-6, root.scale.x);
  const pieceMax = (root.userData.burstLocalMax || 8) * 0.72;
  const canvasMax = (viewHalf * 0.88) / s;
  const k = Math.max(0, Math.min(1, surge || 0));
  const punch = k * k * (2 - k);
  return pieceMax + (canvasMax - pieceMax) * punch;
}

function compactSignBurst() {
  if (!SIGN_ONLY) return;
  const viewHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const worldMax = viewHalf * 0.68;
  const s = Math.max(1e-6, root.scale.x);
  const localMax = worldMax / s;
  root.userData.burstLocalMax = localMax;
  const chunks = pieces.filter((p) => p.kind === 'nChunk' && p.sphere);
  let maxR = signSphereR;
  for (const p of chunks) maxR = Math.max(maxR, p.sphere.length());
  const k = maxR > 1e-6 ? Math.min(1, (localMax * 0.78) / maxR) : 1;
  for (const p of chunks) p.sphere.multiplyScalar(k);
  signSphereR *= k;
}

function containRoot() {
  const hidden = [];
  for (const p of pieces) {
    if (p.kind === 'nChunk' || p.kind === 'tChunk') {
      hidden.push(p.mesh);
      p.mesh.visible = false;
      p.mesh.parent?.remove(p.mesh);
    }
  }
  /* Boom plates are full WORLD quads — hide so they cannot shrink the glyph fit */
  const boomHidden = [];
  if (SIGN_ONLY) {
    for (const p of pieces) {
      if (p.kind !== 'boom') continue;
      boomHidden.push({ mesh: p.mesh, vis: p.mesh.visible });
      p.mesh.visible = false;
    }
  }
  root.scale.setScalar(1);
  root.position.set(0, 0, 0);
  root.updateMatrixWorld(true);

  const viewSpan = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  if (SIGN_ONLY && brand.n) {
    brand.n.rotation.set(SIGN_REST_RX, SIGN_REST_RY, SIGN_REST_RZ);
    brand.n.updateMatrixWorld(true);
    const viewHalf = viewSpan * 0.5;
    /* Emoji: rounded square. Avatar frozen: true circle with modest pad (no tip clip). */
    const edgeIndent = 0.10;
    const A = viewHalf * (1 - edgeIndent);
    const CR = viewHalf * 2 * 0.18;
    /* ~55% green fill like the blue-canvas reference still. */
    const circleR = viewHalf * (AVATAR_BG ? 0.76 : 0.70);
    let lo = 0.2;
    let hi = 12;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) * 0.5;
      root.scale.setScalar(mid);
      root.position.set(0, 0, 0);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(brand.n);
      const c = box.getCenter(new THREE.Vector3());
      root.position.x -= c.x;
      root.position.y -= c.y;
      root.updateMatrixWorld(true);
      const box2 = new THREE.Box3().setFromObject(brand.n);
      const ok = AVATAR_BG
        ? aabbFitsCircle(box2, circleR)
        : aabbFitsRoundRect(box2, A, CR);
      if (ok) lo = mid;
      else hi = mid;
    }
    root.scale.setScalar(lo);
    root.position.set(0, 0, 0);
    root.updateMatrixWorld(true);
    const box3 = new THREE.Box3().setFromObject(brand.n);
    const c3 = box3.getCenter(new THREE.Vector3());
    root.position.x -= c3.x;
    root.position.y -= c3.y;
  } else {
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const span = Math.max(size.x, size.y, 1e-6);
    root.scale.setScalar((viewSpan * REST_SCALE) / span);
    root.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(root);
    const c = box2.getCenter(new THREE.Vector3());
    root.position.x -= c.x;
    root.position.y -= c.y;
  }

  for (const m of hidden) root.add(m);
  for (const b of boomHidden) b.mesh.visible = b.vis;
  for (const p of pieces) {
    p.rest = p.mesh.position.clone();
    p.restRot = p.mesh.rotation.clone();
    p.restScale = p.mesh.scale.x;
  }
  brand.nRest = brand.n.position.clone();
  if (brand.text) brand.tRest = brand.text.position.clone();
  root.userData.baseScale = root.scale.x;
  root.userData.basePos = { x: root.position.x, y: root.position.y };
  compactSignBurst();
}

function applyFrame(fr) {
  /* Sign-only: [0, 1) so Telegram's first frame is the hero and the loop joins. */
  const t = SIGN_ONLY ? (fr - 1) / TOTAL : (fr - 1) / Math.max(1, TOTAL - 1);
  const frozen = fr === 1;
  const hero = frozen && !SIGN_ONLY;
  const boomAmt = trap(t, 0.08, 0.22, 0.52, 0.88);
  const zoomN = trap(t, 0.12, 0.28, 0.46, 0.76);
  const zoomT = trap(t, 0.30, 0.46, 0.60, 0.86);
  const destroy = trap(t, 0.18, 0.34, 0.58, 0.94);
  /* Intact organism phase — strong until tear, then fades */
  const life = Math.max(0, 1 - destroy * 1.65);
  const lifeSoft = life * life;

  /* Wholes punch then shatter into reference-textured chunks */
  const crack = SIGN_ONLY ? trap(t, 0.06, 0.12, 0.20, 0.28) : 0;
  const coreFlash = SIGN_ONLY ? trap(t, 0.30, 0.38, 0.58, 0.68) : 0;
  const fxSurge = SIGN_ONLY ? trap(t, 0.42, 0.48, 0.53, 0.62) : 0;
  const rebuild = SIGN_ONLY ? trap(t, 0.62, 0.72, 0.86, 0.94) : 0;
  const sphereAmt = SIGN_ONLY ? trap(t, 0.20, 0.32, 0.54, 0.70) : 0;
  const showWhole = SIGN_ONLY ? (t < 0.20 || t > 0.92) : (destroy < 0.28);
  for (const w of brand.nWholes) w.visible = showWhole;
  for (const w of brand.tWholes) w.visible = showWhole;

  if (brand.n && showWhole) {
    const n = brand.n;
    const rp = brand.nRest;
    const ph = t * Math.PI * 2;
    const yaw = SIGN_ONLY ? 0 : 0.72;
    const pitch = SIGN_ONLY ? 0 : 0.34;
    if (hero) {
      /* Telegram thumb: N faces camera, slight 3D, no wobble. */
      n.position.set(rp.x, rp.y + 0.04, rp.z + 0.08);
      n.rotation.set(0.05, 0.07, 0);
      n.scale.setScalar(brand.nScale * 1.02);
    } else if (AVATAR_BG && frozen) {
      /* Exact reference still — single 3D N, no micro-wobble. */
      n.position.set(rp.x, rp.y, rp.z);
      n.rotation.set(SIGN_REST_RX, SIGN_REST_RY, SIGN_REST_RZ);
      n.scale.setScalar(brand.nScale);
    } else {
      /* Shine phase: gentle turn so green facets catch light */
      n.position.set(
        rp.x + Math.sin(ph * 2.1) * (SIGN_ONLY ? 0.015 : 0.1) * life,
        rp.y + (SIGN_ONLY ? 0 : 0.12 * zoomN) + Math.cos(ph * 1.8) * (SIGN_ONLY ? 0.012 : 0.08) * life,
        rp.z + (SIGN_ONLY ? 0 : 0.55 * zoomN + 0.2 * boomAmt) + Math.sin(ph * 2.4) * (SIGN_ONLY ? 0.03 : 0.14) * life,
      );
      const restRx = SIGN_ONLY ? SIGN_REST_RX : 0;
      const restRy = SIGN_ONLY ? SIGN_REST_RY : 0;
      const restRz = SIGN_ONLY ? SIGN_REST_RZ : 0;
      n.rotation.set(
        restRx - (SIGN_ONLY ? 0 : 0.1 * zoomN) + Math.sin(ph * 2.6) * pitch * life + Math.sin(ph * 5.2) * (SIGN_ONLY ? 0.012 : 0.05) * life,
        restRy + (SIGN_ONLY ? 0 : 0.12 * boomAmt) + Math.cos(ph * 1.7) * yaw * life + Math.sin(ph * 4.0) * (SIGN_ONLY ? 0.018 : 0.07) * life,
        restRz + (SIGN_ONLY ? 0 : 0.05 * zoomN) + Math.sin(ph * 2.5) * (SIGN_ONLY ? 0.016 : 0.16) * life,
      );
      const shinePulse = 1;
      n.scale.setScalar(brand.nScale * (SIGN_ONLY ? 1 : (1 + 0.04 * zoomN) * (1 + Math.sin(ph * 3.6) * 0.015 * life)) * shinePulse);
    }
  }
  if (brand.text && showWhole) {
    const tx = brand.text;
    const rp = brand.tRest;
    const ph = t * Math.PI * 2 + 1.7;
    if (hero) {
      /* Max wordmark read: frontal, slightly larger, lifted into the avatar circle. */
      tx.position.set(rp.x, rp.y + 0.18, rp.z + 0.42);
      tx.rotation.set(0.02, -0.04, 0);
      tx.scale.setScalar(brand.tScale * 1.14);
    } else {
      tx.position.set(
        rp.x + Math.cos(ph * 1.9) * 0.09 * life,
        rp.y - 0.06 * zoomT + Math.sin(ph * 2.3) * 0.07 * life,
        rp.z + 0.35 * zoomT + 0.12 * boomAmt + Math.cos(ph * 2.0) * 0.12 * life,
      );
      tx.rotation.set(
        0.08 * zoomT + Math.cos(ph * 2.4) * 0.32 * life + Math.sin(ph * 5.0) * 0.09 * life,
        -0.1 * zoomT + Math.sin(ph * 1.65) * 0.78 * life + Math.cos(ph * 3.8) * 0.14 * life,
        0.05 * zoomT + Math.sin(ph * 3.0 + 0.4) * 0.14 * life,
      );
      tx.scale.setScalar(brand.tScale * (1 + 0.05 * zoomT) * (1 + Math.cos(ph * 3.4) * 0.018 * life));
    }
  }

  /* Planar deformation of every brand layer (organism in the plane) */
  for (let si = 0; si < slabs.length; si++) {
    const s = slabs[si];
    const hideN = s.group === brand.n && !showWhole;
    const hideT = s.group === brand.text && !showWhole;
    if (hideN || hideT) continue;
    const warp = (SIGN_ONLY || hero) ? 0 : life * s.amp * (0.75 + 0.25 * Math.sin(t * 6 + s.phase));
    for (const geo of s.geos) deformSlabPlane(geo, warp, s.phase + si * 0.35, t);
  }

  if (SIGN_ONLY && crackOverlays.length) {
    for (const o of crackOverlays) {
      if (AVATAR_BG) {
        o.visible = false;
        o.material.opacity = 0;
        continue;
      }
      if (o.userData.onWhole) {
        const on = crack > 0.02 && t < 0.22;
        o.visible = on;
        o.material.opacity = on ? Math.min(1, crack * 1.5) : 0;
      } else {
        const live = t >= 0.18 && t <= 0.92;
        o.visible = live;
        o.material.opacity = live ? 0.95 : 0;
      }
    }
  }

  for (const p of pieces) {
    const isChunk = p.kind === 'nChunk' || p.kind === 'tChunk';
    if (SIGN_ONLY && isChunk) {
      const live = t >= 0.18 && t <= 0.92;
      if (!live) {
        p.mesh.visible = false;
        continue;
      }
      p.mesh.visible = true;
      const split = trap(t, 0.16, 0.22, 0.28, 0.40);
      const nCenter = brand.nRest || new THREE.Vector3();
      const away = p.rest.clone().sub(nCenter);
      if (away.lengthSq() < 1e-4) away.set(Math.cos(p.ang), Math.sin(p.ang), 0);
      away.normalize();
      const restPos = p.rest.clone().addScaledVector(away, split * 0.18);
      const spinY = t * Math.PI * 2.8;
      const cs = Math.cos(spinY);
      const sn = Math.sin(spinY);
      const sph = p.sphere
        ? new THREE.Vector3(
          p.sphere.x * cs - p.sphere.z * sn,
          p.sphere.y,
          p.sphere.x * sn + p.sphere.z * cs,
        )
        : restPos.clone();
      if (rebuild > 0.001) {
        p.mesh.position.lerpVectors(sph, p.rest, rebuild);
      } else if (sphereAmt > 0.001) {
        p.mesh.position.lerpVectors(restPos, sph, sphereAmt);
      } else {
        p.mesh.position.copy(restPos);
      }
      const tumble = (split * 0.32 + sphereAmt * 0.16) * (1 - rebuild);
      p.mesh.rotation.set(
        p.restRot.x + tumble * p.spin * 0.55,
        p.restRot.y + tumble * p.spin * 0.4 + spinY * sphereAmt * 0.22,
        p.restRot.z + tumble * 0.35,
      );
      p.mesh.scale.setScalar(p.restScale * (0.97 + 0.03 * rebuild));
      if (SIGN_ONLY) clampLocalXY(p.mesh.position, (root.userData.burstLocalMax || 8) * 0.88);
      continue;
    }
    const e = trap(t, p.delay, 0.16 + p.delay, 0.52, 0.9);
    const d = isChunk ? trap(t, 0.16 + p.delay, 0.32 + p.delay, 0.58, 0.94) : e;

    if (isChunk) {
      if (SIGN_ONLY && t > 0.96) {
        p.mesh.visible = false;
        continue;
      }
      p.mesh.visible = d > 0.02;
      if (d <= 0.02 && !(SIGN_ONLY && p.sphere)) continue;
    }

    const amt = isChunk ? d : Math.max(e, e * boomAmt);
    const fly = amt * p.power * (isChunk ? (SIGN_ONLY ? 1.35 : 1.28) : 1.05) * (SIGN_ONLY ? 0.72 : 0.95);
    const shrink = Math.max(SIGN_ONLY ? 0.28 : 0.68, 1 - amt * (isChunk ? (SIGN_ONLY ? 0.42 : 0.18) : 0.38));

    /* Intact: yaw/pitch so glossy side faces catch light */
    const layerLife = isChunk || hero ? 0 : lifeSoft * (1 - Math.min(1, amt * 2.4));
    const ph = p.phase + t * Math.PI * 2;
    const a = p.amp * layerLife;
    const ox = Math.sin(ph * p.w1 * 0.3) * 0.12 * a;
    const oy = Math.cos(ph * p.w2 * 0.28) * 0.1 * a;
    const oz = Math.sin(ph * p.w3 * 0.25 + p.ang) * 0.22 * a;
    const rx = Math.sin(ph * p.w1 * 0.32) * 0.4 * a + Math.sin(ph * 6.5) * 0.1 * a;
    const ry = Math.cos(ph * p.w2 * 0.26) * 0.72 * a + Math.sin(ph * 5.0 + p.ang) * 0.15 * a;
    const rz = Math.sin(ph * p.w3 * 0.35 + 1.3) * 0.18 * a;

    const flyPos = new THREE.Vector3(
      p.rest.x + Math.cos(p.ang) * fly + ox + (SIGN_ONLY ? 0 : p.ax * fly * 0.38),
      p.rest.y + Math.sin(p.ang) * fly + oy + (SIGN_ONLY ? 0 : p.ay * fly * 0.32),
      p.rest.z + amt * (0.5 + 1.0 * p.power) + oz,
    );
    const gather = SIGN_ONLY && isChunk && p.sphere ? trap(t, 0.42, 0.58, 0.84, 0.96) : 0;
    if (gather > 0.001) {
      p.mesh.visible = true;
      const spinY = gather * (t * Math.PI * 2.4 + p.ang * 0.3);
      const c = Math.cos(spinY);
      const s = Math.sin(spinY);
      const target = new THREE.Vector3(
        p.sphere.x * c - p.sphere.z * s,
        p.sphere.y,
        p.sphere.x * s + p.sphere.z * c,
      );
      p.mesh.position.lerpVectors(flyPos, target, gather);
      p.mesh.rotation.set(
        p.restRot.x + amt * p.spin * 2.4 + gather * 1.8 + rx,
        p.restRot.y + amt * p.spin * 2.0 + gather * 2.2 + ry,
        p.restRot.z + amt * p.spin * 2.8 + gather * 1.4 + rz,
      );
      p.mesh.scale.setScalar(p.restScale * (shrink * (1 - gather) + 0.92 * gather));
    } else {
      p.mesh.position.copy(flyPos);
      p.mesh.rotation.set(
        p.restRot.x + amt * p.spin * 2.4 + d * p.ax * 4.2 + rx,
        p.restRot.y + amt * p.spin * 2.0 + d * p.ay * 4.2 + ry,
        p.restRot.z + amt * p.spin * 2.8 + d * p.az * 4.8 + rz,
      );
      const breathe = 1 + Math.sin(ph * p.w1 * 0.4) * 0.025 * layerLife;
      p.mesh.scale.setScalar(p.restScale * shrink * breathe);
    }
    if (!SIGN_ONLY && p.kind === 'boom' && destroy > 0.22) {
      p.mesh.visible = false;
      continue;
    }
    if (SIGN_ONLY) {
      clampLocalXY(p.mesh.position, (root.userData.burstLocalMax || 8) * 0.82);
    } else if (!hero) {
      clampLocalBox(p.mesh.position, (root.userData.canvasCap || 8) * 0.9);
    }
  }

  /* Global shrink — keep FX inside canvas */
  const tear = trap(t, 0.16, 0.22, 0.34, 0.52);
  const tearFlash = trap(t, 0.17, 0.20, 0.26, 0.34);
  /* After pieces fly — screen-filling explosion */
  const fill = trap(t, 0.22, 0.34, 0.58, 0.88);
  const contain = SIGN_ONLY
    ? (1 - 0.16 * Math.max(boomAmt, destroy) - 0.06 * tear - 0.08 * fill
      - 0.04 * Math.max(0, (t - 0.55) / 0.35))
    : (1 - 0.14 * Math.max(boomAmt, destroy) - 0.04 * fill);
  const containSafe = SIGN_ONLY
    ? (1 - 0.08 * sphereAmt - 0.03 * coreFlash)
    : contain;

  /* Whole sign: yaw/pitch so the stack’s side volume reads */
  const shake = (SIGN_ONLY ? 0.02 : 0.35) + (SIGN_ONLY ? 0.04 : 0.65) * life;
  const wobble = 0.5 + 0.5 * lifeSoft;
  const wt = t;
  const sx = Math.sin(wt * 9.5) * (SIGN_ONLY ? 0.008 : 0.1) * shake + Math.sin(wt * 19.0) * (SIGN_ONLY ? 0.004 : 0.03) * shake;
  const sy = Math.cos(wt * 7.6 + 0.8) * (SIGN_ONLY ? 0.01 : 0.22) * shake + Math.sin(wt * 14.0) * (SIGN_ONLY ? 0.005 : 0.06) * shake;
  const sz = Math.sin(wt * 11.0 + 1.4) * (SIGN_ONLY ? 0.006 : 0.07) * shake + Math.cos(wt * 14.5) * (SIGN_ONLY ? 0.004 : 0.022) * shake;
  const base = root.userData.basePos || { x: 0, y: 0 };
  if (hero) {
    root.scale.setScalar(root.userData.baseScale);
    root.rotation.set(0, 0, 0);
    root.position.set(base.x, base.y + 0.22, 0);
  } else {
    root.scale.setScalar(root.userData.baseScale * containSafe * (1 + Math.sin(wt * 7.8) * (SIGN_ONLY ? 0.004 : 0.012) * life));
    root.rotation.set(
      sx + (SIGN_ONLY ? 0 : 0.05 * boomAmt) + (SIGN_ONLY ? 0.008 : 0.1) * destroy + Math.sin(wt * 5.5) * (SIGN_ONLY ? 0.01 : 0.08) * wobble,
      sy + (SIGN_ONLY ? 0 : 0.1 * boomAmt) + (SIGN_ONLY ? 0.01 : 0.14) * destroy + (SIGN_ONLY ? 0 : 0.04 * zoomT) + Math.cos(wt * 4.8) * (SIGN_ONLY ? 0.012 : 0.12) * wobble,
      sz + (SIGN_ONLY ? 0 : 0.02 * zoomN) + (SIGN_ONLY ? 0.004 : 0.05) * destroy + Math.sin(wt * 6.4 + 0.5) * (SIGN_ONLY ? 0.008 : 0.05) * wobble,
    );
    root.position.x = base.x + Math.sin(wt * 6.8) * (SIGN_ONLY ? 0.03 : 0.14) * shake + Math.sin(wt * 14.0) * (SIGN_ONLY ? 0.015 : 0.05) * shake;
    root.position.y = base.y + Math.cos(wt * 6.2) * (SIGN_ONLY ? 0.025 : 0.12) * shake + Math.cos(wt * 13.0) * (SIGN_ONLY ? 0.012 : 0.045) * shake;
    root.position.z = Math.sin(wt * 5.4 + 0.3) * (SIGN_ONLY ? 0.08 : 0.22) * life + Math.sin(wt * 11.5) * (SIGN_ONLY ? 0.03 : 0.07) * life;
  }

  fx.position.copy(root.position);
  fx.rotation.copy(root.rotation);
  fx.scale.setScalar(SIGN_ONLY ? 1 : root.scale.x);
  if (!SIGN_ONLY) {
    const viewHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
    root.userData.canvasCap = (viewHalf * 0.86) / Math.max(1e-6, root.scale.x);
    if (!hero) {
      const cap = root.userData.canvasCap;
      for (const p of pieces) {
        if (!p.mesh.visible) continue;
        clampLocalBox(p.mesh.position, cap * 0.9);
      }
    }
  }
  if (SIGN_ONLY) {
    fx.position.set(0, 0, 0);
    fx.rotation.set(0, 0, 0);
  }

  if (SIGN_ONLY) {
    if (AVATAR_BG) {
      keyLight.intensity = frozen ? 5.6 : 5.0;
      fillLight.intensity = frozen ? 2.8 : 2.5;
      rimLight.intensity = frozen ? 3.4 : 3.1;
      ambLight.intensity = frozen ? 1.05 : 0.95;
      scene.environmentIntensity = frozen ? 2.55 : 2.3;
    } else {
      keyLight.intensity = frozen ? 4.2 : 3.6;
      fillLight.intensity = frozen ? 1.85 : 1.75;
      rimLight.intensity = frozen ? 2.4 : 2.8;
      ambLight.intensity = frozen ? 0.68 : 0.62;
      scene.environmentIntensity = frozen ? 1.75 : 1.55;
    }
  } else if (hero) {
    /* Harder key/rim, cooler fill off the white wordmark, no orange fire wash. */
    keyLight.intensity = 3.35;
    fillLight.color.setHex(0xf4f0ff);
    fillLight.intensity = 0.32;
    rimLight.intensity = 1.85;
    ambLight.intensity = 0.36;
  } else {
    keyLight.intensity = 2.2;
    fillLight.color.setHex(0xa8c8ff);
    fillLight.intensity = 0.9;
    rimLight.intensity = 1.1;
    ambLight.intensity = 0.7;
  }
  if (SIGN_ONLY && shineSweep) {
    const ph = t * Math.PI * 2;
    shineSweep.position.set(7.2 + Math.sin(ph) * 1.4, 7.6, 13.5);
    shineSweep.intensity = (frozen ? (AVATAR_BG ? 11.0 : 8.0) : (AVATAR_BG ? 7.5 : 5.8)) * life;
  }
  if (SIGN_ONLY && shineKick) {
    const ph = t * Math.PI * 2;
    shineKick.intensity = (frozen ? (AVATAR_BG ? 8.5 : 6.0) : (AVATAR_BG ? 6.0 : 4.4)) * life;
    shineKick.position.set(-1.1 + Math.sin(ph) * 0.4, 2.3, 6.2);
  }
  updateSignShineGlance(t, life, frozen);

  camera.position.set(
    hero || SIGN_ONLY ? 0 : (0.15 + 2.0 * destroy + 1.0 * boomAmt + Math.sin(t * 55) * 0.15 * tear),
    hero || SIGN_ONLY ? 0 : (0.12 + 1.5 * destroy + 0.6 * boomAmt + Math.cos(t * 48) * 0.12 * tear),
    hero || SIGN_ONLY ? 42 : (42 + 0.4 * boomAmt - 2.2 * tear - 1.0 * fill + 0.6 * tearFlash),
  );
  camera.fov = hero || SIGN_ONLY ? 28 : (28 + 3 * tear + 4 * fill);
  camera.updateProjectionMatrix();
  camera.lookAt(0, 0, 0);

  const blast = trap(t, 0.10, 0.20, 0.52, 0.9);
  const flash = trap(t, 0.13, 0.17, 0.22, 0.32);

  fireLight.intensity = SIGN_ONLY ? (14 * coreFlash) : (hero ? 0 : (1.2 + 5 * blast + 3 * tear + 2.5 * fill));
  fireLight2.intensity = SIGN_ONLY ? (11 * coreFlash) : (hero ? 0 : (0.8 + 3.5 * blast + 2.5 * tear + 2 * fill));
  fireLight.color.setHex(SIGN_ONLY ? 0xff3a10 : 0xff5511);
  fireLight2.color.setHex(SIGN_ONLY ? 0xffc040 : 0xffcc44);
  fireLight.position.set(
    SIGN_ONLY ? 0 : (1.35 + Math.sin(t * 6.1) * 0.7),
    SIGN_ONLY ? 0 : (-0.85 + Math.cos(t * 5.4) * 0.55),
    SIGN_ONLY ? 0 : (2.2 + 1.4 * tear),
  );
  fireLight2.position.set(
    SIGN_ONLY ? 1 : (-1.55 + Math.cos(t * 4.8) * 0.5),
    SIGN_ONLY ? 1.5 : (1.25 + Math.sin(t * 7.2) * 0.4),
    SIGN_ONLY ? 3 : 3.1,
  );

  /* ——— Tongues: skip winding ribbons (they read as fur). Fires are signFlames. ——— */
  for (const tongue of tongues) {
    for (const L of tongue.layers) L.mat.opacity = 0;
    tongue.group.visible = false;
  }

  if (SIGN_ONLY) {
    root.updateMatrixWorld(true);
    root.userData.fxCap = signFxCap(fxSurge);
  }

  for (const f of signFlames) {
    const e = SIGN_ONLY
      ? coreFlash * (0.82 + 0.18 * trap(t, 0.42 + f.delay, 0.50 + f.delay, 0.62, 0.74))
      : (hero ? 0 : Math.max(blast, tear, fill) * (0.75 + 0.25 * trap(t, 0.12 + f.delay, 0.22 + f.delay, 0.58, 0.86)));
    if (e < 0.05) {
      f.mesh.visible = false;
      continue;
    }
    f.mesh.visible = true;
    const flutter = 0.65 + 0.4 * Math.abs(Math.sin(t * 21 + f.phase0));
    const dir = (f.aim || f.dir).clone();
    dir.add(new THREE.Vector3(
      Math.sin(t * 9.4 + f.phase0) * 0.35,
      Math.cos(t * 8.1 + f.seed) * 0.32,
      Math.sin(t * 6.2 + f.phase0 * 0.7) * 0.18,
    ));
    if (SIGN_ONLY) flattenSurgeDir(dir, fxSurge * 0.25);
    else dir.normalize();
    const R = signSphereR || 12.5;
    const cap = SIGN_ONLY ? (root.userData.fxCap || 8) : (root.userData.canvasCap || 8);
    const want = SIGN_ONLY
      ? R * f.lenMul * f.breakMul * (0.4 + 0.6 * e) * flutter * (1 + fxSurge * 3.8)
      : (4.4 + 5.8 * e) * f.lenMul * f.breakMul * flutter;
    if (SIGN_ONLY && f.origin) {
      f.mesh.position.copy(f.origin).multiplyScalar(0.5 + 0.7 * fxSurge);
      clampFxPoint(f.mesh.position, cap * (0.2 + 0.22 * fxSurge), 0.16);
    } else if (SIGN_ONLY) {
      f.mesh.position.copy(dir).multiplyScalar(0.15 + 0.35 * e);
      clampLocalXY(f.mesh.position, cap * 0.35);
    } else {
      f.mesh.position.copy(f.origin).multiplyScalar(0.55 + 0.9 * e).addScaledVector(dir, 0.2);
      clampLocalBox(f.mesh.position, cap * 0.55);
    }
    const len = SIGN_ONLY
      ? Math.min(want, maxFxAlongDir(dir, 0.45, 0.16), cap * 0.9)
      : Math.min(want, remainingInBox(f.mesh.position, dir, cap * 0.94));
    f.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    f.mesh.rotateZ((f.twist || 0) + Math.sin(t * 9 + f.phase0) * 0.45);
    f.mesh.rotateX((f.spin || 0) * e * 0.4);
    f.mesh.scale.set(
      f.wide * (0.7 + 0.45 * e) * (1 + fxSurge * 0.4) * (0.75 + 0.35 * flutter),
      len,
      1,
    );
    f.mesh.material.opacity = Math.min(1, 0.7 + e * 0.4);
  }

  if (SIGN_ONLY) {
    const sparkBursts = [
      { t0: 0.31, flight: 0.18 },
      { t0: 0.38, flight: 0.16 },
      { t0: 0.44, flight: 0.14 },
      { t0: 0.49, flight: 0.2 },
      { t0: 0.56, flight: 0.15 },
    ];
    const R = signSphereR || 12.5;
    const fxCap = root.userData.fxCap || (root.userData.burstLocalMax || 8) * 0.72;
    for (const sp of signSparks) {
      const b0 = sparkBursts[sp.burst % sparkBursts.length];
      const b1 = sparkBursts[(sp.burst + 3) % sparkBursts.length];
      const k = Math.max(
        sparkFlightK(t, b0.t0, sp.delay, b0.flight),
        sparkFlightK(t, b1.t0, sp.delay * 0.7, b1.flight * 0.85),
      );
      const flickRnd = seeded(((sp.seed * 97) | 0) + Math.floor(t * 48) * 13)();
      if (k < 0 || coreFlash < 0.04 || flickRnd > 0.78 + 0.16 * fxSurge) {
        sp.mesh.visible = false;
        continue;
      }
      sp.mesh.visible = true;
      const dir = sp.dir.clone().lerp(sp.side, 0.45 + 0.4 * fxSurge + 0.15 * Math.sin(t * 14 + sp.seed));
      flattenSurgeDir(dir, fxSurge * 0.28);
      const travel = Math.min(1, k);
      const e = 1 - (1 - travel) * (1 - travel);
      const tail = (sp.len || 1.6) * sp.breakMul * (0.55 + 0.4 * fxSurge);
      const want = 0.12 + e * R * sp.reachMul * (1 + fxSurge * 2.8);
      const dist = Math.min(want, maxFxAlongDir(dir, tail, 0.16), Math.max(0.2, fxCap));
      sp.mesh.position.copy(sp.origin).multiplyScalar(0.4 + 0.75 * fxSurge).addScaledVector(dir, dist * 0.7);
      clampFxPoint(sp.mesh.position, Math.max(0.4, fxCap), 0.16);
      sp.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      sp.mesh.rotateZ(sp.twist + t * sp.spin * 0.35);
      const fade = k < 0.1 ? k / 0.1 : k > 0.62 ? Math.max(0, 1 - (k - 0.62) / 0.5) : 1;
      const pop = 0.75 + 0.25 * Math.sin(t * 22 + sp.seed * 9);
      sp.chip.material.opacity = Math.min(1, fade * pop);
      sp.chip.scale.set(
        (0.85 + 0.4 * (1 - travel)) * (0.7 + 0.5 * sp.breakMul),
        sp.breakMul * (0.55 + 0.7 * (1 - travel * 0.45)) * (1 + fxSurge * 0.85),
        1,
      );
      const showHead = sp.headAmt > 0.01 && flickRnd < 0.35;
      sp.head.visible = showHead;
      sp.head.material.opacity = showHead ? fade * pop * sp.headAmt : 0;
      sp.head.scale.setScalar(0.55 + 0.5 * (1 - travel));
    }
  } else if (!hero) {
    const burst = Math.max(blast, tear, fill);
    for (const sp of signSparks) {
      const k = Math.max(
        sparkFlightK(t, 0.14 + sp.delay * 0.35, 0, 0.55),
        sparkFlightK(t, 0.32 + sp.delay * 0.2, 0, 0.42),
      );
      const flickRnd = seeded(((sp.seed * 97) | 0) + Math.floor(t * 36) * 13)();
      if (k < 0.02 || burst < 0.08 || flickRnd > 0.88) {
        sp.mesh.visible = false;
        continue;
      }
      sp.mesh.visible = true;
      const dir = sp.dir.clone().lerp(sp.side, 0.35 + 0.4 * Math.sin(t * 9 + sp.seed));
      dir.z *= 0.4;
      dir.normalize();
      const travel = Math.min(1, k);
      const e = 1 - (1 - travel) * (1 - travel);
      const cap = root.userData.canvasCap || 8;
      sp.mesh.position.copy(sp.origin).multiplyScalar(0.35 + 0.4 * e);
      clampLocalBox(sp.mesh.position, cap * 0.42);
      const dist = Math.min(0.9 + e * 7.4 * sp.reachMul, remainingInBox(sp.mesh.position, dir, cap * 0.94));
      sp.mesh.position.addScaledVector(dir, dist * 0.55);
      clampLocalBox(sp.mesh.position, cap * 0.94);
      sp.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      sp.mesh.rotateZ(sp.twist + t * sp.spin * 0.45);
      const fade = k < 0.12 ? k / 0.12 : k > 0.62 ? Math.max(0, 1 - (k - 0.62) / 0.45) : 1;
      const pop = 0.8 + 0.2 * Math.sin(t * 18 + sp.seed * 9);
      sp.chip.material.opacity = Math.min(1, fade * pop);
      sp.chip.scale.set(
        1.2 + 0.55 * (1 - travel),
        Math.min(2.4, 1.45 + 1.15 * (1 - travel * 0.35) * sp.breakMul),
        1,
      );
      const showHead = sp.headAmt > 0.01 && flickRnd < 0.5;
      sp.head.visible = showHead;
      sp.head.material.opacity = showHead ? fade * pop * Math.max(0.4, sp.headAmt) : 0;
      sp.head.scale.setScalar(0.85 + 0.55 * (1 - travel));
    }
  } else {
    for (const sp of signSparks) sp.mesh.visible = false;
  }

  /* Elegant thin yellow/blue lightning + branches */
  const frameKey = Math.floor(t * (SIGN_ONLY ? 36 : 18));
  const signBoltPal = [0xff5a08, 0xffcc33, 0x44c8ff, 0xffe8a0, 0xff3377, 0x88ff55, 0xffffff, 0xffaa22];
  const boltOrigins = [
    [new THREE.Vector3(0.55, -0.4, 1), new THREE.Vector3(6.8, 4.2, 2.4)],
    [new THREE.Vector3(-0.8, 0.35, 1), new THREE.Vector3(-6.1, -1.8, 2.1)],
    [new THREE.Vector3(0.2, 0.7, 1.1), new THREE.Vector3(4.1, -5.4, 2.8)],
    [new THREE.Vector3(-0.35, -0.65, 1), new THREE.Vector3(-5.2, 5.1, 2.2)],
    [new THREE.Vector3(0.9, 0.15, 1.2), new THREE.Vector3(1.8, 6.6, 1.6)],
    [new THREE.Vector3(-0.15, 0.05, 1), new THREE.Vector3(-2.4, -6.2, 2.0)],
    [new THREE.Vector3(0.45, 0.55, 0.9), new THREE.Vector3(7.2, -0.8, 2.6)],
    [new THREE.Vector3(-0.7, -0.2, 1.05), new THREE.Vector3(-7.0, 2.6, 1.9)],
  ];

  for (let bi = 0; bi < bolts.length; bi++) {
    const bolt = bolts[bi];
    if (SIGN_ONLY) {
      const on = coreFlash * (0.88 + 0.12 * ((bolt.seed % 9) / 9));
      if (on < 0.06) {
        bolt.glowMat.opacity = 0;
        bolt.coreMat.opacity = 0;
        bolt.glow.visible = false;
        bolt.core.visible = false;
        continue;
      }
      const rnd = seeded((bolt.seed | 0) + frameKey * 11 + bi);
      if (rnd() > 0.82 + 0.12 * fxSurge) {
        bolt.glow.visible = false;
        bolt.core.visible = false;
        continue;
      }
      const R = signSphereR || 12.5;
      const cap = root.userData.fxCap || (root.userData.burstLocalMax || 8) * 0.72;
      const reach = R * (0.22 + rnd() * 0.42) * (1 + fxSurge * 3.6);
      _tmpA.copy(randUnit3(rnd)).multiplyScalar(0.55 + rnd() * R * 0.55);
      _tmpC.copy(randUnit3(rnd));
      flattenSurgeDir(_tmpC, fxSurge * 0.22);
      _tmpB.copy(_tmpA).addScaledVector(_tmpC, reach * (0.4 + rnd() * 0.85));
      clampFxPoint(_tmpA, cap, 0.16);
      clampFxPoint(_tmpB, cap, 0.16);
      if (bolt.lastKey !== frameKey) {
        setBoltGeom(bolt, _tmpA, _tmpB, frameKey + bi * 3 + (bolt.seed | 0), 1.15 + rnd() * 0.7 + fxSurge * 0.45);
        bolt.lastKey = frameKey;
      }
      const flick = Math.sin(t * 90 + bolt.seed) > -0.28 ? 1 : 0.18;
      bolt.glow.visible = true;
      bolt.core.visible = true;
      bolt.glowMat.depthTest = true;
      bolt.coreMat.depthTest = true;
      bolt.glowMat.blending = THREE.AdditiveBlending;
      bolt.coreMat.blending = THREE.AdditiveBlending;
      bolt.glowMat.color.setHex(0xa8fff4);
      bolt.coreMat.color.setHex(0xffffff);
      bolt.glowMat.opacity = Math.min(1, on * 1.5) * flick;
      bolt.coreMat.opacity = Math.min(1, on * 1.7) * flick;
      continue;
    }
    const pulse = trap(t, 0.16 + (bolt.seed % 7) * 0.018, 0.22, 0.46, 0.78);
    const on = pulse * 0.85 + tear * 0.25 + fill * 0.28;
    const rnd = seeded((bolt.seed | 0) + frameKey * 13 + bi * 17);
    if (hero || on < 0.08 || rnd() > 0.82) {
      bolt.glowMat.opacity = 0;
      bolt.coreMat.opacity = 0;
      bolt.glow.visible = false;
      bolt.core.visible = false;
      continue;
    }
    const cap = root.userData.canvasCap || 8;
    _tmpA.set(
      (rnd() - 0.55) * cap * 1.15,
      (rnd() - 0.48) * cap * 1.05,
      0.35 + rnd() * 1.6,
    );
    clampLocalBox(_tmpA, cap * 0.62);
    _tmpC.copy(randUnit3(rnd));
    _tmpC.z *= 0.22;
    _tmpC.normalize();
    const reach = Math.min(3.4 + rnd() * 7.2, remainingInBox(_tmpA, _tmpC, cap * 0.94));
    _tmpB.copy(_tmpA).addScaledVector(_tmpC, reach);
    clampLocalBox(_tmpB, cap * 0.94);
    if (bolt.lastKey !== frameKey) {
      setBoltGeom(bolt, _tmpA, _tmpB, frameKey + bi * 3 + (bolt.seed | 0), 1.05 + rnd() * 0.7);
      bolt.lastKey = frameKey;
    }
    const flick = Math.sin(t * 88 + bolt.seed) > -0.22 ? 1 : 0.12;
    const pal = [0xff6a18, 0x44aaff, 0xffdd55, 0xff3377, 0x88ffcc, 0xffaa33];
    bolt.glow.visible = true;
    bolt.core.visible = true;
    bolt.glowMat.color.setHex(pal[(bi * 3 + frameKey) % pal.length]);
    bolt.coreMat.color.setHex(0xfff8e8);
    bolt.glowMat.opacity = Math.min(0.9, on * 0.85) * flick;
    bolt.coreMat.opacity = Math.min(1, on) * flick;
  }

  for (let bi = 0; bi < boltBranches.length; bi++) {
    const bolt = boltBranches[bi];
    if (SIGN_ONLY) {
      const on = coreFlash * 0.95;
      if (on < 0.1) {
        bolt.glow.visible = false;
        bolt.core.visible = false;
        continue;
      }
      const rnd = seeded((bolt.seed | 0) + frameKey * 7 + bi + 20);
      if (rnd() > 0.45 + 0.3 * fxSurge) {
        bolt.glow.visible = false;
        bolt.core.visible = false;
        continue;
      }
      const R = signSphereR || 12.5;
      const cap = root.userData.fxCap || (root.userData.burstLocalMax || 8) * 0.72;
      const mid = randUnit3(rnd).multiplyScalar(0.7 + rnd() * R * 0.5);
      _tmpC.copy(randUnit3(rnd));
      flattenSurgeDir(_tmpC, fxSurge * 0.22);
      const tip = mid.clone().addScaledVector(_tmpC, R * (0.18 + rnd() * 0.38) * (1 + fxSurge * 3.4));
      clampFxPoint(mid, cap, 0.16);
      clampFxPoint(tip, cap, 0.16);
      if (bolt.lastKey !== frameKey) {
        setBoltGeom(bolt, mid, tip, frameKey + bi + 9, 1.05 + rnd() * 0.35 + fxSurge * 0.55);
        bolt.lastKey = frameKey;
      }
      const flick = Math.sin(t * 118 + bolt.seed) > -0.15 ? 1 : 0.14;
      bolt.glow.visible = true;
      bolt.core.visible = true;
      bolt.glowMat.depthTest = true;
      bolt.coreMat.depthTest = true;
      bolt.glowMat.blending = THREE.AdditiveBlending;
      bolt.coreMat.blending = THREE.AdditiveBlending;
      const col = signBoltPal[(rnd() * signBoltPal.length) | 0];
      bolt.glowMat.color.setHex(col);
      bolt.coreMat.color.setHex(0xfffce8);
      bolt.glowMat.opacity = Math.min(1, on * 1.25) * flick;
      bolt.coreMat.opacity = Math.min(1, on * 1.45) * flick;
      continue;
    }
    const on = trap(t, 0.18 + bi * 0.02, 0.24, 0.42, 0.72) * (0.5 + 0.5 * fill + 0.3 * tear);
    if (!SIGN_ONLY || on < 0.1) {
      bolt.glow.visible = false;
      bolt.core.visible = false;
      continue;
    }
    const main = boltOrigins[bi % boltOrigins.length];
    const mid = new THREE.Vector3().lerpVectors(main[0], main[1], 0.28 + (bi % 4) * 0.08);
    mid.multiplyScalar(SIGN_ONLY ? 0.42 : (0.7 + 0.4 * fill));
    const tip = mid.clone().add(new THREE.Vector3(
      ((bi % 2) * 2 - 1) * (SIGN_ONLY ? 1.1 : 1.8 + (bi % 5) * 0.55) * (SIGN_ONLY ? 1 : (0.9 + fill)),
      ((bi % 3) - 1) * (SIGN_ONLY ? 0.95 : 1.6 + (bi % 2) * 0.7) * (SIGN_ONLY ? 1 : (0.9 + fill)),
      SIGN_ONLY ? 0.8 : (1.5 + fill),
    ));
    if (SIGN_ONLY) {
      clampXY(mid, 3.6);
      clampXY(tip, 6.0);
    }
    if (bolt.lastKey !== frameKey) {
      setBoltGeom(bolt, mid, tip, frameKey + bi + 9, SIGN_ONLY ? 0.95 : 0.55);
      bolt.lastKey = frameKey;
    }
    const flick = Math.sin(t * 130 + bolt.seed) > 0 ? 1 : 0.1;
    bolt.glow.visible = true;
    bolt.core.visible = true;
    if (SIGN_ONLY) {
      const pal = [0xffee33, 0x44eeff, 0xff66cc, 0xffffff, 0x88ff44, 0xff9933, 0xaa77ff, 0x66ffff];
      bolt.glowMat.blending = THREE.NormalBlending;
      bolt.coreMat.blending = THREE.NormalBlending;
      bolt.glowMat.color.setHex(pal[(frameKey * 5 + bi * 11) % pal.length]);
      bolt.coreMat.color.setHex(0xffffff);
    }
    bolt.glowMat.opacity = on * (SIGN_ONLY ? 1.0 : 0.55) * flick;
    bolt.coreMat.opacity = on * (SIGN_ONLY ? 1.2 : 0.85) * flick;
  }
  boltLight.intensity = SIGN_ONLY ? 18 * coreFlash : (hero ? 0 : 2.5 * blast + 3 * tear + 3.5 * fill);
  boltLight.color.setHex(SIGN_ONLY ? (Math.sin(t * 28) > 0 ? 0xff6a10 : 0x2a8cff) : (Math.sin(t * 28) > 0 ? 0xffee66 : 0x66eeff));
  boltLight.position.set(
    SIGN_ONLY ? 0 : (Math.sin(t * 11.4) * 2.4),
    SIGN_ONLY ? 0 : (Math.cos(t * 9.1) * 1.8),
    SIGN_ONLY ? 0 : (2.4 + fill),
  );

  /* No radial fireball flash — that reads as fireworks. */
  if (screenBurst) screenBurst.visible = false;

  for (const ct of camTongues) {
    ct.mat.opacity = 0;
    ct.mesh.visible = false;
  }

  for (const cb of camBolts) {
    cb.glowMat.opacity = 0;
    cb.coreMat.opacity = 0;
    cb.glow.visible = false;
    cb.core.visible = false;
  }

  if (AVATAR_BG) {
    const bgPulse = Math.max(
      trap(t, 0.00, 0.08, 0.18, 0.30),
      crack * 0.55,
      coreFlash * 0.9,
      fxSurge * 0.75,
      rebuild * 0.5,
      0.25 + 0.25 * Math.sin(t * Math.PI * 2),
    );
    paintAvatarBackground(t, Math.min(1, bgPulse));
  }

  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (fr) => { applyFrame(fr); return fr; };
window.TOTAL = TOTAL;
window.ready = false;

(async () => {
  try {
    await build();
    containRoot();
    applyFrame(1);
    window.ready = true;
    console.log('TRUE3D_READY');
  } catch (e) {
    console.error('TRUE3D_FAIL', e);
  }
})();
</script>
</body>
