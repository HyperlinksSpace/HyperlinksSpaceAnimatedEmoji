<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign video avatar preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1a2e24;
      background: #eef2f0;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 3.5rem;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    p.lead {
      margin: 0 0 0.75rem;
      color: #5a7166;
      font-size: 0.95rem;
      line-height: 1.45;
      max-width: 40rem;
    }
    code {
      display: inline-block;
      margin: 0.15rem 0 1.25rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: #fff;
      border: 1px solid #d5ddd8;
      font-size: 0.82rem;
      color: #1a6b45;
    }
    .themes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 700px) {
      .themes { grid-template-columns: 1fr; }
    }
    .theme {
      border-radius: 16px;
      padding: 1.15rem 1.15rem 1.35rem;
    }
    .theme.light {
      background: #ffffff;
      border: 1px solid #dde3df;
    }
    .theme.dark {
      background: #0e1621;
      border: 1px solid #1c2a38;
      color: #e8f5ee;
    }
    .theme h2 {
      margin: 0 0 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .circle-wrap {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
    }
    .theme.dark .circle-wrap {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .circle-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .square {
      margin-top: 1.75rem;
      width: min(320px, 100%);
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d5ddd8;
      background: #000;
    }
    .square video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .label {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #5a7166;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sign · Telegram video avatar</h1>
    <p class="lead">
      Mid jade field sized for both Telegram light and dark themes — mint aurora,
      soft motes, no black-hole vignette.
    </p>
    <code>hyperlinks-space-avatar-sign.mp4</code>

    <div class="themes">
      <div class="theme light">
        <h2>Light theme</h2>
        <div class="circle-wrap">
          <video src="hyperlinks-space-avatar-sign.mp4?v=22" autoplay loop muted playsinline></video>
        </div>
      </div>
      <div class="theme dark">
        <h2>Dark theme</h2>
        <div class="circle-wrap">
          <video src="hyperlinks-space-avatar-sign.mp4?v=22" autoplay loop muted playsinline></video>
        </div>
      </div>
    </div>

    <div class="square">
      <video src="hyperlinks-space-avatar-sign.mp4?v=22" autoplay loop muted playsinline></video>
    </div>
    <div class="label">Full square master</div>
  </main>
</body>
</html>
