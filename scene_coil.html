function trap(t, a, b, c, d) {
  if (t <= a || t >= d) return 0;
  if (t < b) {
    const u = (t - a) / (b - a);
    return u * u * (3 - 2 * u);
  }
  if (t < c) return 1;
  const u = (t - c) / (d - c);
  return 1 - u * u * (3 - 2 * u);
}

}

}

function helixCenterline() {
  const wraps = WRAPS;
  const radius = HELIX_R;
  const pitch = PITCH;
  const height = wraps * pitch;
  const lead = 0.52;
  const nHelix = 260;
  const helix = [];
  for (let i = 0; i <= nHelix; i++) {
    const t = i / nHelix;
    const a = t * wraps * Math.PI * 2;
    helix.push(new THREE.Vector3(
      Math.cos(a) * radius,
      (t - 0.5) * height,
      Math.sin(a) * radius,
    ));
  }
  /* Legs go along the helix axis so they point to opposite sides of the frame. */
  const leadIn = [];
  const leadOut = [];
  const r0 = helix[0];
  const r1 = helix[nHelix];
  const out0 = new THREE.Vector3(r0.x, 0, r0.z).normalize();
  const out1 = new THREE.Vector3(r1.x, 0, r1.z).normalize();
  for (let i = 8; i >= 1; i--) {
    const u = i / 8;
    leadIn.push(new THREE.Vector3(
      r0.x + out0.x * 0.03 * (1 - u),
      r0.y - lead * u,
      r0.z + out0.z * 0.03 * (1 - u),
    ));
  }
  for (let i = 1; i <= 8; i++) {
    const u = i / 8;
    leadOut.push(new THREE.Vector3(
      r1.x + out1.x * 0.03 * u,
      r1.y + lead * u,
      r1.z + out1.z * 0.03 * u,
    ));
  }
  return new THREE.CatmullRomCurve3([...leadIn, ...helix, ...leadOut], false, 'centripetal');
}

function framesOf(curve, n) {
  const pts = [];
  const tangents = [];
  const normals = [];
  const binormals = [];
  const axis = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const p = curve.getPointAt(u);
    const T = curve.getTangentAt(u).normalize();
    pts.push(p);
    tangents.push(T);
    const radial = new THREE.Vector3(p.x, 0, p.z);
    if (radial.lengthSq() < 1e-8) radial.set(1, 0, 0);
    radial.normalize();
    const B = new THREE.Vector3().crossVectors(T, radial);
    if (B.lengthSq() < 1e-8) B.crossVectors(T, axis);
    B.normalize();
    if (B.y < 0) B.negate();
    const N = new THREE.Vector3().crossVectors(B, T).normalize();
    if (N.dot(radial) < 0) {
      N.negate();
      B.negate();
    }
    normals.push(N);
    binormals.push(B);
  }
  return { pts, tangents, normals, binormals };
}

function curveFrom(points) {
  return new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.12);
}

function sweepCircle(points, normals, radius, segs, mat) {
  const n = points.length;
  const pos = new Float32Array(n * segs * 3);
  const nrm = new Float32Array(n * segs * 3);
  const uv = new Float32Array(n * segs * 2);
  const T = new THREE.Vector3();
  const N = new THREE.Vector3();
  const B = new THREE.Vector3();
  const P = new THREE.Vector3();
  const Nr = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const i1 = Math.min(n - 1, i + 1);
    const i0 = Math.max(0, i - 1);
    T.copy(points[i1]).sub(points[i0]);
    if (T.lengthSq() < 1e-12) T.set(0, 1, 0);
    else T.normalize();
    N.copy(normals[i]);
    N.addScaledVector(T, -N.dot(T));
    if (N.lengthSq() < 1e-8) {
      N.set(0, 1, 0);
      N.addScaledVector(T, -N.dot(T));
    }
    N.normalize();
    B.crossVectors(T, N).normalize();
    N.crossVectors(B, T).normalize();
    for (let j = 0; j < segs; j++) {
      const a = (j / segs) * Math.PI * 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      P.copy(points[i]).addScaledVector(N, ca * radius).addScaledVector(B, sa * radius);
      Nr.copy(N).multiplyScalar(ca).addScaledVector(B, sa);
      const o = (i * segs + j) * 3;
      pos[o] = P.x;
      pos[o + 1] = P.y;
      pos[o + 2] = P.z;
      nrm[o] = Nr.x;
      nrm[o + 1] = Nr.y;
      nrm[o + 2] = Nr.z;
      const uo = (i * segs + j) * 2;
      uv[uo] = i / (n - 1);
      uv[uo + 1] = j / segs;
    }
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const j2 = (j + 1) % segs;
      const a = i * segs + j;
      const b = i * segs + j2;
      const c = (i + 1) * segs + j2;
      const d = (i + 1) * segs + j;
      idx.push(a, b, c, a, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const mesh = new THREE.Mesh(geo, mat);
  stage.add(mesh);
  return mesh;
}

function roundedRect(nx, by, rx, segs) {
  const hw = nx * 0.5;
  const hh = by * 0.5;
  const r = Math.min(rx, hw * 0.9, hh * 0.9);
  const pts = [];
  const corners = [
    [hw - r, hh - r, 0],
    [-hw + r, hh - r, Math.PI * 0.5],
    [-hw + r, -hh + r, Math.PI],
    [hw - r, -hh + r, Math.PI * 1.5],
  ];
  for (const [cx, cy, a0] of corners) {
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (i / segs) * Math.PI * 0.5;
      pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
    }
  }
  return pts;
}

function sweepProfile(fr, profile, mat) {
  const n = fr.pts.length;
  const m = profile.length;
  const pos = new Float32Array(n * m * 3);
  const uv = new Float32Array(n * m * 2);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      const p = profile[j];
      const v = fr.pts[i];
      const o = (i * m + j) * 3;
      pos[o] = v.x + fr.normals[i].x * p.x + fr.binormals[i].x * p.y;
      pos[o + 1] = v.y + fr.normals[i].y * p.x + fr.binormals[i].y * p.y;
      pos[o + 2] = v.z + fr.normals[i].z * p.x + fr.binormals[i].z * p.y;
      const uo = (i * m + j) * 2;
      uv[uo] = n > 1 ? i / (n - 1) : 0;
      uv[uo + 1] = j / m;
    }
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < m; j++) {
      const j2 = (j + 1) % m;
      const a = i * m + j;
      const b = i * m + j2;
      const c = (i + 1) * m + j2;
      const d = (i + 1) * m + j;
      idx.push(a, b, c, a, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  stage.add(mesh);
  return mesh;
}

function sampleFrame(fr, u) {
  const x = THREE.MathUtils.clamp(u, 0, 1) * (fr.pts.length - 1);
  const i = Math.min(fr.pts.length - 2, Math.floor(x));
  const f = x - i;
  return {
    p: fr.pts[i].clone().lerp(fr.pts[i + 1], f),
    N: fr.normals[i].clone().lerp(fr.normals[i + 1], f).normalize(),
    B: fr.binormals[i].clone().lerp(fr.binormals[i + 1], f).normalize(),
  };
}

function resampleClosed(profile, count) {
  const m = profile.length;
  const lens = [];
  let total = 0;
  for (let i = 0; i < m; i++) {
    const a = profile[i];
    const b = profile[(i + 1) % m];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    lens.push(d);
    total += d;
  }
  const out = [];
  for (let i = 0; i < count; i++) {
    let t = (i / count) * total;
    let j = 0;
    while (j < m - 1 && t > lens[j]) {
      t -= lens[j];
      j++;
    }
    const a = profile[j];
    const b = profile[(j + 1) % m];
    const f = lens[j] > 1e-8 ? t / lens[j] : 0;
    out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
  }
  return out;
}

function profileNormals(profile) {
  const m = profile.length;
  const nrm = [];
  for (let j = 0; j < m; j++) {
    const a = profile[(j - 1 + m) % m];
    const b = profile[(j + 1) % m];
    const tx = b.x - a.x;
    const ty = b.y - a.y;
    const len = Math.hypot(tx, ty) || 1;
    nrm.push({ x: ty / len, y: -tx / len });
  }
  let cx = 0;
  let cy = 0;
  for (const p of profile) {
    cx += p.x;
    cy += p.y;
  }
  cx /= m;
  cy /= m;
  for (let j = 0; j < m; j++) {
    const dx = profile[j].x - cx;
    const dy = profile[j].y - cy;
    if (nrm[j].x * dx + nrm[j].y * dy < 0) {
      nrm[j].x *= -1;
      nrm[j].y *= -1;
    }
  }
  return nrm;
}

function wrapOnProfile(fr, profile, turns, phase, outset) {
  const loop = resampleClosed(profile, 72);
  const nrm = profileNormals(loop);
  const m = loop.length;
  const n = Math.max(320, Math.floor(turns * 10));
  const points = [];
  const normals = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const s = sampleFrame(fr, u);
    const v = ((u * turns + phase) % 1 + 1) % 1;
    const x = v * m;
    const j = Math.floor(x) % m;
    const f = x - Math.floor(x);
    const j2 = (j + 1) % m;
    const px = loop[j].x + (loop[j2].x - loop[j].x) * f;
    const py = loop[j].y + (loop[j2].y - loop[j].y) * f;
    let nx = nrm[j].x + (nrm[j2].x - nrm[j].x) * f;
    let ny = nrm[j].y + (nrm[j2].y - nrm[j].y) * f;
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl;
    ny /= nl;
    points.push(
      s.p.clone()
        .addScaledVector(s.N, px + nx * outset)
        .addScaledVector(s.B, py + ny * outset),
    );
    normals.push(
      s.N.clone().multiplyScalar(nx).addScaledVector(s.B, ny).normalize(),
    );
  }
  return { points, normals };
}

function fitFullyVisible(margin) {
  camera.updateMatrixWorld();
  camera.updateProjectionMatrix();
  root.updateMatrixWorld(true);
  stage.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const corners = [
    new THREE.Vector3(box.min.x, box.min.y, box.min.z),
    new THREE.Vector3(box.min.x, box.min.y, box.max.z),
    new THREE.Vector3(box.min.x, box.max.y, box.min.z),
    new THREE.Vector3(box.min.x, box.max.y, box.max.z),
    new THREE.Vector3(box.max.x, box.min.y, box.min.z),
    new THREE.Vector3(box.max.x, box.min.y, box.max.z),
    new THREE.Vector3(box.max.x, box.max.y, box.min.z),
    new THREE.Vector3(box.max.x, box.max.y, box.max.z),
  ];
  let maxR = 0;
  for (const p of corners) {
    maxR = Math.max(maxR, Math.abs(p.clone().project(camera).x), Math.abs(p.clone().project(camera).y));
  }
  if (maxR > 1e-6) stage.scale.multiplyScalar(margin / maxR);
  root.updateMatrixWorld(true);
  box.setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
}

(function contain() {
  stage.scale.setScalar(1);
  stage.position.set(0, 0, 0);
  root.position.set(0, 0, 0);
  /* Legs along ±Y → diagonal; Y-rot brings ribbon wide faces toward camera. */
  stage.rotation.set(0.06, 0.62, -0.72);
  stage.updateMatrixWorld(true);
  stage.position.sub(new THREE.Box3().setFromObject(stage).getCenter(new THREE.Vector3()));
  fitFullyVisible(0.945);
  fitFullyVisible(0.925);
  stage.userData.rest = {
    x: stage.position.x,
    y: stage.position.y,
    z: stage.position.z,
    rx: stage.rotation.x,
    ry: stage.rotation.y,
    rz: stage.rotation.z,
    s: stage.scale.x,
  };
})();

function applyMetal(mat, treat, pulse) {
  const lag = mat.userData.lag || 0;
  const h = THREE.MathUtils.clamp(treat - lag, 0, 1);
  const p = THREE.MathUtils.clamp(pulse - lag * 0.45, 0, 1);
  mat.userData.treat = 0.42 + h * 0.52;
  mat.userData.shift = p * 0.07;
  if (mat.userData.uTreat) {
    mat.userData.uTreat.value = mat.userData.treat;
    mat.userData.uShift.value = mat.userData.shift;
  }
  mat.emissive.setHex(0x000000);
  mat.emissiveIntensity = 0;
  mat.roughness = THREE.MathUtils.lerp(0.2, 0.13, p);
  mat.iridescence = 0.52 + h * 0.3 + p * 0.08;
  mat.iridescenceIOR = 1.18 + p * 0.05;
  mat.iridescenceThicknessRange = [150 + h * 160, 400 + h * 260 + p * 70];
  mat.envMapIntensity = 0.82 + p * 0.1;
}

function applyFrame(frameNo) {
  const t = (frameNo - 1) / TOTAL;
  const ph = t * Math.PI * 2;
  const pulse = Math.max(
    trap(t, 0.14, 0.26, 0.48, 0.72),
    trap(t, 0.70, 0.78, 0.86, 0.98) * 0.45,
  );
  const treat = 0.55 + pulse * 0.42;

  applyMetal(mats.plate, treat, pulse);
  applyMetal(mats.ni80, treat, pulse);
  applyMetal(mats.frame, treat, pulse);
  applyMetal(mats.ni90, treat, pulse);

  heatLight.position.set(0.04, 0.02, 0.12);
  heatLight.intensity = 0.04 + pulse * 0.14;
  heatLight.color.setHSL(0.68 - pulse * 0.06, 0.42, 0.48);

  const shake = pulse * pulse * 0.55;
  const rest = stage.userData.rest;
  /* Keep pose locked — only drift/float so the coil never spins edge-on. */
  stage.position.set(
    rest.x + Math.sin(t * 73.1) * 0.003 * shake + Math.sin(ph) * 0.003,
    rest.y + Math.cos(ph) * 0.008 + Math.sin(t * 91.7) * 0.002 * shake,
    rest.z + Math.sin(ph * 1.5) * 0.004,
  );
  stage.rotation.set(rest.rx, rest.ry, rest.rz);
  stage.scale.setScalar(rest.s * (1 + Math.sin(ph * 2) * 0.003));

  camera.lookAt(0, 0, 0);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (frameNo) => { applyFrame(frameNo); return frameNo; };
window.TOTAL = TOTAL;
window.ready = false;

try {
  applyFrame(1);
  window.ready = true;
  console.log('COIL_READY');
} catch (e) {
  console.error('COIL_FAIL', e);
}
</script>
