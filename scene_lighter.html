function trap(t, a, b, c, d) {
  if (t <= a || t >= d) return 0;
  if (t < b) { const u = (t - a) / (b - a); return u * u * (3 - 2 * u); }
  if (t < c) return 1;
  const u = (t - c) / (d - c); return 1 - u * u * (3 - 2 * u);
}

function seeded(n) {
  return () => {
    n = (n * 16807) % 2147483647;
    return (n - 1) / 2147483646;
  };
}

function glanceMat(width = 1) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uShift: { value: 0 },
      uGain: { value: 1 },
      uWidth: { value: width },
    },
    vertexShader: `
      varying float vX;
      void main() {
        vX = position.x;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uShift;
      uniform float uGain;
      uniform float uWidth;
      varying float vX;
      void main() {
        float d = abs(vX - uShift) / max(uWidth, 0.001);
        float core = 1.0 - smoothstep(0.032, 0.072, d);
        float halo = 1.0 - smoothstep(0.072, 0.15, d);
        float a = max(core, halo * 0.4) * uGain;
        if (a < 0.03) discard;
        gl_FragColor = vec4(1.0, 1.0, 1.0, a);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: true,
    depthWrite: false,
    toneMapped: false,
    side: THREE.FrontSide,
  });
}

function attachGlance(letter, ch) {

  mesh.position.set(body.position.x, body.position.y, 0.50);
  mesh.renderOrder = 4;
  letter.add(mesh);
  letter.userData.glance = mesh;
  return mesh;
}

/** Photo chrome hood: silver rounded shell, open top, front slot */

  const g = new THREE.Group();

  /* Outer chrome cylinder with rounded proportions */

    new THREE.CylinderGeometry(0.72, 0.74, 1.15, 64, 1, false),

  topLip.rotation.x = Math.PI / 2;
  topLip.position.y = 0.54;
  g.add(topLip);
  const botLip = new THREE.Mesh(new THREE.TorusGeometry(0.70, 0.055, 12, 48), chromeMat());
  botLip.rotation.x = Math.PI / 2;

  return g;
}

function flamePath(ctx, cx, top, bot, halfW) {
  const hh = bot - top;
  const baseW = Math.max(8, halfW * 0.16);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.bezierCurveTo(cx + halfW * 0.18, top + hh * 0.16, cx + halfW * 0.92, top + hh * 0.38, cx + halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx + halfW * 1.02, top + hh * 0.76, cx + baseW, bot - 2, cx + baseW, bot);
  ctx.lineTo(cx - baseW, bot);
  ctx.bezierCurveTo(cx - baseW, bot - 2, cx - halfW * 1.02, top + hh * 0.76, cx - halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx - halfW * 0.92, top + hh * 0.38, cx - halfW * 0.18, top + hh * 0.16, cx, top);
  ctx.closePath();
}

/** Opaque painted flame: dark-red outline + saturated body + yellow-white core. */
function makeFlameSpriteTex() {
  const w = 256;

  c.height = h;
  const ctx = c.getContext('2d');

  flamePath(ctx, cx, top, bot, hw);
  ctx.fillStyle = '#2a0000';
  ctx.fill();

  flamePath(ctx, cx, top + 10, bot - 2, hw * 0.88);
  ctx.fillStyle = '#9a0000';
  ctx.fill();

  flamePath(ctx, cx, top + 20, bot - 10, hw * 0.74);
  const body = ctx.createLinearGradient(cx, bot, cx, top);
  body.addColorStop(0.00, '#ff0a00');
  body.addColorStop(0.12, '#ff1a00');
  body.addColorStop(0.32, '#ff3a00');
  body.addColorStop(0.52, '#ff6a00');
  body.addColorStop(0.70, '#ffb000');
  body.addColorStop(0.86, '#ffe56a');
  body.addColorStop(1.00, '#fffce8');
  ctx.fillStyle = body;
  ctx.fill();

  flamePath(ctx, cx, top + 110, bot - 95, hw * 0.32);
  const core = ctx.createLinearGradient(cx, bot - 90, cx, top + 40);
  core.addColorStop(0.00, '#ffb000');
  core.addColorStop(0.35, '#ffe56a');
  core.addColorStop(0.70, '#fffce0');
  core.addColorStop(1.00, '#ffffff');
  ctx.fillStyle = core;
  ctx.fill();

  const blue = ctx.createRadialGradient(cx, bot - 18, 3, cx, bot - 28, 40);
  blue.addColorStop(0.00, 'rgba(210,235,255,1)');
  blue.addColorStop(0.28, 'rgba(40,100,255,1)');
  blue.addColorStop(0.70, 'rgba(20,50,220,0.55)');
  blue.addColorStop(1.00, 'rgba(20,50,220,0)');
  ctx.fillStyle = blue;
  ctx.beginPath();
  ctx.ellipse(cx, bot - 22, 34, 44, 0, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/** Irregular S-curve flame tongue — opaque so it reads on light chat backgrounds. */
function makeWindingFlameTex(seed) {
  const w = 256, h = 640;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const rnd = seeded(seed * 97 + 13);
  const cx = 128;
  const tongue = (ox, sway, wBase, tipY, dark) => {
    const baseY = 628;
    g.beginPath();
    g.moveTo(cx + ox, baseY);
    g.bezierCurveTo(cx + ox - wBase, baseY - 80, cx + ox - wBase * 1.4 + sway * 0.4, baseY - 210, cx + ox + sway * 0.7, baseY - 340);
    g.bezierCurveTo(cx + ox + sway * 1.5, tipY + 150, cx + ox + sway * 1.65, tipY + 70, cx + ox + sway * 0.8, tipY);
    g.bezierCurveTo(cx + ox + sway * 0.1, tipY + 80, cx + ox - sway * 0.5, tipY + 200, cx + ox - sway * 0.15, baseY - 330);
    g.bezierCurveTo(cx + ox + wBase, baseY - 180, cx + ox + wBase * 0.5, baseY - 70, cx + ox, baseY);
    g.closePath();
    const grd = g.createLinearGradient(cx + ox, baseY, cx + ox + sway * 0.6, tipY);
    if (dark) {
      grd.addColorStop(0.00, '#3a0000');
      grd.addColorStop(0.25, '#c01400');
      grd.addColorStop(0.60, '#ff4a00');
      grd.addColorStop(1.00, '#ffb020');
    } else {
      grd.addColorStop(0.00, '#2a0000');
      grd.addColorStop(0.12, '#ff1a00');
      grd.addColorStop(0.40, '#ff6a00');
      grd.addColorStop(0.70, '#ffd040');
      grd.addColorStop(1.00, '#fff8e0');
    }
    g.fillStyle = grd;
    g.fill();
  };
  tongue(-8, 70 + rnd() * 50, 58, 24 + rnd() * 30, true);
  tongue(18, -88 - rnd() * 36, 50, 48 + rnd() * 28, true);
  tongue(-2, 54 + rnd() * 40, 64, 8 + rnd() * 18, false);
  tongue(12, -62 - rnd() * 30, 46, 36 + rnd() * 22, false);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/** Wide jagged bolt with dark outline — survives 30×30. */
function makeLightningTex(seed) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const rnd = seeded(seed * 131 + 7);
  const pts = [];
  let x = w * 0.5;
  pts.push([x, h - 10]);
  const segs = 8 + Math.floor(rnd() * 5);
  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    x = w * 0.5 + (rnd() - 0.52) * 150 * Math.sin(u * Math.PI) + (rnd() - 0.5) * 36;
    pts.push([x, h - 10 - u * (h - 22)]);
  }
  const stroke = (width, color) => {
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'round';
    ctx.miterLimit = 8;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };
  stroke(48, '#1a0600');
  stroke(32, seed % 2 ? '#ff7a00' : '#3a7cff');
  stroke(18, seed % 2 ? '#ffe566' : '#c8e8ff');
  stroke(8, '#ffffff');
  const mid = 3 + Math.floor(rnd() * 3);
  const bx = pts[mid][0], by = pts[mid][1];
  const bpts = [[bx, by]];
  let bx2 = bx, by2 = by;
  const bSeg = 3 + Math.floor(rnd() * 2);
  const dir = rnd() > 0.5 ? 1 : -1;
  for (let i = 1; i <= bSeg; i++) {
    bx2 += dir * (28 + rnd() * 40);
    by2 -= 28 + rnd() * 36;
    bpts.push([bx2, by2]);
  }
  const strokeB = (width, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(bpts[0][0], bpts[0][1]);
    for (let i = 1; i < bpts.length; i++) ctx.lineTo(bpts[i][0], bpts[i][1]);
    ctx.stroke();
  };
  strokeB(28, '#1a0600');
  strokeB(18, seed % 2 ? '#ff9900' : '#4488ff');
  strokeB(9, '#ffffff');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function deformFlamePlane(geo, bend, twist, phase, taper = 0.55) {
  const pos = geo.attributes.position;
  if (!geo.userData.base) {
    const base = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      base[i * 3] = pos.getX(i);
      base[i * 3 + 1] = pos.getY(i);
      base[i * 3 + 2] = pos.getZ(i);
    }
    geo.userData.base = base;
  }
  const base = geo.userData.base;
  for (let i = 0; i < pos.count; i++) {
    const x0 = base[i * 3];
    const y0 = base[i * 3 + 1];
    const u = y0 + 0.5;
    const s1 = Math.sin(u * Math.PI * 2.35 + phase) * bend * (0.25 + 0.9 * u);
    const s2 = Math.sin(u * Math.PI * 3.8 + phase * 1.6) * bend * 0.28 * u;
    const z1 = Math.sin(u * Math.PI * 1.7 + twist) * bend * 0.55 * u;
    const tw = 1 - u * taper;
    const yaw = twist * u * 0.85;
    const xr = x0 * Math.cos(yaw) - z1 * Math.sin(yaw);
    const zr = x0 * Math.sin(yaw) + z1 * Math.cos(yaw);
    pos.setXYZ(i, xr * tw + s1 + s2, y0, zr);
  }
  pos.needsUpdate = true;
}

function sampleBezier(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ]);
  }
  return pts;
}

/** Extra-bold antiqua capital I — thick stem, bracketed slab serifs. */
function timesIShape() {
  const s = new THREE.Shape();
  const stem = 0.40;
  const serifW = 0.90;
  const serifH = 0.26;
  const h = 1.52;
  const br = 0.16;
  s.moveTo(-serifW, -h);
  s.lineTo(serifW, -h);
  s.lineTo(serifW, -h + serifH * 0.55);
  s.quadraticCurveTo(serifW * 0.22, -h + serifH, stem, -h + serifH + br);
  s.lineTo(stem, h - serifH - br);
  s.quadraticCurveTo(serifW * 0.22, h - serifH, serifW, h - serifH * 0.55);
  s.lineTo(serifW, h);
  s.lineTo(-serifW, h);
  s.lineTo(-serifW, h - serifH * 0.55);
  s.quadraticCurveTo(-serifW * 0.22, h - serifH, -stem, h - serifH - br);
  s.lineTo(-stem, -h + serifH + br);
  s.quadraticCurveTo(-serifW * 0.22, -h + serifH, -serifW, -h + serifH * 0.55);
  s.closePath();
  return s;
}

/** Times-like roman S — oval bowls, modest terminals (not comic bubble). */
function timesSShape() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return strokeShape(top.concat(bot.slice(1)), 0.34);
}

function circleShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, Math.PI * 2, false);
  return s;
}

function strokeShape(pts, radius) {
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const i0 = Math.max(0, i - 1);
    const i1 = Math.min(pts.length - 1, i + 1);
    let dx = pts[i1][0] - pts[i0][0];
    let dy = pts[i1][1] - pts[i0][1];
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    left.push([pts[i][0] - dy * radius, pts[i][1] + dx * radius]);
    right.push([pts[i][0] + dy * radius, pts[i][1] - dx * radius]);
  }
  const shape = new THREE.Shape();
  shape.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) shape.lineTo(left[i][0], left[i][1]);
  const end = pts[pts.length - 1];
  shape.absarc(
    end[0], end[1], radius,
    Math.atan2(left[left.length - 1][1] - end[1], left[left.length - 1][0] - end[0]),
    Math.atan2(right[right.length - 1][1] - end[1], right[right.length - 1][0] - end[0]),
    false,
  );
  for (let i = right.length - 1; i >= 0; i--) shape.lineTo(right[i][0], right[i][1]);
  const start = pts[0];
  shape.absarc(
    start[0], start[1], radius,
    Math.atan2(right[0][1] - start[1], right[0][0] - start[0]),
    Math.atan2(left[0][1] - start[1], left[0][0] - start[0]),
    false,
  );
  shape.closePath();
  return shape;
}

function sCenterlinePts() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return top.concat(bot.slice(1));
}

function distToPolyline(x, y, pts) {
  let best = 1e9;
  for (let i = 0; i < pts.length; i++) {
    const dx = x - pts[i][0];
    const dy = y - pts[i][1];
    const d = dx * dx + dy * dy;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

/** Concave stroke valleys — bent metal that splits the glance into two ridges. */
function channelChromeGeo(geo, kind, centerline) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const amp = kind === 'dot' ? 0.022 : 0.016;
  for (let i = 0; i < pos.count; i++) {
    const nz = nrm.getZ(i);
    if (Math.abs(nz) < 0.5) continue;
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    let k = 0;
    if (kind === 'I') {
      const inStem = Math.abs(x) < 0.50 && Math.abs(y) < 1.14;
      const inSerif = Math.abs(y) > 1.04;
      if (inStem) {
        const u = Math.min(1, Math.abs(x) / 0.40);
        k = 1 - u * u;
      } else if (inSerif) {
        const yc = y > 0 ? 1.25 : -1.25;
        const u = Math.min(1, Math.abs(y - yc) / 0.24);
        k = (1 - u * u) * 0.72;
      }
    } else if (kind === 'S' && centerline) {
      const d = distToPolyline(x, y, centerline);
      const u = Math.min(1, d / 0.30);
      k = 1 - u * u;
    } else if (kind === 'dot') {
      const u = Math.min(1, Math.hypot(x, y) / 0.20);
      k = 1 - u * u;
    }
    pos.setZ(i, z - Math.sign(nz || 1) * amp * k);
  }
  geo.computeVertexNormals();
}

function extrudeOpts(depth) {
  return {
    depth,
    bevelEnabled: true,
    bevelThickness: 0.12,
    bevelSize: 0.095,
    bevelSegments: 12,
    curveSegments: 96,
    steps: 1,
  };
}

function dentedChromeSphere(radius, seed) {
  const geo = new THREE.SphereGeometry(radius, 48, 36);
  const pos = geo.attributes.position;
  const rnd = seeded(seed);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const n = Math.hypot(x, y, z) || 1;
    const dent = 0.055 * Math.sin(x * 8.2 + y * 6.4)
      + 0.04 * Math.sin(y * 9.5 + z * 7.1)
      + 0.028 * Math.sin(z * 11.0 + x * 5.5)
      + (rnd() - 0.5) * 0.025;
    const s = (1 + dent) * radius / n;
    pos.setXYZ(i, x * s, y * s, z * s);
  }
  geo.computeVertexNormals();
  channelChromeGeo(geo, 'dot', null);
  return new THREE.Mesh(geo, liquidChromeMat(false));
}

function attachEdgeShadow(mesh, xy = 1.065, z = 1.03) {
  const shell = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({
      color: 0x101214,
      side: THREE.BackSide,
      toneMapped: false,
    }),
  );
  shell.position.copy(mesh.position);
  shell.rotation.copy(mesh.rotation);
  shell.scale.copy(mesh.scale);
  shell.scale.x *= xy;
  shell.scale.y *= xy;
  shell.scale.z *= z;
  shell.renderOrder = -1;
  mesh.parent.add(shell);
  return shell;
}

function makeLetter3D(ch) {
  const g = new THREE.Group();
  const isI = ch === 'I';
  const chrome = isI ? liquidChromeMat(false) : sChromeMat();
  const bodyShapes = [isI ? timesIShape() : timesSShape()];
  const sLine = isI ? null : sCenterlinePts();

  const depth = 0.92;
  const geo = new THREE.ExtrudeGeometry(bodyShapes, extrudeOpts(depth));
  geo.translate(0, 0, -depth * 0.5);
  channelChromeGeo(geo, isI ? 'I' : 'S', sLine);
  const body = new THREE.Mesh(geo, chrome);
  g.add(body);

  body.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(body);
  const c = bb.getCenter(new THREE.Vector3());
  body.position.x -= c.x;
  body.position.y -= c.y;

  const sphereR = isI ? 0.44 : 0.42;
  const indent = isI ? 0.22 : 0.26;
  const dot = dentedChromeSphere(sphereR, isI ? 4103 : 7721);
  if (!isI) dot.material = sChromeMat();
  /* Gap (indent) from the glyph; bottom of the sphere sits on the text baseline. */
  const letterRight = bb.max.x - c.x;
  const letterBottom = bb.min.y - c.y;
  dot.position.set(letterRight + indent + sphereR, letterBottom + sphereR, 0);
  g.add(dot);
  g.userData.dot = dot;
  attachEdgeShadow(body, 1.07, 1.04);
  attachEdgeShadow(dot, 1.045, 1.03);
  const fill = new THREE.PointLight(0xffffff, 2.4, 10, 1.1);
  fill.position.set(0.35, 0.7, 4.2);
  g.add(fill);
  const dotFill = new THREE.PointLight(0xffffff, 2.4, 8, 1.15);
  dotFill.position.set(dot.position.x + 0.25, dot.position.y + 0.4, 2.4);
  g.add(dotFill);
  return g;
}

function knurlWheel(radius = 0.32, width = 0.38) {

function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const hw = w * 0.5;
  const hd = d * 0.5;
  r = Math.min(r, hw - 0.02, hd - 0.02);
  s.moveTo(-hw + r, -hd);
  s.lineTo(hw - r, -hd);
  s.absarc(hw - r, -hd + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hw, hd - r);
  s.absarc(hw - r, hd - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hw + r, hd);
  s.absarc(-hw + r, hd - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hd + r);
  s.absarc(-hw + r, -hd + r, r, Math.PI, Math.PI * 1.5, false);
  s.closePath();
  return s;
}

/** Classic BIC shell: rounded-rect cross-section, not a square box or a tube. */
function bicShell(width, height, depth, mat, radius) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(width, depth, radius), {
    depth: height,
    bevelEnabled: true,
    bevelThickness: 0.09,
    bevelSize: 0.08,
    bevelSegments: 5,
    curveSegments: 48,
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);
  return new THREE.Mesh(geo, mat);
}

/* Move in Z while keeping the same screen position and apparent size. */
function keepScreenAtZ(obj, zWorld) {
  obj.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  obj.getWorldPosition(w);
  const k = (camera.position.z - zWorld) / camera.position.z;
  w.x *= k;
  w.y *= k;
  w.z = zWorld;
  obj.parent.worldToLocal(w);
  obj.position.copy(w);
  obj.scale.multiplyScalar(k);
}

function expandFlameTip(box) {
  const spinY = lighterSpin.rotation.y;
  const spinX = lighterSpin.rotation.x;
  const pivX = lighterPivot.rotation.x;
  const pivZ = lighterPivot.rotation.z;
  const fs = flameGroup.scale.clone();
  /* Cover flick scale + lighter yaw/pitch so the flame never leaves the square. */
  flameGroup.scale.set(1.14, 1.12, 1.14);
  const poses = [
    [0.02, -0.05, 0.07],
    [0.12, 0.00, 0.10],
    [0.22, 0.05, 0.13],
  ];
  for (const [y, sx, px] of poses) {
    lighterSpin.rotation.y = y;
    lighterSpin.rotation.x = sx;
    lighterPivot.rotation.x = px;
    stage.updateMatrixWorld(true);
    for (const xy of [[0, 4.15], [-0.55, 3.95], [0.6, 4.1]]) {
      const p = new THREE.Vector3(xy[0], xy[1], 0);
      flameAnchor.localToWorld(p);
      box.expandByPoint(p);
    }
  }
  lighterSpin.rotation.y = spinY;
  lighterSpin.rotation.x = spinX;
  lighterPivot.rotation.x = pivX;
  lighterPivot.rotation.z = pivZ;
  flameGroup.scale.copy(fs);
  stage.updateMatrixWorld(true);
}

function boxFromVisibleMeshes(rootObj, skip) {
  const box = new THREE.Box3();
  rootObj.updateMatrixWorld(true);
  rootObj.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    let p = node;
    while (p) {
      if (p === skip || p.visible === false) return;
      if (p === rootObj) break;
      p = p.parent;
    }
    if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
    const b = node.geometry.boundingBox.clone().applyMatrix4(node.matrixWorld);
    box.union(b);
  });
  return box;
}

function placeLetterContact(letter, lx, ly, lighterX, lighterY, lighterZ) {
  const z = letter.position.z;
  letter.position.set(0, 0, z);
  stage.updateMatrixWorld(true);
  letter.updateMatrixWorld(true);
  const from = new THREE.Vector3(lx, ly, 0);
  letter.localToWorld(from);
  stage.worldToLocal(from);
  const to = spinToStage(lighterX, lighterY, lighterZ);
  letter.position.set(to.x - from.x, to.y - from.y, z);
}

function worldSafeRect() {
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const inset = half * 2 * 0.08;
  return { minX: -half + inset, maxX: half - inset, minY: -half + inset, maxY: half - inset, half };
}

function localGlyphBox(letter) {
  const pos = letter.position.clone();
  const scl = letter.scale.clone();
  const rot = letter.rotation.clone();
  letter.position.set(0, 0, 0);
  letter.scale.setScalar(1);
  letter.rotation.set(0, 0, 0);
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  letter.position.copy(pos);
  letter.scale.copy(scl);
  letter.rotation.copy(rot);
  letter.updateMatrixWorld(true);
  return b;
}

function letterFitsSafe(letter, safe) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  return (
    b.min.x >= safe.minX && b.max.x <= safe.maxX
    && b.min.y >= safe.minY && b.max.y <= safe.maxY
  );
}

function setLetterWorldXY(letter, x, y) {
  letter.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  letter.getWorldPosition(w);
  w.x = x;
  w.y = y;
  letter.parent.worldToLocal(w);
  letter.position.x = w.x;
  letter.position.y = w.y;
}

function dropLetterToFloor(letter, floorY) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  const dy = b.min.y - floorY;
  if (dy <= 0) return;
  const w = new THREE.Vector3();
  letter.getWorldPosition(w);
  w.y -= dy;
  letter.parent.worldToLocal(w);
  letter.position.copy(w);
}

function growAtWorldPos(letter, wx, wy, safe) {
  let lo = 0.5;
  let hi = 9;
  for (let n = 0; n < 20; n++) {
    const mid = (lo + hi) * 0.5;
    letter.scale.setScalar(mid);
    setLetterWorldXY(letter, wx, wy);
    if (letterFitsSafe(letter, safe)) lo = mid;
    else hi = mid;
  }
  letter.scale.setScalar(lo);
  setLetterWorldXY(letter, wx, wy);
}

function letterArea(letter) {
  letter.updateMatrixWorld(true);
  const s = new THREE.Box3().setFromObject(letter).getSize(new THREE.Vector3());
  return s.x * s.y + 1e-6;
}

function nudgeToBody(letter, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe) {
  const step = 0.14;
  for (let i = 0; i < 70; i++) {
    letter.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(letter);
    const area = letterArea(letter);
    const bodyHit = xyOverlapArea(b, bodyBox) / area;
    const hoodHit = hoodBox ? xyOverlapArea(b, hoodBox) / area : 0;
    if (bodyHit >= minBody && hoodHit <= maxHood) break;
    let dx = 0;
    let dy = 0;
    if (hoodHit > maxHood) {
      dx = -tx;
      dy = -ty;
    } else if (bodyHit < minBody) {
      dx = tx;
      dy = ty;
    } else break;
    letter.position.x += dx * step;
    letter.position.y += dy * step;
    if (!letterFitsSafe(letter, safe)) {
      letter.position.x -= dx * step;
      letter.position.y -= dy * step;
      if (letter.scale.x > 1.4) letter.scale.multiplyScalar(0.97);
      else break;
    }
  }
}

function packLeaningLetter(letter, deg, wx, wy, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe) {
  letter.rotation.z = THREE.MathUtils.degToRad(-deg);
  growAtWorldPos(letter, wx, wy, safe);
  nudgeToBody(letter, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe);
  return letter.scale.x;
}

function partWorldBox(part) {
  const box = new THREE.Box3();
  lighterSpin.updateMatrixWorld(true);
  lighterSpin.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    let p = node;
    let ok = false;
    while (p && p !== lighterSpin.parent) {
      if (p.userData && p.userData.part === part) { ok = true; break; }
      p = p.parent;
    }
    if (!ok) return;
    if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
    box.union(node.geometry.boundingBox.clone().applyMatrix4(node.matrixWorld));
  });
  return box;
}

function xyOverlapArea(a, b) {
  const ox = Math.min(a.max.x, b.max.x) - Math.max(a.min.x, b.min.x);
  const oy = Math.min(a.max.y, b.max.y) - Math.max(a.min.y, b.min.y);
  if (ox <= 0 || oy <= 0) return 0;
  return ox * oy;
}

function packLetterAngle(letter, degClockwise, lx, ly, lighterX, lighterY, lighterZ, safe) {
  /* Design-tool +deg is clockwise = top to the right = negative Three.js Z. */
  letter.rotation.z = THREE.MathUtils.degToRad(-degClockwise);
  letter.scale.setScalar(1);
  growLetterToSafe(letter, lx, ly, lighterX, lighterY, lighterZ, safe);
  return letterFitsSafe(letter, safe) ? letter.scale.x : 0;
}

function bestLetterAngle(letter, degrees, lx, ly, lighterX, lighterY, lighterZ, safe, reject) {
  let bestDeg = degrees[0];
  let bestScale = 0;
  let bestPos = letter.position.clone();
  for (const deg of degrees) {
    const sc = packLetterAngle(letter, deg, lx, ly, lighterX, lighterY, lighterZ, safe);
    if (reject && reject(letter)) continue;
    if (sc > bestScale) {
      bestScale = sc;
      bestDeg = deg;
      bestPos = letter.position.clone();
    }
  }
  packLetterAngle(letter, bestDeg, lx, ly, lighterX, lighterY, lighterZ, safe);
  if (bestScale > 0) {
    letter.scale.setScalar(bestScale);
    letter.position.copy(bestPos);
    letter.rotation.z = THREE.MathUtils.degToRad(-bestDeg);
  }
  return bestDeg;
}

function overlapFrac(letter, lighterBox) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  const ox = Math.min(b.max.x, lighterBox.max.x) - Math.max(b.min.x, lighterBox.min.x);
  const oy = Math.min(b.max.y, lighterBox.max.y) - Math.max(b.min.y, lighterBox.min.y);
  if (ox <= 0 || oy <= 0) return 0;
  const ls = b.getSize(new THREE.Vector3());
  return (ox * oy) / (ls.x * ls.y + 1e-6);
}

function nudgeLetter(letter, dirX, dirY, lighterBox, maxFrac, safe) {
  if (lighterBox.isEmpty()) return;
  const step = 0.16;
  for (let i = 0; i < 80; i++) {
    const frac = overlapFrac(letter, lighterBox);
    if (frac > 0.06 && frac <= maxFrac) break;
    const s = frac > maxFrac ? 1 : -1;
    letter.position.x += dirX * step * s;
    letter.position.y += dirY * step * s;
    if (!letterFitsSafe(letter, safe)) {
      letter.position.x -= dirX * step * s;
      letter.position.y -= dirY * step * s;
      if (letter.scale.x > 1.35) letter.scale.multiplyScalar(0.97);
      else break;
    }
  }
  while (!letterFitsSafe(letter, safe) && letter.scale.x > 0.3) {
    letter.scale.multiplyScalar(0.96);
  }
}

function containRoot() {
  stage.scale.setScalar(1);
  stage.position.set(0, 0, 0);
  root.scale.setScalar(1);
  root.position.set(0, 0, 0);
  brand.i.visible = false;
  brand.s.visible = false;
  flameGroup.visible = false;
  flameGroup.scale.setScalar(1);

  /* 1. Fit the lighter + flame to the diagonal. Ignore the letters. */
  stage.updateMatrixWorld(true);
  const viewSpan = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const box = boxFromVisibleMeshes(root, flameGroup);
  expandFlameTip(box);
  const spanSize = box.getSize(new THREE.Vector3());
  const span = Math.max(spanSize.x, spanSize.y, 1e-6);
  stage.scale.setScalar((viewSpan * 0.90) / span);
  stage.updateMatrixWorld(true);
  const box2 = boxFromVisibleMeshes(root, flameGroup);
  expandFlameTip(box2);
  const c = box2.getCenter(new THREE.Vector3());
  stage.position.x -= c.x;
  stage.position.y -= c.y;
  stage.updateMatrixWorld(true);

  const safe = worldSafeRect();
  const h = safe.half;
  const bodyBox = partWorldBox('body');
  const hoodBox = partWorldBox('hood');

  /* 2. I. +30° clockwise — top to the right. Fill the left pocket; period + stem may kiss the red. */
  brand.i.visible = true;
  packLeaningLetter(brand.i, 30, -h * 0.32, h * 0.30, 1, -1, bodyBox, null, 0.13, 1, safe);
  const iChosen = 30;

  /* 3. S. +30° clockwise — top to the right. Fill the lower-right pocket; red body may
     bite the top curve, black hood must not. */
  brand.s.visible = true;
  packLeaningLetter(brand.s, 30, h * 0.30, -h * 0.28, -1, 1, bodyBox, hoodBox, 0.15, 0.008, safe);
  const sChosen = 30;

  brand.i.traverse((o) => { if (o.isMesh) o.material.depthTest = true; });
  brand.s.traverse((o) => { if (o.isMesh) o.material.depthTest = true; });

  keepScreenAtZ(brand.i, 6.5);
  keepScreenAtZ(brand.s, -1.4);
  while (!letterFitsSafe(brand.i, safe) && brand.i.scale.x > 0.3) brand.i.scale.multiplyScalar(0.97);
  while (!letterFitsSafe(brand.s, safe) && brand.s.scale.x > 0.3) brand.s.scale.multiplyScalar(0.97);
  /* Sit S almost on the canvas floor (period is the lowest point). */
  dropLetterToFloor(brand.s, -safe.half + 0.12);

  brand.iScale = brand.i.scale.x;
  brand.sScale = brand.s.scale.x;
  brand.iRotZ = brand.i.rotation.z;
  brand.sRotZ = brand.s.rotation.z;
  console.log('letter angles I', iChosen, 'S', sChosen, 'scale', brand.iScale.toFixed(2), brand.sScale.toFixed(2));

  fx.position.set(0, 0, 0);
  flameGroup.scale.setScalar(1);
  brand.iRest = brand.i.position.clone();
  brand.sRest = brand.s.position.clone();
  stage.userData.baseScale = stage.scale.x;
  stage.userData.basePos = { x: stage.position.x, y: stage.position.y };
}

function applyDot(dot, rest, t, phase) {
  const ph = t * Math.PI * 2 + phase;
  dot.position.set(
    rest.x + Math.sin(ph * 3) * 0.045,
    rest.y + Math.cos(ph * 2) * 0.04,
    rest.z + Math.sin(ph * 2) * 0.03,
  );
  dot.rotation.set(
    Math.sin(ph * 3) * 0.55,
    Math.cos(ph * 2) * 0.72,
    Math.sin(ph * 2 + 0.4) * 0.4,
  );
  const s = 1 + Math.sin(ph * 4) * 0.07;
  dot.scale.setScalar(s);
}

function applyLetter(letter, rest, restZ, scale, t, phase, yaw, pitch) {
  const ph = t * Math.PI * 2 + phase;
  letter.position.set(
    rest.x + Math.sin(ph * 2) * 0.025,
    rest.y + Math.cos(ph * 2) * 0.02,
    rest.z,
  );
  letter.rotation.set(
    Math.sin(ph * 2) * pitch * 0.4,
    Math.cos(ph * 2) * yaw * 0.45,
    restZ + Math.sin(ph * 2) * 0.025,
  );
  letter.scale.setScalar(scale * (1 + Math.sin(ph * 2) * 0.01));
}

function applyFrame(fr) {
  /* Open interval [0, 1) so frame TOTAL steps into frame 1 with no pose jump. */
  const t = (fr - 1) / TOTAL;
  const ph = t * Math.PI * 2;

  const flameOn = Math.max(
    trap(t, 0.10, 0.16, 0.36, 0.46),
    trap(t, 0.54, 0.60, 0.82, 0.93),
  );
  const ignite = Math.max(
    trap(t, 0.08, 0.12, 0.16, 0.22),
    trap(t, 0.52, 0.56, 0.60, 0.66),
  );

  lighterSpin.rotation.y = 0.12 + Math.sin(ph) * 0.10;
  lighterSpin.rotation.x = Math.sin(ph * 2) * 0.05;
  lighterPivot.rotation.x = 0.10 + Math.sin(ph) * 0.03;
  lighterPivot.rotation.z = -0.72 + Math.sin(ph) * 0.02;

  sparkWheel.rotation.x = ignite * 16 + ph * 2;
  const press = flameOn;
  lever.rotation.x = 0.32 * press;
  lever.position.y = (lever.userData.restY ?? lever.position.y) - 0.11 * press;

  const flick = 0.9 + 0.1 * Math.sin(ph * 8);
  const on = flameOn * flick;
  flameGroup.visible = on > 0.02;
  flameGroup.scale.set(
    1.04 + 0.06 * on + 0.02 * Math.sin(ph * 8),
    1.0 + 0.08 * on * (0.96 + 0.04 * Math.sin(ph * 6)),
    1.04 + 0.06 * on + 0.02 * Math.cos(ph * 8),
  );
  flameGroup.rotation.set(0, 0, 0);
  for (const p of flameParts) {
    p.mesh.visible = on > 0.03;
  }

  for (const sp of sparks) {
    const u = ignite * (0.55 + 0.45 * ((Math.sin(ph * 6 + sp.seed * 9) + 1) * 0.5));
    if (u < 0.08) {
      sp.mesh.visible = false;
      continue;
    }
    sp.mesh.visible = true;
    const k = (t * 6 + sp.seed) % 1;
    sp.mesh.position.set(
      sp.ax * (0.12 + k * 0.22),
      0.06 + sp.ay * k * 0.55,
      (sp.seed - 0.5) * 0.35,
    );
    sp.mesh.scale.setScalar((0.5 + 0.7 * (1 - k)) * u);
  }

  flameLight.intensity = 7.5 * on;
  flameLight2.intensity = 5.5 * on;
  flameLight.color.setHex(0xff3a10);
  flameLight2.color.setHex(0xffc040);
  flameLight.position.set(0, 0.85, 0);
  flameAnchor.localToWorld(flameLight.position);
  root.worldToLocal(flameLight.position);
  flameLight2.position.set(0, 1.7, 0);
  flameAnchor.localToWorld(flameLight2.position);
  root.worldToLocal(flameLight2.position);

  function sweepGlance(spot, obj, tOff, xAmp) {
    if (!obj) return;
    const aim = new THREE.Vector3();
    obj.getWorldPosition(aim);
    spot.target.position.copy(aim);
    const u = Math.sin(ph + tOff);
    spot.position.set(aim.x - 6.5 + u * xAmp, aim.y + 2.2 + Math.cos(ph + tOff) * 3.5, aim.z + 16);
    spot.intensity = 22 + 8 * (0.5 + 0.5 * Math.sin(ph * 2 + tOff));
  }
  sweepGlance(iSpot, brand.i, 0.0, 7.5);
  sweepGlance(sSpot, brand.s, 2.094, 1.8);
  sSpot.intensity = 22;
  sweepGlance(bodySpot, lighterSpin, 4.189, 8.0);
  bodySpot.intensity = 32 + 10 * (0.5 + 0.5 * Math.sin(ph * 2));

  if (iGlance?.material.uniforms) {
    iGlance.material.uniforms.uShift.value = Math.sin(ph) * 0.38;
    iGlance.material.uniforms.uGain.value = 0.92 + 0.08 * (0.5 + 0.5 * Math.sin(ph * 2));
  }
  if (sGlance?.material.uniforms) {
    sGlance.material.uniforms.uShift.value = Math.sin(ph + 2.094) * 0.12;
    sGlance.material.uniforms.uGain.value = 0.88;
  }
  if (bodyShine) {
    const u = Math.sin(ph + 4.189);
    bodyShine.position.set(u * 0.48, 0.04, 0.58);
    bodyShine.rotation.y = u * 0.12;
    bodyShine.material.opacity = 0.95 + 0.05 * (0.5 + 0.5 * Math.sin(ph * 2));
  }
  if (scene.environmentRotation) {
    scene.environmentRotation.y = ph;
  }

  applyLetter(brand.i, brand.iRest, brand.iRotZ, brand.iScale, t, 0.0, 0.018, 0.012);
  applyLetter(brand.s, brand.sRest, brand.sRotZ, brand.sScale, t, 2.094, 0.018, 0.012);
  applyDot(brand.iDot, brand.iDotRest, t, 0.7);
  applyDot(brand.sDot, brand.sDotRest, t, 2.3);

  const base = stage.userData.basePos || { x: 0, y: 0 };
  stage.position.x = base.x + Math.sin(ph) * 0.02;
  stage.position.y = base.y + Math.cos(ph) * 0.016;
  const bs = stage.userData.baseScale || 1;
  stage.scale.setScalar(bs * (1 + Math.sin(ph * 2) * 0.004));

  camera.lookAt(0, 0, 0);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (fr) => { applyFrame(fr); return fr; };
window.TOTAL = TOTAL;
window.ready = false;

(async () => {
  try {
    buildLighter();
    buildLetters();
    buildFx();
    containRoot();
    applyFrame(1);
    window.ready = true;
    console.log('LIGHTER_READY');
  } catch (e) {
    console.error('LIGHTER_FAIL', e);
  }
})();
</script>
