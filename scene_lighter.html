}

function sChromeMat(withGlance = false) {
  if (!withGlance) {
    return new THREE.MeshMatcapMaterial({
      matcap: sChromeMatcap,
      color: 0xffffff,
      toneMapped: false,
    });
  }
  /* Same matcap, plus I's moderate traveling chrome window on the 3D form. */
  return new THREE.ShaderMaterial({
    uniforms: {
      matcap: { value: sChromeMatcap },
      uShift: sGlanceU.uShift,
      uGain: sGlanceU.uGain,
    },
    vertexShader: `
      varying vec3 vViewPosition;
      varying vec3 vNormal;
      varying float vX;
      void main() {
        vX = position.x;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D matcap;
      uniform float uShift;
      uniform float uGain;
      varying vec3 vViewPosition;
      varying vec3 vNormal;
      varying float vX;
      void main() {
        vec3 normal = normalize(vNormal);
        vec3 viewDir = normalize(vViewPosition);
        vec3 x = normalize(vec3(viewDir.z, 0.0, -viewDir.x));
        vec3 y = cross(viewDir, x);
        vec2 uv = vec2(dot(x, normal), dot(y, normal)) * 0.495 + 0.5;
        vec3 col = texture2D(matcap, uv).rgb;
        float d = abs(vX - uShift);
        float core = 1.0 - smoothstep(0.08, 0.20, d);
        float halo = 1.0 - smoothstep(0.20, 0.42, d);
        float a = max(core, halo * 0.45) * uGain;
        col += vec3(a);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    toneMapped: false,
  });
}

function trap(t, a, b, c, d) {
  if (t <= a || t >= d) return 0;
  if (t < b) { const u = (t - a) / (b - a); return u * u * (3 - 2 * u); }
  if (t < c) return 1;
  const u = (t - c) / (d - c); return 1 - u * u * (3 - 2 * u);
}

function seeded(n) {
  return () => {
    n = (n * 16807) % 2147483647;
    return (n - 1) / 2147483646;
  };
}

function insetGlanceMat(bottomWide = 1) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uGain: { value: 1 },
      uBottomWide: { value: bottomWide },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uGain;
      uniform float uBottomWide;
      varying vec2 vUv;
      void main() {
        float widen = mix(uBottomWide, 1.0, vUv.y);
        float d = abs(vUv.x - 0.5) / max(widen, 0.2);
        float core = 1.0 - smoothstep(0.18, 0.30, d);
        float halo = 1.0 - smoothstep(0.30, 0.46, d);
        float fadeY = smoothstep(0.0, 0.05, vUv.y) * (1.0 - smoothstep(0.93, 1.0, vUv.y));
        float a = max(core, halo * 0.18) * fadeY * uGain;
        if (a < 0.04) discard;
        gl_FragColor = vec4(1.0, 1.0, 1.0, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    toneMapped: false,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2,
  });
}

function makeInsetGlance(w, h, bottomWide = 1) {

}

function glanceMat(width = 1) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uShift: { value: 0 },
      uGain: { value: 1 },
      uWidth: { value: width },
    },
    vertexShader: `
      varying float vX;
      void main() {
        vX = position.x;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uShift;
      uniform float uGain;
      uniform float uWidth;
      varying float vX;
      void main() {
        float d = abs(vX - uShift) / max(uWidth, 0.001);
        float core = 1.0 - smoothstep(0.032, 0.072, d);
        float halo = 1.0 - smoothstep(0.072, 0.15, d);
        float a = max(core, halo * 0.4) * uGain;
        if (a < 0.03) discard;
        gl_FragColor = vec4(1.0, 1.0, 1.0, a);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthTest: true,
    depthWrite: false,
    toneMapped: false,
    side: THREE.FrontSide,
  });
}

function attachGlance(letter, ch) {

  mesh.material.polygonOffset = true;
  mesh.material.polygonOffsetFactor = -2;
  mesh.material.polygonOffsetUnits = -2;
  mesh.position.set(body.position.x, body.position.y, 0.52);
  mesh.renderOrder = 4;
  letter.add(mesh);
  letter.userData.glance = mesh;
  return mesh;
}

function flamePath(ctx, cx, top, bot, halfW) {
  const hh = bot - top;
  const baseW = Math.max(8, halfW * 0.16);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.bezierCurveTo(cx + halfW * 0.18, top + hh * 0.16, cx + halfW * 0.92, top + hh * 0.38, cx + halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx + halfW * 1.02, top + hh * 0.76, cx + baseW, bot - 2, cx + baseW, bot);
  ctx.lineTo(cx - baseW, bot);
  ctx.bezierCurveTo(cx - baseW, bot - 2, cx - halfW * 1.02, top + hh * 0.76, cx - halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx - halfW * 0.92, top + hh * 0.38, cx - halfW * 0.18, top + hh * 0.16, cx, top);
  ctx.closePath();
}

/** Opaque painted flame: dark-red outline + saturated body + yellow-white core. */
function makeFlameSpriteTex() {
  const w = 256;
  const h = 512;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const cx = w * 0.5;
  const top = 12;
  const bot = 508;
  const hw = 102;

  flamePath(ctx, cx, top, bot, hw);
  ctx.fillStyle = '#2a0000';
  ctx.fill();

  flamePath(ctx, cx, top + 10, bot - 2, hw * 0.88);
  ctx.fillStyle = '#9a0000';
  ctx.fill();

  flamePath(ctx, cx, top + 20, bot - 10, hw * 0.74);
  const body = ctx.createLinearGradient(cx, bot, cx, top);
  body.addColorStop(0.00, '#ff0a00');
  body.addColorStop(0.12, '#ff1a00');
  body.addColorStop(0.32, '#ff3a00');
  body.addColorStop(0.52, '#ff6a00');
  body.addColorStop(0.70, '#ffb000');
  body.addColorStop(0.86, '#ffe56a');
  body.addColorStop(1.00, '#fffce8');
  ctx.fillStyle = body;
  ctx.fill();

  flamePath(ctx, cx, top + 110, bot - 95, hw * 0.32);
  const core = ctx.createLinearGradient(cx, bot - 90, cx, top + 40);
  core.addColorStop(0.00, '#ffb000');
  core.addColorStop(0.35, '#ffe56a');
  core.addColorStop(0.70, '#fffce0');
  core.addColorStop(1.00, '#ffffff');
  ctx.fillStyle = core;
  ctx.fill();

  const blue = ctx.createRadialGradient(cx, bot - 18, 3, cx, bot - 28, 40);
  blue.addColorStop(0.00, 'rgba(210,235,255,1)');
  blue.addColorStop(0.28, 'rgba(40,100,255,1)');
  blue.addColorStop(0.70, 'rgba(20,50,220,0.55)');
  blue.addColorStop(1.00, 'rgba(20,50,220,0)');
  ctx.fillStyle = blue;
  ctx.beginPath();
  ctx.ellipse(cx, bot - 22, 34, 44, 0, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/** Irregular S-curve flame tongue — opaque so it reads on light chat backgrounds. */
function makeWindingFlameTex(seed) {
  const w = 256, h = 640;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const rnd = seeded(seed * 97 + 13);
  const cx = 128;
  const tongue = (ox, sway, wBase, tipY, dark) => {
    const baseY = 628;
    g.beginPath();
    g.moveTo(cx + ox, baseY);
    g.bezierCurveTo(cx + ox - wBase, baseY - 80, cx + ox - wBase * 1.4 + sway * 0.4, baseY - 210, cx + ox + sway * 0.7, baseY - 340);
    g.bezierCurveTo(cx + ox + sway * 1.5, tipY + 150, cx + ox + sway * 1.65, tipY + 70, cx + ox + sway * 0.8, tipY);
    g.bezierCurveTo(cx + ox + sway * 0.1, tipY + 80, cx + ox - sway * 0.5, tipY + 200, cx + ox - sway * 0.15, baseY - 330);
    g.bezierCurveTo(cx + ox + wBase, baseY - 180, cx + ox + wBase * 0.5, baseY - 70, cx + ox, baseY);
    g.closePath();
    const grd = g.createLinearGradient(cx + ox, baseY, cx + ox + sway * 0.6, tipY);
    if (dark) {
      grd.addColorStop(0.00, '#3a0000');
      grd.addColorStop(0.25, '#c01400');
      grd.addColorStop(0.60, '#ff4a00');
      grd.addColorStop(1.00, '#ffb020');
    } else {
      grd.addColorStop(0.00, '#2a0000');
      grd.addColorStop(0.12, '#ff1a00');
      grd.addColorStop(0.40, '#ff6a00');
      grd.addColorStop(0.70, '#ffd040');
      grd.addColorStop(1.00, '#fff8e0');
    }
    g.fillStyle = grd;
    g.fill();
  };
  tongue(-8, 70 + rnd() * 50, 58, 24 + rnd() * 30, true);
  tongue(18, -88 - rnd() * 36, 50, 48 + rnd() * 28, true);
  tongue(-2, 54 + rnd() * 40, 64, 8 + rnd() * 18, false);
  tongue(12, -62 - rnd() * 30, 46, 36 + rnd() * 22, false);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/** Wide jagged bolt with dark outline — survives 30×30. */
function makeLightningTex(seed) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const rnd = seeded(seed * 131 + 7);
  const pts = [];
  let x = w * 0.5;
  pts.push([x, h - 10]);
  const segs = 8 + Math.floor(rnd() * 5);
  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    x = w * 0.5 + (rnd() - 0.52) * 150 * Math.sin(u * Math.PI) + (rnd() - 0.5) * 36;
    pts.push([x, h - 10 - u * (h - 22)]);
  }
  const stroke = (width, color) => {
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'round';
    ctx.miterLimit = 8;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };
  stroke(48, '#1a0600');
  stroke(32, seed % 2 ? '#ff7a00' : '#3a7cff');
  stroke(18, seed % 2 ? '#ffe566' : '#c8e8ff');
  stroke(8, '#ffffff');
  const mid = 3 + Math.floor(rnd() * 3);
  const bx = pts[mid][0], by = pts[mid][1];
  const bpts = [[bx, by]];
  let bx2 = bx, by2 = by;
  const bSeg = 3 + Math.floor(rnd() * 2);
  const dir = rnd() > 0.5 ? 1 : -1;
  for (let i = 1; i <= bSeg; i++) {
    bx2 += dir * (28 + rnd() * 40);
    by2 -= 28 + rnd() * 36;
    bpts.push([bx2, by2]);
  }
  const strokeB = (width, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(bpts[0][0], bpts[0][1]);
    for (let i = 1; i < bpts.length; i++) ctx.lineTo(bpts[i][0], bpts[i][1]);
    ctx.stroke();
  };
  strokeB(28, '#1a0600');
  strokeB(18, seed % 2 ? '#ff9900' : '#4488ff');
  strokeB(9, '#ffffff');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function makeSparkStreakTex(seed) {
  const w = 256;
  const h = 512;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const rnd = seeded(seed * 173 + 11);
  ctx.clearRect(0, 0, w, h);
  const cx = w * 0.5;
  const pts = [];
  let x = cx;
  pts.push([x, h - 6]);
  const segs = 5 + Math.floor(rnd() * 3);
  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    x = cx + (rnd() - 0.5) * 70 * u;
    pts.push([x, h - 6 - u * (h - 18)]);
  }
  const stroke = (width, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };
  stroke(54, 'rgba(80,20,0,0.85)');
  stroke(32, '#ff6a00');
  stroke(18, '#ffd24a');
  stroke(8, '#fffce8');
  const mid = 2 + Math.floor(rnd() * 2);
  let bx = pts[mid][0];
  let by = pts[mid][1];
  const dir = rnd() > 0.5 ? 1 : -1;
  ctx.strokeStyle = '#ffe566';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.lineTo(bx + dir * (36 + rnd() * 40), by - 40 - rnd() * 50);
  ctx.stroke();
  ctx.fillStyle = '#fff8e0';
  ctx.beginPath();
  ctx.arc(cx, h - 10, 16 + rnd() * 8, 0, Math.PI * 2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function sampleBezier(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ]);
  }
  return pts;
}

/** Extra-bold antiqua capital I — thick stem, bracketed slab serifs. */
function timesIShape() {
  const s = new THREE.Shape();
  const stem = 0.40;
  const serifW = 0.90;
  const serifH = 0.26;
  const h = 1.52;
  const br = 0.16;
  s.moveTo(-serifW, -h);
  s.lineTo(serifW, -h);
  s.lineTo(serifW, -h + serifH * 0.55);
  s.quadraticCurveTo(serifW * 0.22, -h + serifH, stem, -h + serifH + br);
  s.lineTo(stem, h - serifH - br);
  s.quadraticCurveTo(serifW * 0.22, h - serifH, serifW, h - serifH * 0.55);
  s.lineTo(serifW, h);
  s.lineTo(-serifW, h);
  s.lineTo(-serifW, h - serifH * 0.55);
  s.quadraticCurveTo(-serifW * 0.22, h - serifH, -stem, h - serifH - br);
  s.lineTo(-stem, -h + serifH + br);
  s.quadraticCurveTo(-serifW * 0.22, -h + serifH, -serifW, -h + serifH * 0.55);
  s.closePath();
  return s;
}

/** Times-like roman S — oval bowls, modest terminals (not comic bubble). */
function timesSShape() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return strokeShape(top.concat(bot.slice(1)), 0.34);
}

function circleShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, Math.PI * 2, false);
  return s;
}

function strokeShape(pts, radius) {
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const i0 = Math.max(0, i - 1);
    const i1 = Math.min(pts.length - 1, i + 1);
    let dx = pts[i1][0] - pts[i0][0];
    let dy = pts[i1][1] - pts[i0][1];
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    left.push([pts[i][0] - dy * radius, pts[i][1] + dx * radius]);
    right.push([pts[i][0] + dy * radius, pts[i][1] - dx * radius]);
  }
  const shape = new THREE.Shape();
  shape.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) shape.lineTo(left[i][0], left[i][1]);
  const end = pts[pts.length - 1];
  shape.absarc(
    end[0], end[1], radius,
    Math.atan2(left[left.length - 1][1] - end[1], left[left.length - 1][0] - end[0]),
    Math.atan2(right[right.length - 1][1] - end[1], right[right.length - 1][0] - end[0]),
    false,
  );
  for (let i = right.length - 1; i >= 0; i--) shape.lineTo(right[i][0], right[i][1]);
  const start = pts[0];
  shape.absarc(
    start[0], start[1], radius,
    Math.atan2(right[0][1] - start[1], right[0][0] - start[0]),
    Math.atan2(left[0][1] - start[1], left[0][0] - start[0]),
    false,
  );
  shape.closePath();
  return shape;
}

function sCenterlinePts() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return top.concat(bot.slice(1));
}

function distToPolyline(x, y, pts) {
  let best = 1e9;
  for (let i = 0; i < pts.length; i++) {
    const dx = x - pts[i][0];
    const dy = y - pts[i][1];
    const d = dx * dx + dy * dy;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

/** Concave stroke valleys — bent metal that splits the glance into two ridges. */
function channelChromeGeo(geo, kind, centerline) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const amp = kind === 'dot' ? 0.022 : 0.016;
  for (let i = 0; i < pos.count; i++) {
    const nz = nrm.getZ(i);
    if (Math.abs(nz) < 0.5) continue;
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    let k = 0;
    if (kind === 'I') {
      const inStem = Math.abs(x) < 0.50 && Math.abs(y) < 1.14;
      const inSerif = Math.abs(y) > 1.04;
      if (inStem) {
        const u = Math.min(1, Math.abs(x) / 0.40);
        k = 1 - u * u;
      } else if (inSerif) {
        const yc = y > 0 ? 1.25 : -1.25;
        const u = Math.min(1, Math.abs(y - yc) / 0.24);
        k = (1 - u * u) * 0.72;
      }
    } else if (kind === 'S' && centerline) {
      const d = distToPolyline(x, y, centerline);
      const u = Math.min(1, d / 0.30);
      k = 1 - u * u;
    } else if (kind === 'dot') {
      const u = Math.min(1, Math.hypot(x, y) / 0.20);
      k = 1 - u * u;
    }
    pos.setZ(i, z - Math.sign(nz || 1) * amp * k);
  }
  geo.computeVertexNormals();
}

function extrudeOpts(depth) {
  return {
    depth,
    bevelEnabled: true,
    bevelThickness: 0.12,
    bevelSize: 0.095,
    bevelSegments: 12,
    curveSegments: 96,
    steps: 1,
  };
}

function dentedChromeSphere(radius, seed) {
  const geo = new THREE.SphereGeometry(radius, 48, 36);
  const pos = geo.attributes.position;
  const rnd = seeded(seed);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const n = Math.hypot(x, y, z) || 1;
    const dent = 0.055 * Math.sin(x * 8.2 + y * 6.4)
      + 0.04 * Math.sin(y * 9.5 + z * 7.1)
      + 0.028 * Math.sin(z * 11.0 + x * 5.5)
      + (rnd() - 0.5) * 0.025;
    const s = (1 + dent) * radius / n;
    pos.setXYZ(i, x * s, y * s, z * s);
  }
  geo.computeVertexNormals();
  channelChromeGeo(geo, 'dot', null);
  return new THREE.Mesh(geo, liquidChromeMat(false));
}

function attachEdgeShadow(mesh, xy = 1.065, z = 1.03) {
  const shell = new THREE.Mesh(
    mesh.geometry,
    new THREE.MeshBasicMaterial({
      color: 0x101214,
      side: THREE.BackSide,
      toneMapped: false,
    }),
  );
  shell.position.copy(mesh.position);
  shell.rotation.copy(mesh.rotation);
  shell.scale.copy(mesh.scale);
  shell.scale.x *= xy;
  shell.scale.y *= xy;
  shell.scale.z *= z;
  shell.renderOrder = -1;
  mesh.parent.add(shell);
  return shell;
}

function makeLetter3D(ch) {
  const g = new THREE.Group();
  const isI = ch === 'I';
  const chrome = isI ? liquidChromeMat(false) : sChromeMat(true);
  const bodyShapes = [isI ? timesIShape() : timesSShape()];
  const sLine = isI ? null : sCenterlinePts();

  const depth = 0.92;
  const geo = new THREE.ExtrudeGeometry(bodyShapes, extrudeOpts(depth));
  geo.translate(0, 0, -depth * 0.5);
  channelChromeGeo(geo, isI ? 'I' : 'S', sLine);
  const body = new THREE.Mesh(geo, chrome);
  g.add(body);

  body.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(body);
  const c = bb.getCenter(new THREE.Vector3());
  body.position.x -= c.x;
  body.position.y -= c.y;

  const sphereR = isI ? 0.44 : 0.42;
  const indent = isI ? 0.22 : 0.26;
  const dot = dentedChromeSphere(sphereR, isI ? 4103 : 7721);
  if (!isI) dot.material = sChromeMat();
  /* Gap (indent) from the glyph; bottom of the sphere sits on the text baseline. */
  const letterRight = bb.max.x - c.x;
  const letterBottom = bb.min.y - c.y;
  dot.position.set(letterRight + indent + sphereR, letterBottom + sphereR, 0);
  g.add(dot);
  g.userData.dot = dot;
  attachEdgeShadow(body, 1.07, 1.04);
  attachEdgeShadow(dot, 1.045, 1.03);
  const fill = new THREE.PointLight(0xffffff, 2.4, 10, 1.1);
  fill.position.set(0.35, 0.7, 4.2);
  g.add(fill);
  const dotFill = new THREE.PointLight(0xffffff, 2.4, 8, 1.15);
  dotFill.position.set(dot.position.x + 0.25, dot.position.y + 0.4, 2.4);
  g.add(dotFill);
  return g;
}

/** Red gas lever: thin full-width finger pad; red neck + hidden stem drop into the black. */
function buildRedFork(padLeft, padRight, depth, radius, stemX, stemH, padH = 0.22, neckH = 0.48) {
  const g = new THREE.Group();
  const red = plasticRed();
  const padW = Math.max(0.36, padRight - padLeft);
  const padR = Math.min(0.06, padH * 0.32, radius * 0.18);
  const pad = new THREE.Mesh(
    new RoundedBoxGeometry(padW, padH, depth, 5, padR),
    red,
  );
  pad.position.x = (padLeft + padRight) * 0.5;
  g.add(pad);
  const stemW = Math.min(0.28, padW * 0.32);
  const stemD = Math.min(0.42, depth * 0.38);
  /* Neck matches the pad on the chrome (left) side only; right stays the narrow plunger. */
  const stemRight = stemX + stemW * 0.5;
  const neckW = Math.max(stemW, stemRight - padLeft);
  const neckX = padLeft + neckW * 0.5;
  const neck = new THREE.Mesh(
    new RoundedBoxGeometry(neckW, neckH, stemD, 4, 0.05),
    red,
  );
  neck.position.set(neckX, -padH * 0.5 - neckH * 0.5, 0);
  g.add(neck);
  /* Hidden plunger: black, inside the collar, never shows through the plastic. */
  const stem = new THREE.Mesh(
    new RoundedBoxGeometry(stemW, stemH, stemD, 4, 0.06),
    new THREE.MeshBasicMaterial({ color: 0x050506, toneMapped: false }),
  );
  stem.position.set(stemX, -padH * 0.5 - neckH - stemH * 0.5, 0.18);
  g.add(stem);
  for (let i = 0; i < 3; i++) {
    const ridge = new THREE.Mesh(
      new RoundedBoxGeometry(Math.min(0.42, padW * 0.28), 0.018, 0.05, 2, 0.01),
      red,
    );
    ridge.position.set(stemX, padH * 0.28, -0.16 + i * 0.16);
    g.add(ridge);
  }
  g.userData.padH = padH;
  g.userData.padD = depth;
  g.userData.stemH = stemH;
  g.userData.neckX = neckX;
  g.userData.neckW = neckW;
  return g;
}

/** Knurled flint wheel + two cheek discs (exploded part B). Axle along local Y. */
function knurlWheel(radius = 0.34, width = 0.52) {
  const grp = new THREE.Group();
  const steel = new THREE.MeshPhysicalMaterial({
    color: 0xb0b8c0,
    roughness: 0.26,
    metalness: 1.0,
    envMapIntensity: 1.9,
    emissive: 0x2c343c,
    emissiveIntensity: 0.18,
    toneMapped: false,
  });
  const core = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.62, radius * 0.62, width * 0.78, 28),
    steel,
  );
  grp.add(core);
  const knurl = new THREE.MeshPhysicalMaterial({
    color: 0x6a737c,
    roughness: 0.38,
    metalness: 0.92,
    envMapIntensity: 1.4,
    emissive: 0x1a2026,
    emissiveIntensity: 0.22,
    toneMapped: false,
  });
  const n = 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const ridge = new THREE.Mesh(
      new THREE.BoxGeometry(radius * 0.40, width * 0.86, radius * 0.34),
      knurl,
    );
    ridge.position.set(Math.sin(a) * radius * 0.86, 0, Math.cos(a) * radius * 0.86);
    ridge.rotation.y = a;
    grp.add(ridge);
  }
  const cheekGeo = new THREE.CylinderGeometry(radius * 0.88, radius * 0.88, 0.07, 28);
  const cheekA = new THREE.Mesh(cheekGeo, chromeMat());
  cheekA.position.y = width * 0.42;
  const cheekB = cheekA.clone();
  cheekB.position.y = -width * 0.42;
  grp.add(cheekA, cheekB);
  return grp;
}

function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const hw = w * 0.5;
  const hd = d * 0.5;
  r = Math.min(r, hw - 0.02, hd - 0.02);
  s.moveTo(-hw + r, -hd);
  s.lineTo(hw - r, -hd);
  s.absarc(hw - r, -hd + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hw, hd - r);
  s.absarc(hw - r, hd - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hw + r, hd);
  s.absarc(-hw + r, hd - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hd + r);
  s.absarc(-hw + r, -hd + r, r, Math.PI, Math.PI * 1.5, false);
  s.closePath();
  return s;
}

/** Classic BIC shell: rounded-rect cross-section, not a square box or a tube. */
function bicShell(width, height, depth, mat, radius) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(width, depth, radius), {
    depth: height,
    bevelEnabled: true,
    bevelThickness: 0.09,
    bevelSize: 0.08,
    bevelSegments: 5,
    curveSegments: 48,
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);
  return new THREE.Mesh(geo, mat);
}

/** Front profile of the chrome hood: round top-right wheel well, square top-left. */
function chromeHoodFrontShape(w, h, rTL, rTR, rBR, rBL) {
  const s = new THREE.Shape();
  const hw = w * 0.5;
  const hh = h * 0.5;
  rTL = Math.min(rTL, w * 0.46, h * 0.46);
  rTR = Math.min(rTR, w * 0.50, h * 0.52);
  rBR = Math.min(rBR, w * 0.18, h * 0.18);
  rBL = Math.min(rBL, w * 0.22, h * 0.22);
  s.moveTo(-hw + rBL, -hh);
  s.lineTo(hw - rBR, -hh);
  s.absarc(hw - rBR, -hh + rBR, rBR, -Math.PI / 2, 0, false);
  s.lineTo(hw, hh - rTR);
  s.absarc(hw - rTR, hh - rTR, rTR, 0, Math.PI / 2, false);
  s.lineTo(-hw + rTL, hh);
  s.absarc(-hw + rTL, hh - rTL, rTL, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hh + rBL);
  s.absarc(-hw + rBL, -hh + rBL, rBL, Math.PI, Math.PI * 1.5, false);
  s.closePath();
  return s;
}

function chromeHood(width, height, depth, rTL, rTR, rBR, rBL, mat) {
  const geo = new THREE.ExtrudeGeometry(
    chromeHoodFrontShape(width, height, rTL, rTR, rBR, rBL),
    {
      depth,
      bevelEnabled: true,
      bevelThickness: 0.12,
      bevelSize: 0.11,
      bevelSegments: 8,
      curveSegments: 64,
    },
  );
  geo.translate(0, 0, -depth * 0.5);
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 2;
  m.userData.part = 'hood';
  return m;
}

function buildLighter() {
  lighterPivot = new THREE.Group();
  lighterSpin = new THREE.Group();
  lighterPivot.add(lighterSpin);
  root.add(lighterPivot);

  /* Classic BIC body: rounded-rect red shell */
  const bodyW = 2.58;
  const bodyH0 = 7.55;
  const bodyH = bodyH0 * 1.07;
  const bodyD = 1.38;
  const bodyR = 0.60;
  const body = bicShell(bodyW, bodyH, bodyD, plasticRed(), bodyR);
  body.position.y = (bodyH0 - bodyH) * 0.5;
  body.userData.part = 'body';
  lighterSpin.add(body);

  /* Nearly full-height red glance, wider toward the bottom, still inset from the sides. */
  bodyShine = makeInsetGlance(0.62, bodyH * 0.94, 1.55);
  bodyShine.position.set(-0.12, body.position.y - 0.04, 0.60);
  bodyShine.rotation.y = 0.10;
  lighterSpin.add(bodyShine);

  /* Black collar + chrome: chrome is the same bicShell, slightly larger, so the rounds seat together. */
  const collar = new THREE.Group();
  lighterSpin.add(collar);

  const headH0 = 1.12;
  const headH = headH0 * 1.13;
  const blackW = bodyW * 1.01;
  const blackD = bodyD * 1.02;
  const blackR = bodyR + 0.02;
  const headTop = bodyH0 * 0.5 + headH0 * 0.72;
  const head = bicShell(blackW, headH, blackD, plasticBlack(), blackR);
  head.position.y = headTop - headH * 0.5;
  head.userData.part = 'hood';
  collar.add(head);

  const sleevePad = 0.10;
  /* Chrome ~68% so the wheel peek and a real button bay both fit on the right. */
  const wrapW = blackW * 0.68 + sleevePad;
  const wrapD = blackD + sleevePad;
  const hoodX = -blackW * 0.5 - sleevePad * 0.4 + wrapW * 0.5;
  const hoodRight = hoodX + wrapW * 0.5;
  const hoodD = wrapD;

  head.updateWorldMatrix(true, true);
  const platformY = new THREE.Box3().setFromObject(head).max.y;

  hoodShine = makeInsetGlance(0.42, headH * 0.78, 1.2);
  hoodShine.position.set(-0.12, head.position.y, 0.64);
  hoodShine.rotation.y = 0.10;
  lighterSpin.add(hoodShine);

  const wheelR = 0.66;
  const wheelW = 0.48;
  const overlap = 0.22;
  const chromeBottom = platformY - overlap;
  const rTR = 0.78;
  /* A little taller than the last pass; wheel still peeks top-right third. */
  const chromeH = rTR + 0.90;
  const chromeTop = chromeBottom + chromeH;
  const hoodY = (chromeTop + chromeBottom) * 0.5;
  const wheelX = hoodRight - wheelR * (2 / 3);
  const wheelY = chromeTop - wheelR * (2 / 3);
  const wheelRight = wheelX + wheelR;

  /* Full-width finger pad sits on the black; only a hidden stem goes into the collar. */
  const padLeft = wheelX + wheelR * 0.08;
  const padRight = blackW * 0.5 - 0.04;
  const visibleX = (wheelRight + padRight) * 0.5;
  const stemH = headH * 0.42;
  const padH = 0.22;
  const padTop = platformY + 0.62;
  const padBottom = padTop - padH;
  const neckH = Math.max(0.12, padBottom - platformY + 0.08);
  const pressGap = padBottom - platformY;

  lever = buildRedFork(padLeft, padRight, blackD * 0.82, blackR, visibleX, stemH, padH, neckH);
  const restY = (padTop + padBottom) * 0.5;
  lever.position.set(0, restY, -0.16);
  lighterSpin.add(lever);
  lever.userData.restY = restY;
  lever.userData.restZ = lever.position.z;
  lever.userData.pressGap = pressGap;

  /* Dark well in the black so the stem enters it without showing on the outer collar. */
  const stemWell = new THREE.Mesh(
    new THREE.BoxGeometry(lever.userData.neckW, 0.16, blackD * 0.40),
    new THREE.MeshBasicMaterial({ color: 0x050506, toneMapped: false }),
  );
  stemWell.position.set(lever.userData.neckX, platformY - 0.06, 0);
  lighterSpin.add(stemWell);

  const wheelZ = 0.14;
  const hood = chromeHood(wrapW, chromeH, wrapD, 0.05, rTR, 0.12, 0.14, hoodChromeMat());
  hood.position.set(hoodX, hoodY, 0);
  collar.add(hood);

  /* Square fastener on the visible lower-right of the chrome, just above the collar. */
  const fastenerY = platformY + 0.22;
  const fastenerX = hoodRight - 0.30;
  const fastener = new THREE.Mesh(
    new THREE.BoxGeometry(0.40, 0.42, 0.13),
    hoodChromeMat(),
  );
  fastener.position.set(fastenerX, fastenerY, wrapD * 0.5 + 0.03);
  fastener.userData.part = 'hood';
  fastener.renderOrder = 2;
  collar.add(fastener);
  const fastenerSlot = new THREE.Mesh(
    new THREE.BoxGeometry(0.24, 0.24, 0.07),
    new THREE.MeshBasicMaterial({ color: 0x121316, toneMapped: false }),
  );
  fastenerSlot.position.set(fastenerX, fastenerY, wrapD * 0.5 + 0.09);
  collar.add(fastenerSlot);

  chromeShine = makeInsetGlance(0.28, chromeH * 0.70, 1.18);
  chromeShine.position.set(hoodX - 0.12, hoodY + 0.06, hoodD * 0.52);
  chromeShine.rotation.y = 0.06;
  chromeShine.userData.baseX = hoodX - 0.12;
  lighterSpin.add(chromeShine);

  /* Jet hole in the LEFT of the chrome top — a cut in the metal, not a separate chimney. */
  hood.updateWorldMatrix(true, true);
  const chromeSkinY = new THREE.Box3().setFromObject(hood).max.y;
  const jetX = hoodX - wrapW * 0.26;
  const jetZ = 0;
  const jetY = chromeSkinY;
  const holeR = 0.18;
  const wellH = 0.22;

  const jetCut = new THREE.Shape();
  jetCut.absarc(0, 0, holeR + 0.07, 0, Math.PI * 2, false);
  const jetVoid = new THREE.Path();
  jetVoid.absarc(0, 0, holeR, 0, Math.PI * 2, true);
  jetCut.holes.push(jetVoid);
  const jetRimGeo = new THREE.ExtrudeGeometry(jetCut, {
    depth: 0.045,
    bevelEnabled: true,
    bevelThickness: 0.012,
    bevelSize: 0.010,
    bevelSegments: 3,
    curveSegments: 40,
  });
  jetRimGeo.rotateX(-Math.PI / 2);
  jetRimGeo.translate(0, 0.02, 0);
  const jetRim = new THREE.Mesh(jetRimGeo, hoodChromeMat());
  jetRim.position.set(jetX, jetY - 0.01, jetZ);
  jetRim.renderOrder = 3;
  jetRim.userData.part = 'hood';
  collar.add(jetRim);

  const jetSleeve = new THREE.Mesh(
    new THREE.CylinderGeometry(holeR, holeR, wellH, 28, 1, true),
    hoodChromeMat(),
  );
  jetSleeve.material.side = THREE.DoubleSide;
  jetSleeve.position.set(jetX, jetY - wellH * 0.5, jetZ);
  jetSleeve.renderOrder = 3;
  jetSleeve.userData.part = 'hood';
  collar.add(jetSleeve);

  const jetWell = new THREE.Mesh(
    new THREE.CircleGeometry(holeR * 0.98, 28),
    new THREE.MeshBasicMaterial({ color: 0x050506, toneMapped: false }),
  );
  jetWell.rotation.x = -Math.PI / 2;
  jetWell.position.set(jetX, jetY - 0.05, jetZ);
  jetWell.renderOrder = 3;
  collar.add(jetWell);

  const wheelMount = new THREE.Group();
  wheelMount.position.set(wheelX, wheelY, wheelZ);
  wheelMount.rotation.x = Math.PI / 2;
  const wheel = knurlWheel(wheelR, wheelW);
  wheelMount.add(wheel);
  lighterSpin.add(wheelMount);
  sparkWheel = wheel;

  /* Chrome washer on the disk — the axle is attached under the damper, hub stays covered. */
  const hubCap = new THREE.Mesh(new THREE.CircleGeometry(wheelR * 0.42, 28), hoodChromeMat());
  hubCap.position.set(wheelX, wheelY, wheelZ + wheelW * 0.52);
  lighterSpin.add(hubCap);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(wheelR * 0.16, wheelR * 0.16, 0.07, 16), steelMat());
  hub.rotation.x = Math.PI / 2;
  hub.position.set(wheelX, wheelY, wheelZ + wheelW * 0.56);
  lighterSpin.add(hub);

  const flint = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.055, 0.22, 14),
    steelMat(),
  );
  flint.position.set(wheelX, wheelY - wheelR * 0.70, wheelZ + 0.08);
  lighterSpin.add(flint);

  flameAnchor = new THREE.Group();
  flameAnchor.position.set(jetX, jetY + 0.02, jetZ);
  lighterSpin.add(flameAnchor);

  flameGroup = new THREE.Group();
  flameAnchor.add(flameGroup);

  /* Teardrop rooted at the nozzle; origin is the flame base */
  const flameH = 4.15;
  const flameGeo = new THREE.PlaneGeometry(2.45, flameH);
  flameGeo.translate(0, flameH * 0.5, 0);
  const sprite = new THREE.Mesh(
    flameGeo,
    new THREE.MeshBasicMaterial({
      map: makeFlameSpriteTex(),
      transparent: true,
      alphaTest: 0.12,
      depthWrite: false,
      toneMapped: false,
      side: THREE.DoubleSide,
    }),
  );
  sprite.position.set(0, -0.06, 0);
  sprite.renderOrder = 2;

  flameGroup.add(sprite);
  flameParts.push({ mesh: sprite, kind: 'sprite' });

  const sparkMat = new THREE.MeshBasicMaterial({
    color: 0xfff4c8,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    toneMapped: false,
  });
  sparkGroup = new THREE.Group();
  /* Same opening as the flame: sparks leave the chrome through the jet, up only. */
  sparkGroup.position.set(jetX, jetY + 0.02, jetZ);
  lighterSpin.add(sparkGroup);
  const sparkDepth = {
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    toneMapped: false,
  };
  const flash = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 12, 12),
    new THREE.MeshBasicMaterial({
      color: 0xfff4c0,
      ...sparkDepth,
    }),
  );
  flash.renderOrder = 3;
  sparkGroup.add(flash);
  sparks.push({ mesh: flash, kind: 'flash', seed: 0.1, ax: 0, ay: 0.12 });
  for (let i = 0; i < 8; i++) {
    const boltGeo = new THREE.PlaneGeometry(0.95, 2.20);
    boltGeo.translate(0, 1.10, 0);
    const bolt = new THREE.Mesh(
      boltGeo,
      new THREE.MeshBasicMaterial({
        map: makeSparkStreakTex(i + 3),
        ...sparkDepth,
        side: THREE.DoubleSide,
      }),
    );
    bolt.renderOrder = 3;
    sparkGroup.add(bolt);
    sparks.push({
      mesh: bolt,
      kind: 'bolt',
      seed: i * 0.73 + 0.2,
      ax: (i % 2 === 0 ? 1 : -1) * (0.06 + i * 0.018),
      ay: 1.15 + (i % 3) * 0.12,
    });
  }
  for (let i = 0; i < 8; i++) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), sparkMat.clone());
    mesh.material.depthTest = true;
    mesh.renderOrder = 3;
    sparkGroup.add(mesh);
    sparks.push({
      mesh,
      kind: 'dot',
      seed: i * 0.91 + 0.4,
      ax: (i % 2 === 0 ? 0.10 : -0.08) * (0.4 + i * 0.04),
      ay: 0.85 + i * 0.12,
    });
  }

  lighterPivot.rotation.z = -0.72;
  lighterPivot.rotation.x = 0.36;
  lighterPivot.position.set(0, 0, 0);
}

function buildLetters() {
  brand.i = makeLetter3D('I');
  brand.i.scale.setScalar(1);
  brand.i.rotation.z = THREE.MathUtils.degToRad(-30);
  iGlance = attachGlance(brand.i, 'I');
  stage.add(brand.i);

  brand.s = makeLetter3D('S');
  brand.s.scale.setScalar(1);
  brand.s.rotation.z = THREE.MathUtils.degToRad(-30);
  sGlance = attachGlance(brand.s, 'S');
  brand.s.traverse((o) => { o.layers.enable(1); });
  stage.add(brand.s);

  brand.iScale0 = brand.i.scale.x;
  brand.sScale0 = brand.s.scale.x;
  brand.iScale = brand.iScale0;
  brand.sScale = brand.sScale0;
  brand.iRotZ = brand.i.rotation.z;
  brand.sRotZ = brand.s.rotation.z;
  brand.iDot = brand.i.userData.dot;
  brand.sDot = brand.s.userData.dot;
  brand.iDotRest = brand.iDot.position.clone();
  brand.sDotRest = brand.sDot.position.clone();
}

function objectSize(obj) {
  const saved = obj.position.clone();
  obj.position.set(0, 0, 0);
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj);
  const s = b.getSize(new THREE.Vector3());
  obj.position.copy(saved);
  return s;
}

function spinToStage(x, y, z) {
  const v = new THREE.Vector3(x, y, z);
  lighterSpin.updateMatrixWorld(true);
  lighterSpin.localToWorld(v);
  stage.worldToLocal(v);
  return v;
}

/* Move in Z while keeping the same screen position and apparent size. */
function keepScreenAtZ(obj, zWorld) {
  obj.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  obj.getWorldPosition(w);
  const k = (camera.position.z - zWorld) / camera.position.z;
  w.x *= k;
  w.y *= k;
  w.z = zWorld;
  obj.parent.worldToLocal(w);
  obj.position.copy(w);
  obj.scale.multiplyScalar(k);
}

function expandFlameTip(box) {
  const spinY = lighterSpin.rotation.y;
  const spinX = lighterSpin.rotation.x;
  const pivX = lighterPivot.rotation.x;
  const pivZ = lighterPivot.rotation.z;
  const fs = flameGroup.scale.clone();
  /* Cover flick scale + lighter yaw/pitch so the flame never leaves the square. */
  flameGroup.scale.set(1.14, 1.12, 1.14);
  const poses = [
    [-0.60, -0.05, 0.33],
    [-0.52, 0.00, 0.36],
    [-0.44, 0.05, 0.40],
  ];
  for (const [y, sx, px] of poses) {
    lighterSpin.rotation.y = y;
    lighterSpin.rotation.x = sx;
    lighterPivot.rotation.x = px;
    stage.updateMatrixWorld(true);
    for (const xy of [[0, 4.15], [-0.55, 3.95], [0.6, 4.1]]) {
      const p = new THREE.Vector3(xy[0], xy[1], 0);
      flameAnchor.localToWorld(p);
      box.expandByPoint(p);
    }
  }
  lighterSpin.rotation.y = spinY;
  lighterSpin.rotation.x = spinX;
  lighterPivot.rotation.x = pivX;
  lighterPivot.rotation.z = pivZ;
  flameGroup.scale.copy(fs);
  stage.updateMatrixWorld(true);
}

function expandLighterSweep(box) {
  const spinY = lighterSpin.rotation.y;
  const spinX = lighterSpin.rotation.x;
  const pivX = lighterPivot.rotation.x;
  const pivZ = lighterPivot.rotation.z;
  const poses = [
    [-0.30, -0.05, 0.33, -0.74],
    [-0.14, 0.05, 0.39, -0.70],
    [-0.22, 0.00, 0.36, -0.72],
    [-0.30, 0.05, 0.39, -0.74],
    [-0.14, -0.05, 0.33, -0.70],
  ];
  for (const [y, sx, px, pz] of poses) {
    lighterSpin.rotation.y = y;
    lighterSpin.rotation.x = sx;
    lighterPivot.rotation.x = px;
    lighterPivot.rotation.z = pz;
    stage.updateMatrixWorld(true);
    box.union(boxFromVisibleMeshes(root, flameGroup));
  }
  lighterSpin.rotation.y = spinY;
  lighterSpin.rotation.x = spinX;
  lighterPivot.rotation.x = pivX;
  lighterPivot.rotation.z = pivZ;
  stage.updateMatrixWorld(true);
}

function boxFromVisibleMeshes(rootObj, skip) {
  const box = new THREE.Box3();
  rootObj.updateMatrixWorld(true);
  rootObj.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    let p = node;
    while (p) {
      if (p === skip || p.visible === false) return;
      if (p === rootObj) break;
      p = p.parent;
    }
    if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
    const b = node.geometry.boundingBox.clone().applyMatrix4(node.matrixWorld);
    box.union(b);
  });
  return box;
}

function placeLetterContact(letter, lx, ly, lighterX, lighterY, lighterZ) {
  const z = letter.position.z;
  letter.position.set(0, 0, z);
  stage.updateMatrixWorld(true);
  letter.updateMatrixWorld(true);
  const from = new THREE.Vector3(lx, ly, 0);
  letter.localToWorld(from);
  stage.worldToLocal(from);
  const to = spinToStage(lighterX, lighterY, lighterZ);
  letter.position.set(to.x - from.x, to.y - from.y, z);
}

function worldSafeRect() {
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const inset = half * 2 * 0.08;
  return { minX: -half + inset, maxX: half - inset, minY: -half + inset, maxY: half - inset, half };
}

function localGlyphBox(letter) {
  const pos = letter.position.clone();
  const scl = letter.scale.clone();
  const rot = letter.rotation.clone();
  letter.position.set(0, 0, 0);
  letter.scale.setScalar(1);
  letter.rotation.set(0, 0, 0);
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  letter.position.copy(pos);
  letter.scale.copy(scl);
  letter.rotation.copy(rot);
  letter.updateMatrixWorld(true);
  return b;
}

function letterFitsSafe(letter, safe) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  return (
    b.min.x >= safe.minX && b.max.x <= safe.maxX
    && b.min.y >= safe.minY && b.max.y <= safe.maxY
  );
}

function setLetterWorldXY(letter, x, y) {
  letter.updateMatrixWorld(true);
  const w = new THREE.Vector3();
  letter.getWorldPosition(w);
  w.x = x;
  w.y = y;
  letter.parent.worldToLocal(w);
  letter.position.x = w.x;
  letter.position.y = w.y;
}

function dropLetterToFloor(letter, floorY) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  const dy = b.min.y - floorY;
  if (dy <= 0) return;
  const w = new THREE.Vector3();
  letter.getWorldPosition(w);
  w.y -= dy;
  letter.parent.worldToLocal(w);
  letter.position.copy(w);
}

function growAtWorldPos(letter, wx, wy, safe) {
  let lo = 0.5;
  let hi = 9;
  for (let n = 0; n < 20; n++) {
    const mid = (lo + hi) * 0.5;
    letter.scale.setScalar(mid);
    setLetterWorldXY(letter, wx, wy);
    if (letterFitsSafe(letter, safe)) lo = mid;
    else hi = mid;
  }
  letter.scale.setScalar(lo);
  setLetterWorldXY(letter, wx, wy);
}

function letterArea(letter) {
  letter.updateMatrixWorld(true);
  const s = new THREE.Box3().setFromObject(letter).getSize(new THREE.Vector3());
  return s.x * s.y + 1e-6;
}

function nudgeToBody(letter, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe) {
  const step = 0.14;
  for (let i = 0; i < 70; i++) {
    letter.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(letter);
    const area = letterArea(letter);
    const bodyHit = xyOverlapArea(b, bodyBox) / area;
    const hoodHit = hoodBox ? xyOverlapArea(b, hoodBox) / area : 0;
    if (bodyHit >= minBody && hoodHit <= maxHood) break;
    let dx = 0;
    let dy = 0;
    if (hoodHit > maxHood) {
      dx = -tx;
      dy = -ty;
    } else if (bodyHit < minBody) {
      dx = tx;
      dy = ty;
    } else break;
    letter.position.x += dx * step;
    letter.position.y += dy * step;
    if (!letterFitsSafe(letter, safe)) {
      letter.position.x -= dx * step;
      letter.position.y -= dy * step;
      if (letter.scale.x > 1.4) letter.scale.multiplyScalar(0.97);
      else break;
    }
  }
}

function packLeaningLetter(letter, deg, wx, wy, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe) {
  letter.rotation.z = THREE.MathUtils.degToRad(-deg);
  growAtWorldPos(letter, wx, wy, safe);
  nudgeToBody(letter, tx, ty, bodyBox, hoodBox, minBody, maxHood, safe);
  return letter.scale.x;
}

function partWorldBox(part) {
  const box = new THREE.Box3();
  lighterSpin.updateMatrixWorld(true);
  lighterSpin.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    let p = node;
    let ok = false;
    while (p && p !== lighterSpin.parent) {
      if (p.userData && p.userData.part === part) { ok = true; break; }
      p = p.parent;
    }
    if (!ok) return;
    if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
    box.union(node.geometry.boundingBox.clone().applyMatrix4(node.matrixWorld));
  });
  return box;
}

function xyOverlapArea(a, b) {
  const ox = Math.min(a.max.x, b.max.x) - Math.max(a.min.x, b.min.x);
  const oy = Math.min(a.max.y, b.max.y) - Math.max(a.min.y, b.min.y);
  if (ox <= 0 || oy <= 0) return 0;
  return ox * oy;
}

function packLetterAngle(letter, degClockwise, lx, ly, lighterX, lighterY, lighterZ, safe) {
  /* Design-tool +deg is clockwise = top to the right = negative Three.js Z. */
  letter.rotation.z = THREE.MathUtils.degToRad(-degClockwise);
  letter.scale.setScalar(1);
  growLetterToSafe(letter, lx, ly, lighterX, lighterY, lighterZ, safe);
  return letterFitsSafe(letter, safe) ? letter.scale.x : 0;
}

function bestLetterAngle(letter, degrees, lx, ly, lighterX, lighterY, lighterZ, safe, reject) {
  let bestDeg = degrees[0];
  let bestScale = 0;
  let bestPos = letter.position.clone();
  for (const deg of degrees) {
    const sc = packLetterAngle(letter, deg, lx, ly, lighterX, lighterY, lighterZ, safe);
    if (reject && reject(letter)) continue;
    if (sc > bestScale) {
      bestScale = sc;
      bestDeg = deg;
      bestPos = letter.position.clone();
    }
  }
  packLetterAngle(letter, bestDeg, lx, ly, lighterX, lighterY, lighterZ, safe);
  if (bestScale > 0) {
    letter.scale.setScalar(bestScale);
    letter.position.copy(bestPos);
    letter.rotation.z = THREE.MathUtils.degToRad(-bestDeg);
  }
  return bestDeg;
}

function overlapFrac(letter, lighterBox) {
  letter.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(letter);
  const ox = Math.min(b.max.x, lighterBox.max.x) - Math.max(b.min.x, lighterBox.min.x);
  const oy = Math.min(b.max.y, lighterBox.max.y) - Math.max(b.min.y, lighterBox.min.y);
  if (ox <= 0 || oy <= 0) return 0;
  const ls = b.getSize(new THREE.Vector3());
  return (ox * oy) / (ls.x * ls.y + 1e-6);
}

function nudgeLetter(letter, dirX, dirY, lighterBox, maxFrac, safe) {
  if (lighterBox.isEmpty()) return;
  const step = 0.16;
  for (let i = 0; i < 80; i++) {
    const frac = overlapFrac(letter, lighterBox);
    if (frac > 0.06 && frac <= maxFrac) break;
    const s = frac > maxFrac ? 1 : -1;
    letter.position.x += dirX * step * s;
    letter.position.y += dirY * step * s;
    if (!letterFitsSafe(letter, safe)) {
      letter.position.x -= dirX * step * s;
      letter.position.y -= dirY * step * s;
      if (letter.scale.x > 1.35) letter.scale.multiplyScalar(0.97);
      else break;
    }
  }
  while (!letterFitsSafe(letter, safe) && letter.scale.x > 0.3) {
    letter.scale.multiplyScalar(0.96);
  }
}

function containRoot() {
  stage.scale.setScalar(1);
  stage.position.set(0, 0, 0);
  root.scale.setScalar(1);
  root.position.set(0, 0, 0);
  brand.i.visible = false;
  brand.s.visible = false;
  flameGroup.visible = false;
  flameGroup.scale.setScalar(1);

  /* 1. Fit the lighter + flame to the diagonal. Ignore the letters. */
  stage.updateMatrixWorld(true);
  const viewSpan = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const box = boxFromVisibleMeshes(root, flameGroup);
  expandFlameTip(box);
  expandLighterSweep(box);
  const spanSize = box.getSize(new THREE.Vector3());
  const span = Math.max(spanSize.x, spanSize.y, 1e-6);
  stage.scale.setScalar((viewSpan * 0.88) / span);
  stage.updateMatrixWorld(true);
  const box2 = boxFromVisibleMeshes(root, flameGroup);
  expandFlameTip(box2);
  expandLighterSweep(box2);
  const c = box2.getCenter(new THREE.Vector3());
  stage.position.x -= c.x;
  stage.position.y -= c.y;
  stage.updateMatrixWorld(true);

  const safe = worldSafeRect();
  const h = safe.half;
  const bodyBox = partWorldBox('body');
  const hoodBox = partWorldBox('hood');

  /* 2. I. +30° clockwise — top to the right. Fill the left pocket; period + stem may kiss the red. */
  brand.i.visible = true;
  packLeaningLetter(brand.i, 30, -h * 0.32, h * 0.30, 1, -1, bodyBox, null, 0.13, 1, safe);
  const iChosen = 30;

  /* 3. S. +30° clockwise — top to the right. Fill the lower-right pocket; red body may
     bite the top curve, black hood must not. */
  brand.s.visible = true;
  packLeaningLetter(brand.s, 30, h * 0.30, -h * 0.28, -1, 1, bodyBox, hoodBox, 0.15, 0.008, safe);
  const sChosen = 30;

  brand.i.traverse((o) => { if (o.isMesh) o.material.depthTest = true; });
  brand.s.traverse((o) => { if (o.isMesh) o.material.depthTest = true; });

  keepScreenAtZ(brand.i, 1.8);
  keepScreenAtZ(brand.s, -1.4);
  while (!letterFitsSafe(brand.i, safe) && brand.i.scale.x > 0.3) brand.i.scale.multiplyScalar(0.97);
  while (!letterFitsSafe(brand.s, safe) && brand.s.scale.x > 0.3) brand.s.scale.multiplyScalar(0.97);
  /* Sit S almost on the canvas floor (period is the lowest point). */
  dropLetterToFloor(brand.s, -safe.half + 0.12);

  brand.iScale = brand.i.scale.x;
  brand.sScale = brand.s.scale.x;
  brand.iRotZ = brand.i.rotation.z;
  brand.sRotZ = brand.s.rotation.z;
  console.log('letter angles I', iChosen, 'S', sChosen, 'scale', brand.iScale.toFixed(2), brand.sScale.toFixed(2));

  fx.position.set(0, 0, 0);
  flameGroup.scale.setScalar(1);
  brand.iRest = brand.i.position.clone();
  brand.sRest = brand.s.position.clone();
  stage.userData.baseScale = stage.scale.x;
  stage.userData.basePos = { x: stage.position.x, y: stage.position.y };
}

function applyDot(dot, rest, t, phase) {
  const ph = t * Math.PI * 2 + phase;
  dot.position.set(
    rest.x + Math.sin(ph * 3) * 0.045,
    rest.y + Math.cos(ph * 2) * 0.04,
    rest.z + Math.sin(ph * 2) * 0.03,
  );
  dot.rotation.set(
    Math.sin(ph * 3) * 0.55,
    Math.cos(ph * 2) * 0.72,
    Math.sin(ph * 2 + 0.4) * 0.4,
  );
  const s = 1 + Math.sin(ph * 4) * 0.07;
  dot.scale.setScalar(s);
}

function applyLetter(letter, rest, restZ, scale, t, phase, yaw, pitch) {
  const ph = t * Math.PI * 2 + phase;
  letter.position.set(
    rest.x + Math.sin(ph * 2) * 0.025,
    rest.y + Math.cos(ph * 2) * 0.02,
    rest.z,
  );
  letter.rotation.set(
    Math.sin(ph * 2) * pitch * 0.4,
    Math.cos(ph * 2) * yaw * 0.45,
    restZ + Math.sin(ph * 2) * 0.025,
  );
  letter.scale.setScalar(scale * (1 + Math.sin(ph * 2) * 0.01));
}

function applyFrame(fr) {
  /* Open interval [0, 1) so frame TOTAL steps into frame 1 with no pose jump. */
  const t = (fr - 1) / TOTAL;
  const ph = t * Math.PI * 2;

  /* Strike sequence: slow idle spin → fast wheel → lightning sparks → button → flame. */
  const strikeSpin = (t0, t1) => {
    if (t <= t0) return 0;
    if (t >= t1) return 1;
    const u = (t - t0) / (t1 - t0);
    return u * u * (3 - 2 * u);
  };
  const sparkOn = Math.max(
    trap(t, 0.085, 0.095, 0.118, 0.145),
    trap(t, 0.555, 0.565, 0.588, 0.615),
  );
  const press = Math.max(
    trap(t, 0.13, 0.16, 0.40, 0.47),
    trap(t, 0.61, 0.64, 0.88, 0.95),
  );
  const flameOn = Math.max(
    trap(t, 0.15, 0.18, 0.40, 0.47),
    trap(t, 0.63, 0.66, 0.88, 0.95),
  );

  lighterSpin.rotation.y = -0.22 + Math.sin(ph) * 0.08;
  lighterSpin.rotation.x = Math.sin(ph * 2) * 0.05;
  lighterPivot.rotation.x = 0.36 + Math.sin(ph) * 0.03;
  lighterPivot.rotation.z = -0.72 + Math.sin(ph) * 0.02;

  sparkWheel.rotation.y = t * 4.2
    + strikeSpin(0.06, 0.14) * 11
    + strikeSpin(0.54, 0.62) * 11;
  /* Press down the long body axis — not sideways. */
  lever.rotation.x = 0;
  lever.rotation.z = 0;
  lever.position.y = (lever.userData.restY ?? lever.position.y)
    - (lever.userData.pressGap ?? 0.28) * press;
  lever.position.z = lever.userData.restZ ?? lever.position.z;

  const flick = 0.9 + 0.1 * Math.sin(ph * 8);
  const on = flameOn * flick;
  flameGroup.visible = on > 0.02;
  flameGroup.scale.set(
    1.04 + 0.06 * on + 0.02 * Math.sin(ph * 8),
    1.0 + 0.08 * on * (0.96 + 0.04 * Math.sin(ph * 6)),
    1.04 + 0.06 * on + 0.02 * Math.cos(ph * 8),
  );
  flameGroup.rotation.set(0, 0, 0);
  for (const p of flameParts) {
    p.mesh.visible = on > 0.03;
  }

  for (const sp of sparks) {
    const u = sparkOn * (0.55 + 0.45 * ((Math.sin(ph * 18 + sp.seed * 11) + 1) * 0.5));
    if (u < 0.10) {
      sp.mesh.visible = false;
      continue;
    }
    sp.mesh.visible = true;
    const k = (t * 14 + sp.seed) % 1;
    const flick = 0.70 + 0.30 * Math.sin(ph * 32 + sp.seed * 7);
    if (sp.kind === 'flash') {
      sp.mesh.position.set(0, 0.04, 0);
      sp.mesh.scale.setScalar((0.55 + 1.05 * u * flick));
      sp.mesh.material.opacity = 0.45 + 0.40 * u;
    } else if (sp.kind === 'bolt') {
      /* Out of the jet opening, +Y only — never down, never across the body. */
      sp.mesh.position.set(
        sp.ax * k * 0.22,
        0.02 + k * 0.55,
        0,
      );
      sp.mesh.rotation.set(
        0.06,
        Math.sin(ph * 16 + sp.seed) * 0.08,
        sp.ax * 0.12,
      );
      sp.mesh.scale.set(0.85 + 0.20 * flick, 0.70 + 0.55 * u, 1);
      sp.mesh.material.opacity = 0.72 + 0.28 * u * flick;
    } else {
      sp.mesh.position.set(
        sp.ax * k * 0.35,
        0.08 + sp.ay * k * 0.95,
        0,
      );
      sp.mesh.scale.setScalar((0.70 + 0.85 * (1 - k)) * u * flick);
    }
  }

  flameLight.intensity = 7.5 * on;
  flameLight2.intensity = 5.5 * on;
  flameLight.color.setHex(0xff3a10);
  flameLight2.color.setHex(0xffc040);
  flameLight.position.set(0, 0.85, 0);
  flameAnchor.localToWorld(flameLight.position);
  root.worldToLocal(flameLight.position);
  flameLight2.position.set(0, 1.7, 0);
  flameAnchor.localToWorld(flameLight2.position);
  root.worldToLocal(flameLight2.position);

  function sweepGlance(spot, obj, tOff, xAmp) {
    if (!obj) return;
    const aim = new THREE.Vector3();
    obj.getWorldPosition(aim);
    spot.target.position.copy(aim);
    const u = Math.sin(ph + tOff);
    spot.position.set(aim.x - 6.5 + u * xAmp, aim.y + 2.2 + Math.cos(ph + tOff) * 3.5, aim.z + 16);
    spot.intensity = 22 + 8 * (0.5 + 0.5 * Math.sin(ph * 2 + tOff));
  }
  sweepGlance(iSpot, brand.i, 0.0, 7.5);
  sweepGlance(sSpot, brand.s, 2.094, 7.5);
  sweepGlance(bodySpot, lighterSpin, 4.189, 8.0);
  bodySpot.intensity = 8 + 3 * (0.5 + 0.5 * Math.sin(ph * 2));

  if (iGlance?.material.uniforms) {
    iGlance.material.uniforms.uShift.value = Math.sin(ph) * 0.38;
    iGlance.material.uniforms.uGain.value = 0.92 + 0.08 * (0.5 + 0.5 * Math.sin(ph * 2));
  }
  const sShift = Math.sin(ph + 2.094) * 0.38;
  const sGain = 0.92 + 0.08 * (0.5 + 0.5 * Math.sin(ph * 2 + 2.094));
  sGlanceU.uShift.value = sShift;
  sGlanceU.uGain.value = 0.52 + 0.06 * (0.5 + 0.5 * Math.sin(ph * 2 + 2.094));
  if (sGlance?.material.uniforms) {
    sGlance.material.uniforms.uShift.value = sShift;
    sGlance.material.uniforms.uGain.value = sGain;
  }
  const u = Math.sin(ph + 4.189);
  const gx = u * 0.34;
  if (bodyShine) {
    bodyShine.position.set(gx, -0.04, 0.60);
    if (bodyShine.material.uniforms) bodyShine.material.uniforms.uGain.value = 1.0;
  }
  if (hoodShine) {
    hoodShine.position.x = gx;
    if (hoodShine.material.uniforms) hoodShine.material.uniforms.uGain.value = 1.0;
  }
  if (chromeShine) {
    chromeShine.position.x = (chromeShine.userData.baseX || 0) + gx * 0.22;
    if (chromeShine.material.uniforms) chromeShine.material.uniforms.uGain.value = 1.0;
  }
  if (scene.environmentRotation) {
    scene.environmentRotation.y = ph;
  }

  applyLetter(brand.i, brand.iRest, brand.iRotZ, brand.iScale, t, 0.0, 0.018, 0.012);
  applyLetter(brand.s, brand.sRest, brand.sRotZ, brand.sScale, t, 2.094, 0.018, 0.012);
  applyDot(brand.iDot, brand.iDotRest, t, 0.7);
  applyDot(brand.sDot, brand.sDotRest, t, 2.3);

  const base = stage.userData.basePos || { x: 0, y: 0 };
  stage.position.x = base.x + Math.sin(ph) * 0.02;
  stage.position.y = base.y + Math.cos(ph) * 0.016;
  const bs = stage.userData.baseScale || 1;
  stage.scale.setScalar(bs * (1 + Math.sin(ph * 2) * 0.004));

  camera.lookAt(0, 0, 0);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (fr) => { applyFrame(fr); return fr; };
window.TOTAL = TOTAL;
window.ready = false;

(async () => {
  try {
    buildLighter();
    buildLetters();
    buildFx();
    containRoot();
    applyFrame(1);
    window.ready = true;
    console.log('LIGHTER_READY');
  } catch (e) {
    console.error('LIGHTER_FAIL', e);
  }
})();
</script>
