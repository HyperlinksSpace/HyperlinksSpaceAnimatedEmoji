function trap(t, a, b, c, d) {
  if (t <= a || t >= d) return 0;
  if (t < b) { const u = (t - a) / (b - a); return u * u * (3 - 2 * u); }
  if (t < c) return 1;
  const u = (t - c) / (d - c); return 1 - u * u * (3 - 2 * u);
}

function seeded(n) {
  return () => {
    n = (n * 16807) % 2147483647;
    return (n - 1) / 2147483646;
  };
}

function flamePath(ctx, cx, top, bot, halfW) {
  const hh = bot - top;
  const baseW = Math.max(8, halfW * 0.16);
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.bezierCurveTo(cx + halfW * 0.18, top + hh * 0.16, cx + halfW * 0.92, top + hh * 0.38, cx + halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx + halfW * 1.02, top + hh * 0.76, cx + baseW, bot - 2, cx + baseW, bot);
  ctx.lineTo(cx - baseW, bot);
  ctx.bezierCurveTo(cx - baseW, bot - 2, cx - halfW * 1.02, top + hh * 0.76, cx - halfW, top + hh * 0.58);
  ctx.bezierCurveTo(cx - halfW * 0.92, top + hh * 0.38, cx - halfW * 0.18, top + hh * 0.16, cx, top);
  ctx.closePath();
}

/** Irregular S-curve flame tongue — opaque so it reads on light chat backgrounds. */
function makeWindingFlameTex(seed) {
  const w = 256, h = 640;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const rnd = seeded(seed * 97 + 13);
  const cx = 128;
  const tongue = (ox, sway, wBase, tipY, dark) => {
    const baseY = 628;
    g.beginPath();
    g.moveTo(cx + ox, baseY);
    g.bezierCurveTo(cx + ox - wBase, baseY - 80, cx + ox - wBase * 1.4 + sway * 0.4, baseY - 210, cx + ox + sway * 0.7, baseY - 340);
    g.bezierCurveTo(cx + ox + sway * 1.5, tipY + 150, cx + ox + sway * 1.65, tipY + 70, cx + ox + sway * 0.8, tipY);
    g.bezierCurveTo(cx + ox + sway * 0.1, tipY + 80, cx + ox - sway * 0.5, tipY + 200, cx + ox - sway * 0.15, baseY - 330);
    g.bezierCurveTo(cx + ox + wBase, baseY - 180, cx + ox + wBase * 0.5, baseY - 70, cx + ox, baseY);
    g.closePath();
    const grd = g.createLinearGradient(cx + ox, baseY, cx + ox + sway * 0.6, tipY);
    if (dark) {
      grd.addColorStop(0.00, '#3a0000');
      grd.addColorStop(0.25, '#c01400');
      grd.addColorStop(0.60, '#ff4a00');
      grd.addColorStop(1.00, '#ffb020');
    } else {
      grd.addColorStop(0.00, '#2a0000');
      grd.addColorStop(0.12, '#ff1a00');
      grd.addColorStop(0.40, '#ff6a00');
      grd.addColorStop(0.70, '#ffd040');
      grd.addColorStop(1.00, '#fff8e0');
    }
    g.fillStyle = grd;
    g.fill();
  };
  tongue(-8, 70 + rnd() * 50, 58, 24 + rnd() * 30, true);
  tongue(18, -88 - rnd() * 36, 50, 48 + rnd() * 28, true);
  tongue(-2, 54 + rnd() * 40, 64, 8 + rnd() * 18, false);
  tongue(12, -62 - rnd() * 30, 46, 36 + rnd() * 22, false);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/** Wide jagged bolt with dark outline — survives 30×30. */
function makeLightningTex(seed) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const rnd = seeded(seed * 131 + 7);
  const pts = [];
  let x = w * 0.5;
  pts.push([x, h - 10]);
  const segs = 8 + Math.floor(rnd() * 5);
  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    x = w * 0.5 + (rnd() - 0.52) * 150 * Math.sin(u * Math.PI) + (rnd() - 0.5) * 36;
    pts.push([x, h - 10 - u * (h - 22)]);
  }
  const stroke = (width, color) => {
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'round';
    ctx.miterLimit = 8;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };
  stroke(48, '#1a0600');
  stroke(32, seed % 2 ? '#ff7a00' : '#3a7cff');
  stroke(18, seed % 2 ? '#ffe566' : '#c8e8ff');
  stroke(8, '#ffffff');
  const mid = 3 + Math.floor(rnd() * 3);
  const bx = pts[mid][0], by = pts[mid][1];
  const bpts = [[bx, by]];
  let bx2 = bx, by2 = by;
  const bSeg = 3 + Math.floor(rnd() * 2);
  const dir = rnd() > 0.5 ? 1 : -1;
  for (let i = 1; i <= bSeg; i++) {
    bx2 += dir * (28 + rnd() * 40);
    by2 -= 28 + rnd() * 36;
    bpts.push([bx2, by2]);
  }
  const strokeB = (width, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(bpts[0][0], bpts[0][1]);
    for (let i = 1; i < bpts.length; i++) ctx.lineTo(bpts[i][0], bpts[i][1]);
    ctx.stroke();
  };
  strokeB(28, '#1a0600');
  strokeB(18, seed % 2 ? '#ff9900' : '#4488ff');
  strokeB(9, '#ffffff');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function deformFlamePlane(geo, bend, twist, phase, taper = 0.55) {
  const pos = geo.attributes.position;
  if (!geo.userData.base) {
    const base = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      base[i * 3] = pos.getX(i);
      base[i * 3 + 1] = pos.getY(i);
      base[i * 3 + 2] = pos.getZ(i);
    }
    geo.userData.base = base;
  }
  const base = geo.userData.base;
  for (let i = 0; i < pos.count; i++) {
    const x0 = base[i * 3];
    const y0 = base[i * 3 + 1];
    const u = y0 + 0.5;
    const s1 = Math.sin(u * Math.PI * 2.35 + phase) * bend * (0.25 + 0.9 * u);
    const s2 = Math.sin(u * Math.PI * 3.8 + phase * 1.6) * bend * 0.28 * u;
    const z1 = Math.sin(u * Math.PI * 1.7 + twist) * bend * 0.55 * u;
    const tw = 1 - u * taper;
    const yaw = twist * u * 0.85;
    const xr = x0 * Math.cos(yaw) - z1 * Math.sin(yaw);
    const zr = x0 * Math.sin(yaw) + z1 * Math.cos(yaw);
    pos.setXYZ(i, xr * tw + s1 + s2, y0, zr);
  }
  pos.needsUpdate = true;
}

function sampleBezier(p0, p1, p2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ]);
  }
  return pts;
}

/** Extra-bold antiqua capital I — thick stem, bracketed slab serifs. */
function timesIShape() {
  const s = new THREE.Shape();
  const stem = 0.40;
  const serifW = 0.90;
  const serifH = 0.26;
  const h = 1.52;
  const br = 0.16;
  s.moveTo(-serifW, -h);
  s.lineTo(serifW, -h);
  s.lineTo(serifW, -h + serifH * 0.55);
  s.quadraticCurveTo(serifW * 0.22, -h + serifH, stem, -h + serifH + br);
  s.lineTo(stem, h - serifH - br);
  s.quadraticCurveTo(serifW * 0.22, h - serifH, serifW, h - serifH * 0.55);
  s.lineTo(serifW, h);
  s.lineTo(-serifW, h);
  s.lineTo(-serifW, h - serifH * 0.55);
  s.quadraticCurveTo(-serifW * 0.22, h - serifH, -stem, h - serifH - br);
  s.lineTo(-stem, -h + serifH + br);
  s.quadraticCurveTo(-serifW * 0.22, -h + serifH, -serifW, -h + serifH * 0.55);
  s.closePath();
  return s;
}

/** Times-like roman S — oval bowls, modest terminals (not comic bubble). */
function timesSShape() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return strokeShape(top.concat(bot.slice(1)), 0.34);
}

function circleShape(r) {
  const s = new THREE.Shape();
  s.absarc(0, 0, r, 0, Math.PI * 2, false);
  return s;
}

function strokeShape(pts, radius) {
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const i0 = Math.max(0, i - 1);
    const i1 = Math.min(pts.length - 1, i + 1);
    let dx = pts[i1][0] - pts[i0][0];
    let dy = pts[i1][1] - pts[i0][1];
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    left.push([pts[i][0] - dy * radius, pts[i][1] + dx * radius]);
    right.push([pts[i][0] + dy * radius, pts[i][1] - dx * radius]);
  }
  const shape = new THREE.Shape();
  shape.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) shape.lineTo(left[i][0], left[i][1]);
  const end = pts[pts.length - 1];
  shape.absarc(
    end[0], end[1], radius,
    Math.atan2(left[left.length - 1][1] - end[1], left[left.length - 1][0] - end[0]),
    Math.atan2(right[right.length - 1][1] - end[1], right[right.length - 1][0] - end[0]),
    false,
  );
  for (let i = right.length - 1; i >= 0; i--) shape.lineTo(right[i][0], right[i][1]);
  const start = pts[0];
  shape.absarc(
    start[0], start[1], radius,
    Math.atan2(right[0][1] - start[1], right[0][0] - start[0]),
    Math.atan2(left[0][1] - start[1], left[0][0] - start[0]),
    false,
  );
  shape.closePath();
  return shape;
}

function sCenterlinePts() {
  const top = sampleBezier([0.42, 1.18], [-0.72, 1.28], [-0.74, 0.10], [0.04, 0.04], 28);
  const bot = sampleBezier([0.04, 0.04], [0.80, -0.02], [0.76, -1.28], [-0.42, -1.18], 28);
  return top.concat(bot.slice(1));
}

function distToPolyline(x, y, pts) {
  let best = 1e9;
  for (let i = 0; i < pts.length; i++) {
    const dx = x - pts[i][0];
    const dy = y - pts[i][1];
    const d = dx * dx + dy * dy;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

/** Concave stroke valleys — bent metal that splits the glance into two ridges. */
function channelChromeGeo(geo, kind, centerline) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const amp = kind === 'dot' ? 0.022 : 0.016;
  for (let i = 0; i < pos.count; i++) {
    const nz = nrm.getZ(i);
    if (Math.abs(nz) < 0.5) continue;
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    let k = 0;
    if (kind === 'I') {
      const inStem = Math.abs(x) < 0.50 && Math.abs(y) < 1.14;
      const inSerif = Math.abs(y) > 1.04;
      if (inStem) {
        const u = Math.min(1, Math.abs(x) / 0.40);
        k = 1 - u * u;
      } else if (inSerif) {
        const yc = y > 0 ? 1.25 : -1.25;
        const u = Math.min(1, Math.abs(y - yc) / 0.24);
        k = (1 - u * u) * 0.72;
      }
    } else if (kind === 'S' && centerline) {
      const d = distToPolyline(x, y, centerline);
      const u = Math.min(1, d / 0.30);
      k = 1 - u * u;
    } else if (kind === 'dot') {
      const u = Math.min(1, Math.hypot(x, y) / 0.20);
      k = 1 - u * u;
    }
    pos.setZ(i, z - Math.sign(nz || 1) * amp * k);
  }
  geo.computeVertexNormals();
}

function extrudeOpts(depth) {
  return {
    depth,
    bevelEnabled: true,
    bevelThickness: 0.12,
    bevelSize: 0.095,
    bevelSegments: 12,
    curveSegments: 96,
    steps: 1,
  };
}

function dentedChromeSphere(radius, seed) {
  const geo = new THREE.SphereGeometry(radius, 48, 36);
  const pos = geo.attributes.position;
  const rnd = seeded(seed);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const n = Math.hypot(x, y, z) || 1;
    const dent = 0.055 * Math.sin(x * 8.2 + y * 6.4)
      + 0.04 * Math.sin(y * 9.5 + z * 7.1)
      + 0.028 * Math.sin(z * 11.0 + x * 5.5)
      + (rnd() - 0.5) * 0.025;
    const s = (1 + dent) * radius / n;
    pos.setXYZ(i, x * s, y * s, z * s);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, liquidChromeMat(false));
}

function makeLetter3D(ch) {
  const g = new THREE.Group();
  const isI = ch === 'I';
  const chrome = liquidChromeMat(false);
  const bodyShapes = [isI ? timesIShape() : timesSShape()];
  const sLine = isI ? null : sCenterlinePts();

  const depth = 0.92;
  const geo = new THREE.ExtrudeGeometry(bodyShapes, extrudeOpts(depth));
  geo.translate(0, 0, -depth * 0.5);
  channelChromeGeo(geo, isI ? 'I' : 'S', sLine);
  const body = new THREE.Mesh(geo, chrome);
  g.add(body);

  body.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(body);
  const c = bb.getCenter(new THREE.Vector3());
  body.position.x -= c.x;
  body.position.y -= c.y;

  const sphereR = isI ? 0.22 : 0.21;
  const indent = isI ? 0.22 : 0.26;
  const dot = dentedChromeSphere(sphereR, isI ? 4103 : 7721);
  /* Same baseline as the letter, gap to the right. */
  dot.position.set(bb.max.x - c.x + indent + sphereR, bb.min.y - c.y + sphereR, 0);
  g.add(dot);
  g.userData.dot = dot;
  return g;
}

function buildRedFork() {
  const g = new THREE.Group();
  const red = plasticRed();
  /* BIC thumb pad — sits on the TOP, behind the flame */
  const pad = new THREE.Mesh(
    new RoundedBoxGeometry(1.05, 0.18, 0.58, 5, 0.08),
    red,
  );
  pad.position.set(0, 0.04, 0);
  g.add(pad);
  const stem = new THREE.Mesh(
    new RoundedBoxGeometry(0.42, 0.28, 0.36, 4, 0.06),
    red,
  );
  stem.position.set(0, -0.14, 0.04);
  g.add(stem);
  return g;
}

function knurlWheel(radius = 0.32, width = 0.38) {
  const grp = new THREE.Group();
  const darkSteel = new THREE.MeshPhysicalMaterial({
    color: 0x1a1c20,
    roughness: 0.42,
    metalness: 0.85,
    envMapIntensity: 0.9,
    toneMapped: false,
  });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 48), darkSteel);
  cyl.rotation.z = Math.PI / 2;
  grp.add(cyl);
  const ridgeMat = new THREE.MeshPhysicalMaterial({
    color: 0x2a2e34,
    roughness: 0.5,
    metalness: 0.9,
    toneMapped: false,
  });
  const n = 24;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = new THREE.Mesh(new THREE.BoxGeometry(width * 0.92, 0.04, 0.045), ridgeMat);
    r.position.set(0, Math.sin(a) * (radius - 0.012), Math.cos(a) * (radius - 0.012));
    r.rotation.x = a;
    grp.add(r);
  }
  return grp;
}

function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const hw = w * 0.5;
  const hd = d * 0.5;
  r = Math.min(r, hw - 0.02, hd - 0.02);
  s.moveTo(-hw + r, -hd);
  s.lineTo(hw - r, -hd);
  s.absarc(hw - r, -hd + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hw, hd - r);
  s.absarc(hw - r, hd - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hw + r, hd);
  s.absarc(-hw + r, hd - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hd + r);
  s.absarc(-hw + r, -hd + r, r, Math.PI, Math.PI * 1.5, false);
  s.closePath();
  return s;
}

/** Classic BIC shell: rounded-rect cross-section, not a square box or a tube. */
function bicShell(width, height, depth, mat, radius) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(width, depth, radius), {
    depth: height,
    bevelEnabled: true,
    bevelThickness: 0.09,
    bevelSize: 0.08,
    bevelSegments: 5,
    curveSegments: 48,
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);
  return new THREE.Mesh(geo, mat);
}

function buildLighter() {
  lighterPivot = new THREE.Group();
  lighterSpin = new THREE.Group();
  lighterPivot.add(lighterSpin);
  root.add(lighterPivot);

  /* Classic BIC body: rounded-rect red shell */
  const bodyW = 2.38;
  const bodyH = 7.55;
  const bodyD = 1.14;
  const bodyR = 0.54;
  const body = bicShell(bodyW, bodyH, bodyD, plasticRed(), bodyR);
  lighterSpin.add(body);

  /* Hard vertical glance along the lacquer body (photo streak). */
  const shineC = document.createElement('canvas');
  shineC.width = 64;
  shineC.height = 512;
  const sg = shineC.getContext('2d');
  const sgx = sg.createLinearGradient(0, 0, 64, 0);
  sgx.addColorStop(0.00, 'rgba(255,255,255,0)');
  sgx.addColorStop(0.42, 'rgba(255,255,255,0.15)');
  sgx.addColorStop(0.50, 'rgba(255,255,255,1)');
  sgx.addColorStop(0.58, 'rgba(255,255,255,0.15)');
  sgx.addColorStop(1.00, 'rgba(255,255,255,0)');
  sg.fillStyle = sgx;
  sg.fillRect(0, 0, 64, 512);
  const sgy = sg.createLinearGradient(0, 0, 0, 512);
  sgy.addColorStop(0.00, 'rgba(0,0,0,0.55)');
  sgy.addColorStop(0.12, 'rgba(0,0,0,0)');
  sgy.addColorStop(0.88, 'rgba(0,0,0,0)');
  sgy.addColorStop(1.00, 'rgba(0,0,0,0.55)');
  sg.fillStyle = sgy;
  sg.fillRect(0, 0, 64, 512);
  const shineTex = new THREE.CanvasTexture(shineC);
  shineTex.colorSpace = THREE.SRGBColorSpace;
  bodyShine = new THREE.Mesh(
    new THREE.PlaneGeometry(0.72, bodyH * 0.96),
    new THREE.MeshBasicMaterial({
      map: shineTex,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false,
    }),
  );
  bodyShine.position.set(-0.42, 0.06, 0.42);
  bodyShine.rotation.y = 0.4;
  bodyShine.renderOrder = 3;
  lighterSpin.add(bodyShine);

  /* Black plastic collar under the chrome (photo) */
  const headH = 1.05;
  const head = bicShell(bodyW * 1.01, headH, bodyD * 1.02, plasticBlack(), bodyR + 0.02);
  head.position.y = bodyH * 0.5 + headH * 0.48;
  lighterSpin.add(head);

  const topY = bodyH * 0.5 + headH + 0.38;
  /* Flame on the left of the top; wheel + button on the right of the top. */
  const flameX = -0.55;
  const flameZ = 0.10;

  const deck = new THREE.Mesh(
    new RoundedBoxGeometry(bodyW * 0.94, 0.18, bodyD * 1.04, 4, 0.06),
    plasticBlack(),
  );
  deck.position.set(0, bodyH * 0.5 + headH + 0.06, 0);
  lighterSpin.add(deck);

  const hood = buildChromeWindguard();
  hood.scale.set(0.78, 0.88, 0.78);
  hood.position.set(flameX, topY, flameZ);
  lighterSpin.add(hood);

  const chimney = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.13, 0.28, 28),
    steelMat(),
  );
  chimney.position.set(flameX, topY - 0.18, flameZ);
  lighterSpin.add(chimney);

  const nozzleTip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.1, 0.08, 24),
    new THREE.MeshPhysicalMaterial({
      color: 0x2a2e34,
      metalness: 0.7,
      roughness: 0.35,
      toneMapped: false,
    }),
  );
  nozzleTip.position.set(flameX, topY, flameZ);
  lighterSpin.add(nozzleTip);

  const hole = new THREE.Mesh(
    new THREE.CircleGeometry(0.075, 24),
    new THREE.MeshBasicMaterial({ color: 0x050505, toneMapped: false }),
  );
  hole.rotation.x = -Math.PI * 0.5;
  hole.position.set(flameX, topY + 0.06, flameZ);
  lighterSpin.add(hole);

  const wheel = knurlWheel(0.28, 0.58);
  wheel.position.set(0.18, topY + 0.14, 0.06);
  lighterSpin.add(wheel);
  sparkWheel = wheel;

  lever = buildRedFork();
  lever.scale.setScalar(0.78);
  lever.position.set(0.62, topY - 0.02, 0.04);
  lighterSpin.add(lever);
  lever.userData.restY = lever.position.y;
  lever.userData.restZ = lever.position.z;

  const flint = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 0.20, 16),
    steelMat(),
  );
  flint.rotation.z = Math.PI / 2;
  flint.position.set(0.32, topY + 0.02, 0.0);
  lighterSpin.add(flint);

  flameAnchor = new THREE.Group();
  flameAnchor.position.set(flameX, topY + 0.48, flameZ);
  lighterSpin.add(flameAnchor);

  flameGroup = new THREE.Group();
  flameAnchor.add(flameGroup);

  /* Teardrop rooted at the nozzle; origin is the flame base */
  const flameH = 4.15;
  const flameGeo = new THREE.PlaneGeometry(2.45, flameH);
  flameGeo.translate(0, flameH * 0.5, 0);
  const sprite = new THREE.Mesh(
    flameGeo,
    new THREE.MeshBasicMaterial({
      map: makeFlameSpriteTex(),
      transparent: true,
      alphaTest: 0.12,
      depthWrite: false,
      toneMapped: false,
      side: THREE.DoubleSide,
    }),
  );
  sprite.position.set(0, -0.06, 0);
  sprite.renderOrder = 2;

  flameGroup.add(sprite);
  flameParts.push({ mesh: sprite, kind: 'sprite' });

  const sparkMat = new THREE.MeshBasicMaterial({
    color: 0xffe8aa,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false,
  });
  for (let i = 0; i < 3; i++) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), sparkMat.clone());
    flameAnchor.add(mesh);
    sparks.push({
      mesh,
      seed: i * 0.73 + 0.2,
      ax: (i % 2 ? 1 : -1) * (0.06 + i * 0.03),
      ay: 0.12 + i * 0.08,
    });
  }

  lighterPivot.rotation.z = -0.46;
  lighterPivot.rotation.x = 0.28;
  lighterPivot.position.set(0.22, -0.04, 0);
}

function buildLetters() {
  brand.i = makeLetter3D('I');
  brand.i.scale.setScalar(2.42);
  brand.i.rotation.z = -0.06;
  scene.add(brand.i);

  brand.s = makeLetter3D('S');
  brand.s.scale.setScalar(2.22);
  brand.s.rotation.z = 0.08;
  scene.add(brand.s);

  brand.iScale = brand.i.scale.x;
  brand.sScale = brand.s.scale.x;
  brand.iRotZ = brand.i.rotation.z;
  brand.sRotZ = brand.s.rotation.z;
  brand.iDot = brand.i.userData.dot;
  brand.sDot = brand.s.userData.dot;
  brand.iDotRest = brand.iDot.position.clone();
  brand.sDotRest = brand.sDot.position.clone();
}

function containRoot() {
  root.scale.setScalar(1);
  root.position.set(0, 0, 0);
  flameGroup.visible = false;
  flameGroup.scale.setScalar(1);
  root.updateMatrixWorld(true);

  const viewSpan = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, 1e-6);
  root.scale.setScalar((viewSpan * 0.70) / span);
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.x -= c.x;
  root.position.y -= c.y;
  root.updateMatrixWorld(true);

  const fitted = new THREE.Box3().setFromObject(root);
  const fc = fitted.getCenter(new THREE.Vector3());
  const k = 2.22;
  /* Tight sandwich inside the avatar circle: I. over the barrel, S. under the red body. */
  brand.i.position.set(fc.x - k * 0.46, fc.y + k * 0.04, 6.5);
  brand.s.position.set(fc.x + k * 0.34, fc.y - k * 0.56, -1.2);
  brand.i.renderOrder = 8;
  brand.s.renderOrder = 1;
  brand.i.traverse((o) => { if (o.isMesh) { o.renderOrder = 8; o.material.depthTest = true; } });
  brand.s.traverse((o) => { if (o.isMesh) o.renderOrder = 1; });
  fx.position.set(fc.x, fc.y, 0);

  flameGroup.scale.setScalar(1);
  brand.iRest = brand.i.position.clone();
  brand.sRest = brand.s.position.clone();
  root.userData.baseScale = root.scale.x;
  root.userData.basePos = { x: root.position.x, y: root.position.y };
}

function applyDot(dot, rest, t, phase) {
  const ph = t * Math.PI * 2 + phase;
  dot.position.set(
    rest.x + Math.sin(ph * 3.15) * 0.045,
    rest.y + Math.cos(ph * 2.55) * 0.04,
    rest.z + Math.sin(ph * 2.1) * 0.03,
  );
  dot.rotation.set(
    Math.sin(ph * 3.5) * 0.55,
    Math.cos(ph * 2.35) * 0.72,
    Math.sin(ph * 1.85 + 0.4) * 0.4,
  );
  const s = 1 + Math.sin(ph * 4.4) * 0.07;
  dot.scale.setScalar(s);
}

function applyLetter(letter, rest, restZ, scale, t, phase, yaw, pitch) {
  const ph = t * Math.PI * 2 + phase;
  letter.position.set(
    rest.x + Math.sin(ph * 2.1) * 0.025,
    rest.y + Math.cos(ph * 1.8) * 0.02,
    rest.z,
  );
  letter.rotation.set(
    Math.sin(ph * 2.6) * pitch * 0.4,
    Math.cos(ph * 1.7) * yaw * 0.45,
    restZ + Math.sin(ph * 2.5 + 0.6) * 0.025,
  );
  letter.scale.setScalar(scale * (1 + Math.sin(ph * 3.6) * 0.01));
}

function applyFrame(fr) {
  const t = (fr - 1) / Math.max(1, TOTAL - 1);
  const ph = t * Math.PI * 2;

  const flameOn = Math.max(
    trap(t, 0.10, 0.16, 0.36, 0.46),
    trap(t, 0.54, 0.60, 0.82, 0.93),
  );
  const ignite = Math.max(
    trap(t, 0.08, 0.12, 0.16, 0.22),
    trap(t, 0.52, 0.56, 0.60, 0.66),
  );

  lighterSpin.rotation.y = 0.12 + Math.sin(ph) * 0.10;
  lighterSpin.rotation.x = Math.sin(ph * 1.15) * 0.06;
  lighterPivot.rotation.x = 0.28 + Math.sin(ph * 0.85) * 0.04;
  lighterPivot.rotation.z = -0.46 + Math.sin(ph * 0.5) * 0.022;

  sparkWheel.rotation.x = ignite * 16 + t * 1.4;
  const press = flameOn;
  lever.rotation.x = 0.32 * press;
  lever.position.y = (lever.userData.restY ?? lever.position.y) - 0.11 * press;

  const flick = 0.9 + 0.1 * Math.sin(t * 62);
  const on = flameOn * flick;
  flameGroup.visible = on > 0.02;
  flameGroup.scale.set(
    1.04 + 0.06 * on + 0.02 * Math.sin(t * 37),
    1.0 + 0.08 * on * (0.96 + 0.04 * Math.sin(t * 29)),
    1.04 + 0.06 * on + 0.02 * Math.cos(t * 33),
  );
  flameGroup.rotation.set(0, 0, 0);
  for (const p of flameParts) {
    p.mesh.visible = on > 0.03;
  }

  for (const sp of sparks) {
    const u = ignite * (0.55 + 0.45 * ((Math.sin(t * 40 + sp.seed * 9) + 1) * 0.5));
    if (u < 0.08) {
      sp.mesh.visible = false;
      continue;
    }
    sp.mesh.visible = true;
    const k = (t * 6 + sp.seed) % 1;
    sp.mesh.position.set(
      sp.ax * (0.12 + k * 0.22),
      0.06 + sp.ay * k * 0.55,
      (sp.seed - 0.5) * 0.35,
    );
    sp.mesh.scale.setScalar((0.5 + 0.7 * (1 - k)) * u);
  }

  flameLight.intensity = 7.5 * on;
  flameLight2.intensity = 5.5 * on;
  flameLight.color.setHex(0xff3a10);
  flameLight2.color.setHex(0xffc040);
  flameLight.position.set(0, 0.85, 0);
  flameAnchor.localToWorld(flameLight.position);
  root.worldToLocal(flameLight.position);
  flameLight2.position.set(0, 1.7, 0);
  flameAnchor.localToWorld(flameLight2.position);
  root.worldToLocal(flameLight2.position);

  shineSweep.position.set(-8 + Math.sin(ph) * 9.5, 3 + Math.cos(ph) * 7.5, 15);
  shineSweep.intensity = 4.2 + 1.4 * (0.5 + 0.5 * Math.sin(ph * 2.0));
  key2.intensity = 1.85 + 0.25 * (0.5 + 0.5 * Math.sin(ph * 1.6));
  key.intensity = 3.6 + 0.2 * Math.sin(ph * 1.4);
  if (lighterSpin) {
    const aim = new THREE.Vector3();
    lighterSpin.getWorldPosition(aim);
    bodySpot.target.position.copy(aim);
    const travel = Math.sin(ph);
    bodySpot.position.set(
      aim.x - 8.5 + travel * 5.5,
      aim.y + 1.5 + travel * 7.0,
      aim.z + 14,
    );
    bodySpot.intensity = 26 + 8 * (0.5 + 0.5 * Math.sin(ph * 2.2));
    bodySpot.angle = 0.14 + 0.04 * (0.5 + 0.5 * Math.sin(ph));
  }
  if (bodyShine) {
    const u = Math.sin(ph);
    /* Sweep across the camera-facing face of the red barrel. */
    bodyShine.position.set(u * 0.55, 0.04, 0.58);
    bodyShine.rotation.y = u * 0.18;
    bodyShine.material.opacity = 0.85 + 0.15 * (0.5 + 0.5 * Math.sin(ph * 2));
  }
  if (scene.environmentRotation) {
    scene.environmentRotation.y = ph * 0.16;
  }

  applyLetter(brand.i, brand.iRest, brand.iRotZ, brand.iScale, t, 0.0, 0.028, 0.018);
  applyLetter(brand.s, brand.sRest, brand.sRotZ, brand.sScale, t, 1.1, 0.05, 0.03);
  applyDot(brand.iDot, brand.iDotRest, t, 0.7);
  applyDot(brand.sDot, brand.sDotRest, t, 2.3);

  const base = root.userData.basePos || { x: 0, y: 0 };
  root.position.x = base.x + Math.sin(ph * 1.1) * 0.03;
  root.position.y = base.y + Math.cos(ph * 0.9) * 0.022;
  root.scale.setScalar(root.userData.baseScale * (1 + Math.sin(ph * 2) * 0.006));

  camera.lookAt(0, 0, 0);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (fr) => { applyFrame(fr); return fr; };
window.TOTAL = TOTAL;
window.ready = false;

(async () => {
  try {
    buildLighter();
    buildLetters();
    buildFx();
    containRoot();
    applyFrame(1);
    window.ready = true;
    console.log('LIGHTER_READY');
  } catch (e) {
    console.error('LIGHTER_FAIL', e);
  }
})();
</script>
