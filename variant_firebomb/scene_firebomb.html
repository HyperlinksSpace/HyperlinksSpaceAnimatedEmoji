<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hyperlinks.SPACE — Exact-art 3D reconstruction</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; width: 512px; height: 512px; background: transparent; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
/**
 * 3D reconstruction that keeps the REFERENCE artwork on every face.
 * Each element is a thick slab (exact layer pixels on front + black depth).
 * No procedural stand-in geometry that drifts from the art.
 * Explosion: fly outward + scale down to stay in canvas; N/text break into chunks.
 */
import * as THREE from 'three';

const W = 512, H = 512, TOTAL = 90;
const WORLD = 20;
const REST_SCALE = 0.92; /* match reference canvas fill */
const DEPTH = 1.0;
const CHUNK_DEPTH = 2.4; /* thick blocks so tumble reads as 3D */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  preserveDrawingBuffer: true,
  powerPreference: 'high-performance',
});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.autoClear = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 200);
camera.position.set(0, 0, 42);

const root = new THREE.Group();
scene.add(root);
const fx = new THREE.Group();
root.add(fx);

/* Soft studio light so black depth catches shine when pieces rotate */
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-6, 10, 16);
scene.add(key);
const fill = new THREE.DirectionalLight(0xa8c8ff, 0.9);
fill.position.set(8, -2, 10);
scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const rim = new THREE.DirectionalLight(0xffffff, 1.1);
rim.position.set(2, 4, -12);
scene.add(rim);

/* Fire-bomb lights — bloom the shatter from within */
const fireLight = new THREE.PointLight(0xff6a12, 0, 28, 1.6);
fireLight.position.set(0, 0, 2);
root.add(fireLight);
const fireLight2 = new THREE.PointLight(0xffee66, 0, 18, 2);
fireLight2.position.set(1, 1.5, 3);
root.add(fireLight2);
const boltLight = new THREE.PointLight(0xaad8ff, 0, 22, 1.8);
boltLight.position.set(0, 0, 4);
root.add(boltLight);

function trap(t, a, b, c, d) {
  if (t <= a || t >= d) return 0;
  if (t < b) { const u = (t - a) / (b - a); return u * u * (3 - 2 * u); }
  if (t < c) return 1;
  const u = (t - c) / (d - c); return 1 - u * u * (3 - 2 * u);
}

const loader = new THREE.TextureLoader();
const pieces = [];
const brand = { nWholes: [], tWholes: [] };
const flames = [];
const gapFlames = [];
const ribbons = [];
const bolts = [];
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();
const _tmpC = new THREE.Vector3();

function makeFlameTexture() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 384;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 384);
  const drawCurve = (ox, sway, w, a) => {
    g.beginPath();
    g.moveTo(128 + ox, 370);
    g.bezierCurveTo(128 + ox - w, 300, 128 + ox - w * 1.4 + sway, 220, 128 + ox + sway * 0.4, 140);
    g.bezierCurveTo(128 + ox + w * 0.5 + sway, 70, 128 + ox + sway * 1.1, 30, 128 + ox + sway * 0.6, 8);
    g.bezierCurveTo(128 + ox + sway * 0.2, 40, 128 + ox + w * 0.35 - sway * 0.3, 100, 128 + ox - sway * 0.2, 180);
    g.bezierCurveTo(128 + ox + w * 0.9, 250, 128 + ox + w * 0.7, 320, 128 + ox, 370);
    g.closePath();
    const grd = g.createLinearGradient(128 + ox, 370, 128 + ox + sway, 8);
    grd.addColorStop(0.0, `rgba(180,0,0,0)`);
    grd.addColorStop(0.12, `rgba(255,20,0,${a * 0.85})`);
    grd.addColorStop(0.35, `rgba(255,70,0,${a})`);
    grd.addColorStop(0.55, `rgba(255,160,20,${a})`);
    grd.addColorStop(0.78, `rgba(255,235,90,${a * 0.95})`);
    grd.addColorStop(0.92, `rgba(255,255,220,${a * 0.7})`);
    grd.addColorStop(1.0, `rgba(255,255,255,0)`);
    g.fillStyle = grd;
    g.fill();
  };
  drawCurve(0, 36, 70, 1);
  drawCurve(-28, -22, 42, 0.75);
  drawCurve(30, 48, 38, 0.7);
  g.globalCompositeOperation = 'lighter';
  const core = g.createLinearGradient(128, 340, 128, 40);
  core.addColorStop(0, 'rgba(255,80,0,0)');
  core.addColorStop(0.3, 'rgba(255,180,40,0.55)');
  core.addColorStop(0.7, 'rgba(255,255,180,0.85)');
  core.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = core;
  g.beginPath();
  g.ellipse(128, 180, 18, 140, 0.12, 0, Math.PI * 2);
  g.fill();
  g.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function makeSparkTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0.5, 32, 32, 28);
  grd.addColorStop(0, 'rgba(255,255,230,1)');
  grd.addColorStop(0.25, 'rgba(255,200,40,0.9)');
  grd.addColorStop(0.55, 'rgba(255,60,0,0.4)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeRibbonTexture() {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 256, 0, 0);
  grd.addColorStop(0, 'rgba(120,0,0,0)');
  grd.addColorStop(0.15, 'rgba(255,30,0,0.9)');
  grd.addColorStop(0.45, 'rgba(255,110,0,1)');
  grd.addColorStop(0.7, 'rgba(255,210,40,1)');
  grd.addColorStop(0.9, 'rgba(255,255,200,0.85)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(8, 0, 48, 256);
  const side = g.createLinearGradient(0, 0, 64, 0);
  side.addColorStop(0, 'rgba(0,0,0,1)');
  side.addColorStop(0.35, 'rgba(0,0,0,0)');
  side.addColorStop(0.65, 'rgba(0,0,0,0)');
  side.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = side;
  g.fillRect(0, 0, 64, 256);
  g.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function seeded(seed) {
  let s = (seed | 0) % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function buildFireBomb() {
  const flameTex = makeFlameTexture();
  const sparkTex = makeSparkTexture();
  const ribbonTex = makeRibbonTexture();

  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2 + 0.25;
    const pts = [
      new THREE.Vector3(0, 0, 0.2),
      new THREE.Vector3(Math.cos(ang) * 1.2, Math.sin(ang) * 1.2, 0.6),
      new THREE.Vector3(Math.cos(ang + 0.4) * 2.8, Math.sin(ang + 0.4) * 2.8, 1.0),
      new THREE.Vector3(Math.cos(ang + 0.75) * 4.2, Math.sin(ang + 0.75) * 4.2, 0.4),
    ];
    const curve = new THREE.CatmullRomCurve3(pts);
    const mat = new THREE.MeshBasicMaterial({
      map: ribbonTex,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      color: i % 3 === 0 ? 0xff2200 : (i % 3 === 1 ? 0xff8800 : 0xffcc33),
    });
    const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.22, 8, false), mat);
    mesh.visible = false;
    fx.add(mesh);
    ribbons.push({
      mesh,
      mat,
      ang,
      delay: 0.008 * (i % 7),
      twist: (i % 2 ? 1 : -1) * (0.55 + (i % 4) * 0.12),
      len: 3.6 + (i % 5) * 0.45,
      thick: 0.16 + (i % 4) * 0.05,
      seed: i * 41 + 7,
    });
  }

  for (let i = 0; i < 36; i++) {
    const isSpark = i % 7 === 0;
    const mat = new THREE.SpriteMaterial({
      map: isSpark ? sparkTex : flameTex,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: isSpark ? 0xffee88 : (i % 3 === 0 ? 0xff1a00 : (i % 3 === 1 ? 0xff6600 : 0xffdd33)),
    });
    const spr = new THREE.Sprite(mat);
    const ang = (i / 36) * Math.PI * 2 + (i % 5) * 0.15;
    spr.scale.set(0.01, 0.01, 0.01);
    fx.add(spr);
    flames.push({
      spr,
      mat,
      ang,
      r0: 1.35 + (i % 9) * 0.52,
      rise: 1.4 + (i % 6) * 0.5,
      spin: (i % 2 ? 1 : -1) * (1.2 + (i % 5) * 0.4),
      curve: 0.55 + (i % 4) * 0.2,
      delay: 0.007 * (i % 11),
      size: isSpark ? 1.1 + (i % 3) * 0.25 : 3.6 + (i % 5) * 0.65,
      isSpark,
      zBias: (i % 5) * 0.18,
    });
  }

  for (let i = 0; i < 12; i++) {
    const mat = new THREE.SpriteMaterial({
      map: flameTex,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: i % 2 ? 0xff3300 : 0xffcc22,
    });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(0.01, 0.01, 1);
    fx.add(spr);
    gapFlames.push({
      spr,
      mat,
      pair: i,
      delay: 0.01 * (i % 6),
      size: 2.8 + (i % 4) * 0.45,
    });
  }
}

function jaggedBolt(a, b, segs, rnd) {
  const pts = [];
  const dist = a.distanceTo(b);
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const p = new THREE.Vector3().lerpVectors(a, b, u);
    if (i > 0 && i < segs) {
      const side = new THREE.Vector3().subVectors(b, a).normalize();
      const up = Math.abs(side.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      const n = new THREE.Vector3().crossVectors(side, up).normalize();
      const n2 = new THREE.Vector3().crossVectors(side, n).normalize();
      const zig = ((i % 2) * 2 - 1) * dist * (0.08 + rnd() * 0.14);
      p.addScaledVector(n, zig);
      p.addScaledVector(n2, (rnd() - 0.5) * dist * 0.1);
      p.z += (rnd() - 0.5) * dist * 0.06;
    }
    pts.push(p);
  }
  return pts;
}

function buildLightnings() {
  for (let i = 0; i < 14; i++) {
    const isYellow = i % 2 === 0;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(1, 1, 0),
      new THREE.Vector3(2, 0, 0),
    ]);
    const glowMat = new THREE.MeshBasicMaterial({
      color: isYellow ? 0xffb000 : 0x1e90ff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    /* Non-additive core keeps pure yellow/blue (doesn't bleach to white) */
    const coreMat = new THREE.MeshBasicMaterial({
      color: isYellow ? 0xffe566 : 0x9ed2ff,
      transparent: true,
      opacity: 0,
      depthWrite: false,
    });
    const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.04, 4, false), glowMat);
    const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.012, 3, false), coreMat);
    glow.visible = false;
    core.visible = false;
    fx.add(glow);
    fx.add(core);
    bolts.push({
      glow,
      core,
      glowMat,
      coreMat,
      isYellow,
      seed: i * 97 + 13,
      lastKey: -1,
    });
  }
}

function updateBoltGeometry(bolt, from, to, frameKey) {
  const rnd = seeded(bolt.seed * 31 + frameKey * 17);
  const pts = jaggedBolt(from, to, 12, rnd);
  const curve = new THREE.CatmullRomCurve3(pts);
  /* Hairline core; tiny glow halo so 100px emoji still catches a pixel */
  const thick = 0.011 + rnd() * 0.006;
  bolt.glow.geometry.dispose();
  bolt.core.geometry.dispose();
  bolt.glow.geometry = new THREE.TubeGeometry(curve, 40, thick * 2.1, 4, false);
  bolt.core.geometry = new THREE.TubeGeometry(curve, 40, thick, 3, false);
}

function updateRibbonGeometry(rib, t, e, blast) {
  const rnd = seeded(rib.seed + Math.floor(t * 40));
  const reach = rib.len * e * (0.85 + 0.45 * blast);
  const twist = rib.ang + e * rib.twist + blast * 0.35;
  const pts = [];
  for (let k = 0; k < 6; k++) {
    const u = k / 5;
    /* Start away from origin — no central fireball orb */
    const a = twist + Math.sin(u * Math.PI * 1.35 + t * 9) * 0.7 * u;
    const r = 0.85 + reach * (0.05 + 0.95 * u);
    const lift = Math.sin(u * Math.PI) * (1.1 + rnd() * 0.4) * e;
    pts.push(new THREE.Vector3(
      Math.cos(a) * r,
      Math.sin(a) * r + lift * 0.4,
      0.15 + u * 1.25 + Math.sin(u * 5 + t * 14) * 0.25,
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const thick = rib.thick * (0.5 + 0.65 * e) * (1.0 - 0.15 * blast);
  rib.mesh.geometry.dispose();
  rib.mesh.geometry = new THREE.TubeGeometry(curve, 40, Math.max(0.045, thick), 8, false);
}

function loadTex(url) {
  return new Promise((resolve, reject) => {
    loader.load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.anisotropy = 4;
      tex.needsUpdate = true;
      resolve(tex);
    }, undefined, reject);
  });
}

function faceMat(tex, o = {}) {
  return new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: o.opacity ?? 1,
    alphaTest: o.alphaTest ?? 0.04,
    depthWrite: o.depthWrite ?? true,
    side: THREE.DoubleSide,
    toneMapped: false,
  });
}

function depthMat(tex) {
  return new THREE.MeshPhysicalMaterial({
    map: tex,
    color: 0x08080a,
    transparent: true,
    alphaTest: 0.06,
    depthWrite: true,
    side: THREE.DoubleSide,
    roughness: 0.12,
    metalness: 0.88,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    toneMapped: false,
  });
}

/** Thick slab: exact reference pixels on front, glossy black depth stack behind. */
function makeSlab(tex, z) {
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(WORLD, WORLD);
  const front = new THREE.Mesh(geo, faceMat(tex));
  front.position.z = DEPTH * 0.5;
  g.add(front);
  /* Multi-layer black undercover = readable volume when tumbling */
  for (let i = 0; i < 5; i++) {
    const plate = new THREE.Mesh(geo, depthMat(tex));
    plate.position.z = DEPTH * 0.5 - (i + 1) * (DEPTH / 5);
    plate.scale.setScalar(1.012 + i * 0.004);
    g.add(plate);
  }
  g.position.z = z;
  g.userData.front = front;
  root.add(g);
  return g;
}

function track(mesh, opts) {
  pieces.push({
    mesh,
    rest: mesh.position.clone(),
    restRot: mesh.rotation.clone(),
    restScale: mesh.scale.x,
    ang: opts.ang,
    power: opts.power,
    delay: opts.delay,
    spin: opts.spin,
    kind: opts.kind,
    ax: (Math.random() - 0.5) * 2,
    ay: (Math.random() - 0.5) * 2,
    az: (Math.random() - 0.5) * 2,
  });
}

function blackSideMat() {
  return new THREE.MeshPhysicalMaterial({
    color: 0x3a3a45,
    roughness: 0.18,
    metalness: 0.75,
    clearcoat: 1,
    clearcoatRoughness: 0.05,
    emissive: 0x101018,
    emissiveIntensity: 0.15,
    toneMapped: false,
  });
}

/** Solid opaque 3D rubble from reference tiles (skip empty UV cells). */
async function addShatterTiles(tex, parentZ, faceColor, count, kind) {
  const img = tex.image;
  const cvs = document.createElement('canvas');
  const tw = img.width || 512;
  const th = img.height || 512;
  cvs.width = tw;
  cvs.height = th;
  const ctx = cvs.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, tw, th).data;

  const cols = Math.ceil(Math.sqrt(count * 1.1));
  const rows = Math.ceil(count / cols);
  const tileW = WORLD / cols;
  const tileH = WORLD / rows;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (i >= count) break;
      /* Sample alpha coverage in this UV cell */
      const x0 = Math.floor((c / cols) * tw);
      const x1 = Math.floor(((c + 1) / cols) * tw);
      const y0 = Math.floor((r / rows) * th);
      const y1 = Math.floor(((r + 1) / rows) * th);
      let opaque = 0;
      let sr = 0, sg = 0, sb = 0, n = 0;
      for (let y = y0; y < y1; y += 2) {
        for (let x = x0; x < x1; x += 2) {
          const a = data[(y * tw + x) * 4 + 3];
          if (a > 40) {
            opaque++;
            sr += data[(y * tw + x) * 4];
            sg += data[(y * tw + x) * 4 + 1];
            sb += data[(y * tw + x) * 4 + 2];
            n++;
          }
        }
      }
      const cells = Math.max(1, Math.ceil((x1 - x0) / 2) * Math.ceil((y1 - y0) / 2));
      if (opaque / cells < 0.08) { i++; continue; }

      const avg = n
        ? new THREE.Color(sr / n / 255, sg / n / 255, sb / n / 255)
        : new THREE.Color(faceColor);
      const w = tileW * (0.55 + 0.35 * (opaque / cells));
      const h = tileH * (0.55 + 0.35 * (opaque / cells));
      const d = CHUNK_DEPTH * (0.7 + 0.5 * ((i * 13) % 7) / 7);

      const face = new THREE.MeshPhysicalMaterial({
        color: avg,
        roughness: 0.22,
        metalness: 0.12,
        clearcoat: 1,
        clearcoatRoughness: 0.05,
        emissive: avg,
        emissiveIntensity: 0.25,
        toneMapped: false,
      });
      const side = blackSideMat();
      const mats = [side, side, side, side, face, side];
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const lx = (c + 0.5) * tileW - WORLD * 0.5;
      const ly = WORLD * 0.5 - (r + 0.5) * tileH;
      mesh.position.set(lx, ly, parentZ);
      mesh.visible = false;
      root.add(mesh);
      track(mesh, {
        ang: Math.atan2(ly, lx || 0.01),
        power: 0.9 + 0.55 * (i % 5) / 5,
        delay: 0.008 * (i % 6),
        spin: i % 2 ? 2.0 : -2.0,
        kind,
      });
      i++;
    }
  }
}

async function build() {
  const specs = [
    { file: '00_spikes.png', z: -2.8, kind: 'boom', ang: 0.4, power: 1.0, delay: 0.00 },
    { file: '08_rest.png', z: -2.4, kind: 'boom', ang: 1.15, power: 0.55, delay: 0.02 },
    { file: '01_red_squiggle.png', z: -1.4, kind: 'boom', ang: Math.PI * 0.9, power: 0.9, delay: 0.01 },
    { file: '02_black_squiggle.png', z: -1.1, kind: 'boom', ang: 0.85, power: 0.75, delay: 0.015 },
    { file: '03_green_swoop.png', z: -0.55, kind: 'boom', ang: 0.2, power: 0.8, delay: 0.012 },
    { file: '04_red_sphere.png', z: -0.25, kind: 'boom', ang: 0.08, power: 0.85, delay: 0.018 },
    { file: '05_letter_n.png', z: 0.7, kind: 'n' },
    { file: '06_text.png', z: 1.4, kind: 'text' },
  ];

  for (const s of specs) {
    const tex = await loadTex(`./layers_exact/${s.file}?v=${Date.now()}`);
    const slab = makeSlab(tex, s.z);
    slab.userData.kind = s.kind;
    if (s.kind === 'n') {
      brand.n = slab;
      brand.nWholes.push(slab);
      await addShatterTiles(tex, s.z, 0x00e05a, 16, 'nChunk');
    } else if (s.kind === 'text') {
      brand.text = slab;
      brand.tWholes.push(slab);
      await addShatterTiles(tex, s.z, 0xffffff, 28, 'tChunk');
    } else {
      track(slab, {
        ang: s.ang,
        power: s.power,
        delay: s.delay,
        spin: s.ang > 1 ? -1.1 : 1.1,
        kind: 'boom',
      });
    }
  }

  brand.nRest = brand.n.position.clone();
  brand.tRest = brand.text.position.clone();
  brand.nScale = brand.n.scale.x;
  brand.tScale = brand.text.scale.x;

  buildFireBomb();
  buildLightnings();
}

function containRoot() {
  const hidden = [];
  for (const p of pieces) {
    if (p.kind === 'nChunk' || p.kind === 'tChunk') {
      hidden.push(p.mesh);
      p.mesh.visible = false;
      p.mesh.parent?.remove(p.mesh);
    }
  }
  root.scale.setScalar(1);
  root.position.set(0, 0, 0);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, 1e-6);
  const viewSpan = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
  root.scale.setScalar((viewSpan * REST_SCALE) / span);
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.x -= c.x;
  root.position.y -= c.y;
  for (const m of hidden) root.add(m);
  for (const p of pieces) {
    p.rest = p.mesh.position.clone();
    p.restRot = p.mesh.rotation.clone();
    p.restScale = p.mesh.scale.x;
  }
  brand.nRest = brand.n.position.clone();
  brand.tRest = brand.text.position.clone();
  root.userData.baseScale = root.scale.x;
}

function applyFrame(fr) {
  const t = (fr - 1) / Math.max(1, TOTAL - 1);
  const boomAmt = trap(t, 0.04, 0.20, 0.52, 0.88);
  const zoomN = trap(t, 0.10, 0.26, 0.46, 0.76);
  const zoomT = trap(t, 0.28, 0.44, 0.60, 0.86);
  const destroy = trap(t, 0.14, 0.32, 0.58, 0.94);

  /* Wholes punch then shatter into reference-textured chunks */
  const showWhole = destroy < 0.28;
  for (const w of brand.nWholes) w.visible = showWhole;
  for (const w of brand.tWholes) w.visible = showWhole;

  if (brand.n && showWhole) {
    const n = brand.n;
    const rp = brand.nRest;
    n.position.set(rp.x, rp.y + 0.15 * zoomN, rp.z + 0.7 * zoomN + 0.25 * boomAmt);
    n.rotation.set(-0.08 * zoomN, 0.1 * boomAmt, 0.04 * zoomN);
    n.scale.setScalar(brand.nScale * (1 + 0.08 * zoomN));
  }
  if (brand.text && showWhole) {
    const tx = brand.text;
    const rp = brand.tRest;
    tx.position.set(rp.x, rp.y - 0.08 * zoomT, rp.z + 0.45 * zoomT + 0.15 * boomAmt);
    tx.rotation.set(0.06 * zoomT, -0.08 * zoomT, 0.04 * zoomT);
    tx.scale.setScalar(brand.tScale * (1 + 0.06 * zoomT));
  }

  for (const p of pieces) {
    const isChunk = p.kind === 'nChunk' || p.kind === 'tChunk';
    const e = trap(t, p.delay, 0.16 + p.delay, 0.52, 0.9);
    const d = isChunk ? trap(t, 0.16 + p.delay, 0.32 + p.delay, 0.58, 0.94) : e;

    if (isChunk) {
      p.mesh.visible = d > 0.02;
      if (d <= 0.02) continue;
    }

    const amt = isChunk ? d : Math.max(e, e * boomAmt);
    /* Explode outward + ZOOM OUT so tips never leave the canvas */
    const fly = amt * p.power * (isChunk ? 2.6 : 2.0);
    const shrink = Math.max(0.22, 1 - amt * (isChunk ? 0.58 : 0.48));
    p.mesh.position.set(
      p.rest.x + Math.cos(p.ang) * fly,
      p.rest.y + Math.sin(p.ang) * fly,
      p.rest.z + amt * (0.5 + 1.0 * p.power),
    );
    p.mesh.rotation.set(
      p.restRot.x + amt * p.spin * 2.4 + d * p.ax * 4.2,
      p.restRot.y + amt * p.spin * 2.0 + d * p.ay * 4.2,
      p.restRot.z + amt * p.spin * 2.8 + d * p.az * 4.8,
    );
    p.mesh.scale.setScalar(p.restScale * shrink);
  }

  /* Global shrink during boom — containment belt */
  const contain = 1 - 0.36 * Math.max(boomAmt, destroy);
  root.scale.setScalar(root.userData.baseScale * contain);
  root.rotation.set(
    0.05 * boomAmt + 0.12 * destroy,
    0.1 * boomAmt + 0.18 * destroy + 0.04 * zoomT,
    0.03 * zoomN + 0.06 * destroy,
  );
  camera.position.set(
    0.2 + 2.5 * destroy + 1.2 * boomAmt,
    0.15 + 1.8 * destroy + 0.8 * boomAmt,
    42 + 0.5 * boomAmt,
  );
  camera.lookAt(0, 0, 0);

  /* ——— Curved flames + thin yellow/blue lightning (no orb) ——— */
  const blast = trap(t, 0.10, 0.20, 0.52, 0.92);
  const flash = trap(t, 0.13, 0.17, 0.22, 0.34);
  const fireBoost = 1 / Math.max(0.55, contain);

  fireLight.intensity = 10 + 85 * blast + 45 * flash;
  fireLight2.intensity = 5 + 55 * blast;
  fireLight.color.setHex(flash > 0.3 ? 0xffe080 : 0xff3a00);
  fireLight2.color.setHex(0xffcc33);

  /* Curved 3D flame ribbons */
  for (const rib of ribbons) {
    const e = trap(t, 0.10 + rib.delay, 0.22 + rib.delay, 0.55, 0.9);
    if (e < 0.02) {
      rib.mat.opacity = 0;
      rib.mesh.visible = false;
      continue;
    }
    updateRibbonGeometry(rib, t, e, blast);
    rib.mesh.visible = true;
    rib.mat.opacity = Math.min(0.85, e * 1.1) * (1 - 0.32 * destroy);
  }

  for (const f of flames) {
    const e = trap(t, 0.10 + f.delay, 0.22 + f.delay, 0.55, 0.92);
    if (e < 0.01) {
      f.mat.opacity = 0;
      f.spr.visible = false;
      continue;
    }
    f.spr.visible = true;
    const bend = f.curve * Math.sin(e * Math.PI) * e;
    const ang = f.ang + e * f.spin + bend;
    const rad = f.r0 * e * (1.1 + 0.8 * blast) * (0.9 + 0.2 * fireBoost);
    const y = f.rise * e * e * 1.6;
    f.spr.position.set(
      Math.cos(ang) * rad,
      Math.sin(ang) * rad * 0.9 + y * 0.4,
      0.35 + e * 1.4 + f.zBias,
    );
    const flicker = 0.82 + 0.3 * Math.sin(t * 52 + f.delay * 28 + f.ang);
    const fs = f.size * e * (1.3 - 0.3 * destroy) * fireBoost * flicker;
    f.spr.scale.set(fs * (f.isSpark ? 1 : 0.62), fs * (f.isSpark ? 1 : 1.7), 1);
    f.mat.opacity = Math.min(0.9, e * 1.35) * (1 - 0.32 * destroy);
    f.mat.rotation = ang * 0.2 + e * f.spin * 0.45;
  }

  const livePieces = pieces.filter((p) => p.mesh.visible && p.mesh.parent);
  const gapPool = livePieces.filter((p) => p.kind === 'nChunk' || p.kind === 'tChunk' || p.kind === 'boom');
  const pool = gapPool.length >= 2 ? gapPool : livePieces;
  for (let gi = 0; gi < gapFlames.length; gi++) {
    const gf = gapFlames[gi];
    const e = trap(t, 0.14 + gf.delay, 0.26 + gf.delay, 0.5, 0.88);
    if (e < 0.02 || pool.length < 2) {
      gf.mat.opacity = 0;
      gf.spr.visible = false;
      continue;
    }
    const i0 = (gf.pair * 3 + Math.floor(t * 18)) % pool.length;
    const i1 = (i0 + 2 + (gi % 4)) % pool.length;
    if (i0 === i1) {
      gf.spr.visible = false;
      continue;
    }
    pool[i0].mesh.getWorldPosition(_tmpA);
    pool[i1].mesh.getWorldPosition(_tmpB);
    root.worldToLocal(_tmpA);
    root.worldToLocal(_tmpB);
    const dist = _tmpA.distanceTo(_tmpB);
    if (dist < 0.6 || dist > 11) {
      gf.spr.visible = false;
      continue;
    }
    _tmpC.lerpVectors(_tmpA, _tmpB, 0.3 + 0.35 * ((gi % 3) / 2));
    _tmpC.z += 0.4;
    gf.spr.position.copy(_tmpC);
    const gs = gf.size * e * fireBoost * (0.9 + 0.25 * Math.sin(t * 35 + gi));
    gf.spr.scale.set(Math.min(dist * 0.7, gs * 1.5), gs * 1.25, 1);
    gf.mat.opacity = Math.min(0.8, e * 1.05) * (1 - 0.3 * destroy);
    gf.mat.rotation = Math.atan2(_tmpB.y - _tmpA.y, _tmpB.x - _tmpA.x) + 0.35 * Math.sin(t * 20 + gi);
    gf.spr.visible = true;
  }

  const boltPool = pool;
  const frameKey = Math.floor(t * 24);
  for (let bi = 0; bi < bolts.length; bi++) {
    const bolt = bolts[bi];
    const pulse = trap(t, 0.15 + (bi % 5) * 0.03, 0.20 + (bi % 5) * 0.03, 0.34 + (bi % 5) * 0.04, 0.68);
    const flicker = Math.sin(t * 130 + bolt.seed) * 0.5 + 0.5;
    if (pulse < 0.04 || boltPool.length < 2) {
      bolt.glowMat.opacity = 0;
      bolt.coreMat.opacity = 0;
      bolt.glow.visible = false;
      bolt.core.visible = false;
      continue;
    }
    const i0 = (bolt.seed + frameKey * 2) % boltPool.length;
    const i1 = (i0 + 3 + (bi % 6)) % boltPool.length;
    if (i0 === i1) {
      bolt.glow.visible = false;
      bolt.core.visible = false;
      continue;
    }
    boltPool[i0].mesh.getWorldPosition(_tmpA);
    boltPool[i1].mesh.getWorldPosition(_tmpB);
    root.worldToLocal(_tmpA);
    root.worldToLocal(_tmpB);
    const dist = _tmpA.distanceTo(_tmpB);
    if (dist < 0.9 || dist > 13) {
      bolt.glow.visible = false;
      bolt.core.visible = false;
      continue;
    }
    if (bolt.lastKey !== frameKey) {
      updateBoltGeometry(bolt, _tmpA, _tmpB, frameKey + bi);
      bolt.lastKey = frameKey;
    }
    bolt.glow.visible = true;
    bolt.core.visible = true;
    const op = pulse * (0.65 + 0.35 * flicker);
    /* High opacity so hair-thin bolts survive emoji downsample */
    bolt.glowMat.opacity = Math.min(1, op * 0.85);
    bolt.coreMat.opacity = Math.min(1, op * 1.25);
    if (bolt.isYellow) {
      bolt.glowMat.color.setHex(0xff9900);
      bolt.coreMat.color.setHex(0xffe14a);
    } else {
      bolt.glowMat.color.setHex(0x1080ff);
      bolt.coreMat.color.setHex(0x7ec8ff);
    }
  }
  boltLight.intensity = 18 * blast * (0.4 + 0.6 * Math.sin(t * 85));
  boltLight.color.setHex(Math.sin(t * 40) > 0 ? 0xffe066 : 0x88ccff);

  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

window.setFrame = (fr) => { applyFrame(fr); return fr; };
window.TOTAL = TOTAL;
window.ready = false;

(async () => {
  try {
    await build();
    containRoot();
    applyFrame(1);
    window.ready = true;
    console.log('TRUE3D_READY');
  } catch (e) {
    console.error('TRUE3D_FAIL', e);
  }
})();
</script>
</body>
